<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Extranet — Elite Escapes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=EB+Garamond:wght@500;600&family=Marcellus&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f8;--surface:#fff;--ink:#1a2733;--ink2:#5a6b7a;--ink3:#93a1af;--line:#e4e9ee;--line2:#eef2f5;
--brand:#0e9f8e;--brand2:#0b7e70;--brandsoft:#e6f6f4;--income:#12a56f;--incomesoft:#e5f6ee;--expense:#e2574b;--expensesoft:#fbe9e7;
--gold:#c9a45c;--pulse:#2f7fd6;--shadow:0 1px 2px rgba(16,32,48,.05),0 6px 20px -8px rgba(16,32,48,.12);--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Inter","IBM Plex Sans Thai",system-ui,sans-serif}
a{color:var(--brand)}
h1{font-size:22px;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
.mini{font-size:12px;color:var(--ink3)}
.muted{color:var(--ink2)}
button{font:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;box-shadow:var(--shadow);transition:.13s}
.btn:hover{border-color:#cdd6de}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.inc{background:linear-gradient(135deg,#18b579,#0f8f60);border-color:transparent;color:#fff}
.btn.exp{background:linear-gradient(135deg,#ef6a5e,#d8483c);border-color:transparent;color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line)}
.btn.danger{color:var(--expense);border-color:#f0c9c4}
.btn.link{border:none;background:none;box-shadow:none;color:var(--brand);padding:4px 2px}
input,select{font:inherit;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);outline:none;width:100%}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandsoft)}
label{font-size:12px;font-weight:600;color:var(--ink2);display:block;margin-bottom:4px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
.pill.inc{background:var(--incomesoft);color:#0c7d52}
.pill.exp{background:var(--expensesoft);color:#b83c31}
.pill.fc{background:#e8f0fb;color:#2565aa}
.pill.off{background:#eef2f5;color:#8a98a5}
/* layout */
:root{--side-w:248px;--top-h:64px}
/* left sidebar nav — PISONA-style grouped dark card (below full-width header) */
.side{position:fixed;top:calc(var(--top-h) + var(--band-h,0px));left:0;bottom:0;width:var(--side-w);z-index:40;
  display:flex;flex-direction:column;padding:14px;gap:0;overflow:visible;
  border-left:4px solid #1f5fa0}
.sidecard{flex:1;min-height:0;overflow-y:auto;-ms-overflow-style:none;scrollbar-width:thin;
  background:linear-gradient(180deg,#40566a 0%,#1c3d5a 48%,#0b2338 100%);
  border-radius:18px;padding:18px 12px;display:flex;flex-direction:column;gap:6px;
  box-shadow:0 14px 40px -18px rgba(9,24,44,.6)}
.sidecard::-webkit-scrollbar{width:6px}
.sidecard::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px}
.side-title{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:#d8b568;padding:2px 12px 8px}
.navgrp{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.navgrp:first-of-type{margin-top:0}
.navlbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:#d8b65e;padding:8px 12px 4px}
.sidecard button{display:block;width:100%;text-align:left;background:none;border:none;
  color:rgba(255,255,255,.82);padding:10px 13px;margin:0;cursor:pointer;font-weight:600;
  font-size:13px;letter-spacing:.01em;white-space:nowrap;border-radius:10px;line-height:1.1;
  transition:background .12s,color .12s}
.sidecard button:hover{color:#fff;background:rgba(255,255,255,.08)}
.sidecard a.navext{display:block;padding:10px 13px;border-radius:10px;color:rgba(255,255,255,.62);font-weight:600;font-size:12.5px;text-decoration:none;white-space:nowrap}
.sidecard a.navext:hover{color:#fff;background:rgba(255,255,255,.08)}
.sidecard button.on{color:#123453;background:#fff;font-weight:700;
  box-shadow:0 4px 14px -6px rgba(0,0,0,.4)}
/* full-width top header (logo left · search · user right) — matches public site */
.top{position:sticky;top:0;z-index:50;background:#fff;color:var(--ink);border-bottom:1px solid var(--line);box-shadow:0 2px 12px -8px rgba(16,32,48,.18)}
.top-in{max-width:none;margin:0;display:flex;align-items:center;gap:22px;padding:0 24px;height:var(--top-h)}
.top-in .brand{flex:none;display:flex;align-items:center}
.top-in .brand .logo{height:40px;width:auto;display:block}
.top-in .brand-tag{margin-left:14px;padding-left:14px;border-left:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#b8912e;line-height:28px}
.top .right{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2);white-space:nowrap;flex:none}
.gsearch{position:relative;flex:1 1 auto;max-width:none;margin:0}
/* company switch (segmented) + colour band under the top bar — Club Unique = deep red, Elite Escapes = navy */
.coseg{display:inline-flex;flex:none;border:1px solid #b8912e;border-radius:22px;overflow:hidden;background:#fff}
.coseg:empty{display:none}
.coseg button{border:0;background:#fff;color:#14324a;font:600 13px/1 inherit;padding:9px 16px;cursor:pointer;white-space:nowrap}
.coseg button+button{border-left:1px solid #e3d3a8}
.coseg button:hover:not(.on){background:#fbf6ea}
.coseg button.on{color:#fff;cursor:default}
.yearsel{flex:none;display:flex;align-items:center}
.yearsel:empty{display:none}
.yearsel select{width:auto;padding:8px 12px;border-radius:22px;border:1px solid #b8912e;font:600 12.5px/1 inherit;color:#14324a;background:#fff;cursor:pointer}
.yearsel select:focus{outline:none;box-shadow:0 0 0 3px rgba(184,145,46,.18)}
.coband{height:24px;display:flex;align-items:center;padding:0 24px;font-size:11.5px;font-weight:700;letter-spacing:.14em;color:#fff}
@media(max-width:720px){ .coseg button{padding:6px 9px;font-size:11px} .yearsel select{padding:6px 8px;font-size:11px;max-width:122px} .coband{padding:0 14px;font-size:10.5px}
  .top-in{gap:10px;padding:0 12px} .top-in .brand-tag{display:none} .gsearch{flex:1 1 60px;min-width:60px} .gsearch input{width:100%!important} .top .right{font-size:11px} }
#topfilter{flex:none;display:flex;align-items:center}
#topfilter select{width:auto;min-width:180px;padding:10px 14px;border-radius:10px;border:1px solid #b8912e;font-size:13.5px}
#topfilter select:focus{border-color:#b8912e;box-shadow:0 0 0 3px rgba(184,145,46,.18)}
#topfilter:empty{display:none}
.top .right{margin-left:auto}
.gsearch input{width:100%;padding:10px 14px;border-radius:10px;background:#fff;border:1px solid #b8912e;font-size:13.5px}
.gsearch input:focus{background:#fff;border-color:#b8912e;box-shadow:0 0 0 3px rgba(184,145,46,.18)}
.gsres{position:absolute;top:calc(100% + 8px);right:0;width:380px;max-width:86vw;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:60;padding:6px}
.gsres.hide{display:none}
.gsres .grp{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);padding:9px 10px 4px;font-weight:700}
.gsitem{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
.gsitem:hover,.gsitem.hl{background:var(--brandsoft)}
.gsitem .ic{font-size:16px;flex:none;width:20px;text-align:center}
.gsitem .tx b{font-size:13px;color:var(--ink)}
.gsitem .tx .s{font-size:11px;color:var(--ink2)}
.gsempty{padding:14px 12px;color:var(--ink3);font-size:12.5px}
@media(max-width:720px){.gsearch input{width:130px}.gsres{width:300px}#topfilter select{min-width:0;max-width:120px}}
.top .right a{color:#e08128}
.wrap{max-width:none;margin:0 0 0 var(--side-w);padding:22px 28px 80px} /* fill the screen width on big monitors */
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.head .sp{flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:var(--shadow)}
.seg button{border:none;background:none;padding:7px 15px;cursor:pointer;color:var(--ink2);font-weight:500;font-size:13px}
.seg button.on{background:var(--brand);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.mkr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:16px}
.mkr-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:8px}
.mkr-bars{width:100%;border-collapse:collapse}.mkr-bars td{padding:3px 6px;border:none;font-size:13px}.mkr-bars td.lab{white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.mkr-bar{height:12px;background:var(--line2);border-radius:6px;overflow:hidden}.mkr-bar i{display:block;height:100%;background:#9fb8b4;border-radius:6px}
.mkr-kv{width:100%}.mkr-kv td{padding:3px 0;border:none;font-size:13px}.mkr-ins{margin:0;padding-left:18px;line-height:1.7}
@media(max-width:600px){.mkr-2{grid-template-columns:1fr}}
.kpi .l{font-size:12px;color:var(--ink3);margin-top:2px}
/* matrix */
.scroll{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:9px 13px;white-space:nowrap;border-bottom:1px solid var(--line2);text-align:left}
thead th{position:sticky;top:0;background:#f7f9fb;z-index:2;font-weight:600;color:var(--ink2);font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.mx .lab{position:sticky;left:0;background:var(--surface);z-index:1;min-width:220px;font-weight:500}
.mx thead th.lab{z-index:3}
.mx tr.sec td{background:#f2f6f8;text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;color:var(--ink3);font-weight:700}
.mx tr.grp .lab{font-weight:700;cursor:pointer}
.mx tr.item .lab{padding-left:30px;color:var(--ink2);font-weight:500}
.mx tr.item td.n{color:var(--ink)}
.mx tr.beg td,.mx tr.end td{background:var(--brandsoft);font-weight:700}
.mx tr.end td{border-top:2px solid #cfe7e3}
.mx tr.pulse td{background:#eef5fd;color:#1f5f9e;font-weight:600}
.mx tr.tot td{font-weight:700;border-top:1px solid var(--line)}
.mx tr.item:hover td{background:#f8fbfc}
.click{cursor:pointer}
/* modal */
#mw{position:fixed;inset:0;z-index:80;background:rgba(15,30,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
#mw.hide{display:none}
.modal{background:#fff;border-radius:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);width:min(720px,100%);padding:22px 24px;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .full{grid-column:1/3}
.right{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.lines th,.lines td{padding:6px 8px}
.lines input,.lines select{padding:6px 8px}
.emptyc{text-align:center;color:var(--ink3);padding:48px 20px}
.emptyc .big{font-size:40px;opacity:.4}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#12303c;color:#fff;padding:11px 20px;border-radius:10px;box-shadow:0 12px 40px -8px rgba(0,0,0,.5);z-index:120;opacity:0;transition:.25s;pointer-events:none;font-size:13.5px}
#toast.show{opacity:1}
/* gate */
#gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#0f2a3d;overflow:hidden;transition:opacity .5s}
/* login: form left (white, logo top-left) · resort photo right — layout after the reference the user sent */
#gate.split{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;justify-items:stretch;background:#fff}
#gate.split .gsign{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:90px 6vw 80px;font-family:'Nunito Sans',system-ui,sans-serif}
#gate.split .glogo{position:absolute;top:28px;left:32px;height:48px;width:auto}
#gate.split .gbox{width:100%;max-width:400px;text-align:left}
#gate.split .gsign h2{margin:0;font-size:26px;font-weight:700;color:#14324a}
#gate.split .gsign .gsub{margin:4px 0 26px;font-size:15px;color:#5b6775}
#gate.split .gbtn{width:100%;padding:13px;border-radius:8px;background:#fff;border:1px solid #c9ced6;color:#14324a;font-family:'Nunito Sans',system-ui,sans-serif;font-weight:700;font-size:15px}
#gate.split .gbtn:hover{border-color:#b8912e;background:#fbf6ea}
#gate.split .gnote{margin-top:22px;font-size:12.5px;color:#8a95a3}
#gate.split .gerr{color:#c0392b;margin-top:10px;min-height:0}
#gate.split .gmsg{color:#1f7a4d;font-size:13px;margin-top:8px}
#gate.split .gor{display:flex;align-items:center;gap:14px;margin:22px 0 6px;font-size:12px;color:#6b7785}
#gate.split .gor::before,#gate.split .gor::after{content:"";flex:1;height:1px;background:#e3e7ec}
#gate.split .gfld{display:block;margin-top:14px}
#gate.split .gfld span{display:block;font-size:13px;color:#5b6775;margin-bottom:2px}
#gate.split .gfld input{border:0;border-bottom:1px solid #b9c1cb;border-radius:0;padding:8px 0;font-size:15px;background:transparent;box-shadow:none}
#gate.split .gfld input:focus{border-bottom:2px solid #b8912e;box-shadow:none}
#gate.split .glink{display:inline-block;margin-top:12px;font-size:14px;color:#14324a}
#gate.split .glink:hover{color:#b8912e}
#gate.split .gsubmit{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:#14324a;color:#fff;font:700 15px 'Nunito Sans',system-ui,sans-serif;cursor:pointer}
#gate.split .gsubmit:hover{background:#1c4466}
#gate.split .gsubmit:disabled{opacity:.6;cursor:wait}
#gate.split .galt{margin-top:18px;font-size:14px;color:#3d4955}
#gate.split .galt a{color:#b8912e;font-weight:700;text-decoration:none}
#gate.split .gfoot{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:13px;color:#98a2ad}
#gate.split .gfoot a{color:#14324a;text-decoration:underline;text-underline-offset:3px;margin:0 4px}
#gate.split .gfoot a:hover{color:#b8912e}
/* right side = photo mosaic (mixed sizes, portrait + landscape, layered shadows) + brand tile with Elite + Interval */
#gate.split .gphoto{position:relative;background:#f3eee4;overflow:hidden}
#gate.split .gmosaic{position:absolute;inset:0;padding:22px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr)) auto;gap:12px}
#gate.split .gt{border-radius:16px;background:#1c3d5a center/cover no-repeat;box-shadow:0 14px 30px -14px rgba(15,42,61,.45),0 2px 6px rgba(15,42,61,.12);min-height:0}
#gate.split .t1{grid-area:1/1/4/4;background-image:url(login/pool-aerial.jpg)}
#gate.split .tb{grid-area:1/4/3/7}
#gate.split .t2{grid-area:3/4/5/6;background-image:url(login/spa.jpg)}
#gate.split .t3{grid-area:3/6/6/7;background-image:url(login/sunset.jpg);background-position:30% center}
#gate.split .t4{grid-area:4/1/6/3;background-image:url(login/rooftop.jpg)}
#gate.split .t5{grid-area:4/3/6/4;background-image:url(login/lounge.jpg);background-position:60% center;transform:translateY(-8px) scale(1.03);z-index:1;box-shadow:0 22px 40px -14px rgba(15,42,61,.55)}
#gate.split .t6{grid-area:5/4/6/6;background-image:url(login/paradise.jpg)}
#gate.split .tb{background:linear-gradient(160deg,#1c3d5a,#0b2338);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px 18px;border:1px solid rgba(216,182,94,.35);overflow:hidden}
#gate.split .tb img{width:82%;max-width:340px;height:auto}
#gate.split .tb .tdiv{width:48px;height:1px;background:#b8912e;margin:4px 0}
#gate.split .tb .iilogo{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
#gate.split .tb .iilogo small{font:600 10.5px 'Nunito Sans',system-ui,sans-serif;letter-spacing:.3em;color:rgba(243,238,228,.7)}
#gate.split .tb .iilogo b{font:400 17px Marcellus,Georgia,serif;letter-spacing:.22em;color:#dcbb7f}
#gate.split .tb .iilogo img{height:34px;width:auto}
#gate.split .gcap{grid-area:6/1/7/7;position:relative;background:rgba(28,61,90,.9);border:1px solid rgba(216,182,94,.25);box-shadow:0 14px 34px -10px rgba(0,0,0,.55);border-radius:16px;padding:16px 20px;color:#f3eee4;font-family:'Nunito Sans',system-ui,sans-serif}
#gate.split .gcap .gtag{font-family:Marcellus,Georgia,serif;letter-spacing:.3em;font-size:12.5px;color:#dcbb7f}
#gate.split .gcap p{margin:6px 0 10px;font-size:15px;line-height:1.55}
#gate.split .gcap .gmodl{font-size:12.5px;color:rgba(243,238,228,.72);line-height:1.8}
#gate.split .gcap .gmodl b{color:#d8b65e;font-weight:700;letter-spacing:.06em}
@media(max-width:760px){ #gate.split{grid-template-columns:1fr} #gate.split .gphoto{display:none} #gate.split .glogo{left:50%;transform:translateX(-50%)} #gate.split .gsign{text-align:center} }
#gate.bye{opacity:0;pointer-events:none}
#gate .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 15s ease-in-out infinite alternate}
#gate .o1{width:520px;height:520px;background:#12564c;top:-150px;left:-120px}
#gate .o2{width:420px;height:420px;background:#123252;bottom:-130px;right:-80px;animation-delay:-7s}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(60px,40px)}}
.gatecard{position:relative;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:40px 40px 30px;width:min(400px,92vw);text-align:center;color:#fff;backdrop-filter:blur(12px)}
.gatecard .k{font-size:10px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:#6fd3bd}
.gatecard .w{font-size:26px;font-weight:700;margin:8px 0 3px}
.gatecard .s{font-size:13px;opacity:.7;margin-bottom:24px}
.gbtn{width:100%;padding:12px;border-radius:11px;border:none;background:#fff;color:#3c4043;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
.gerr{min-height:18px;font-size:12.5px;color:#ff9b8a;margin-top:12px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}.grid2 .full{grid-column:1}.top-in{gap:10px;padding:0 14px}
  .top-in .brand .logo{height:32px}
  .gsearch{max-width:none}
  .wrap{margin-left:0;padding:18px 16px 80px}
  .side{position:static;top:auto;width:auto;flex-direction:row;align-items:center;gap:8px;padding:8px 10px;overflow:visible;border-left:none}
  .sidecard{flex:1;min-height:0;flex-direction:row;align-items:center;gap:2px;overflow-x:auto;overflow-y:hidden;
    padding:6px 8px;border-radius:14px}
  .side-title,.navlbl{display:none}
  .navgrp{flex-direction:row;gap:2px;margin:0;padding:0 2px;border-left:1px solid rgba(255,255,255,.14)}

<script>
/* ============ config ============ */
const SB_URL='https://vpsrfukevrcaapwlkoop.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwc3JmdWtldnJjYWFwd2xrb29wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5ODA4ODgsImV4cCI6MjEwMjU1Njg4OH0.F9ClGxUU0WjG_d-H2Ic3f48Bvoc1IhBPFEP3W6F1h-w';
const SBC = window.supabase ? window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}}) : null;

const REPEATS=[['never','One-time'],['weekly','Weekly'],['biweekly','Biweekly'],['monthly','Monthly'],['bimonthly','Bimonthly'],['quarterly','Quarterly'],['biannually','Biannually'],['annually','Annually']];
const REPSTEP={weekly:{d:7},biweekly:{d:14},monthly:{m:1},bimonthly:{m:2},quarterly:{m:3},biannually:{m:6},annually:{m:12}};

const CURSYM={THB:'฿',USD:'US$',GBP:'£',EUR:'€',AUD:'A$'};

/* ============ state + data ============ */
let DB={companies:[],accounts:[],categories:[],entries:[],lines:[]};
const today=new Date(); const TODAY=iso(today);
const S={tab:'dashboard', view:'month', start:TODAY.slice(0,7), span:12, q:'', repType:'all',
  report:'ie', rStart:TODAY.slice(0,7), rSpan:12, excludePast:false, collapsed:{}, rcOpen:{},
  bankDate:TODAY, bankCompany:'all', bankBank:'all', bankType:'all', bankQ:'', bankShowFull:false, bankAuditPage:0, weekRef:TODAY,

/* ============ helpers ============ */
function iso(d){ const p=x=>String(x).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function addDaysISO(s,n){ const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d+n); return iso(dt); }
function addMonthsISO(s,n){ const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1+n,1); const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate(); dt.setDate(Math.min(d,last)); return iso(dt); }
function lastDayOfMonth(key){ const [y,m]=key.split('-').map(Number); return key+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0'); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(p){ return (p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function curSym(){ const a=primaryAccount(); return CURSYM[(a&&a.currency)||'THB']||'฿'; }
function fmt(n){ n=Math.round((n||0)); return curSym()+n.toLocaleString('en-US'); }
function fB(n){ return '฿'+Math.round(n||0).toLocaleString('en-US'); }  /* OPC Wages/Taxi = THB always */
function fmtSigned(n){ return (n<0?'-':'')+curSym()+Math.abs(Math.round(n||0)).toLocaleString('en-US'); }
function fmtDate(s){ if(!s) return '—'; const [y,m,d]=s.split('-').map(Number); return MON[m-1]+' '+d+', '+y; }
function primaryAccount(){ return DB.accounts.find(a=>a.is_primary) || DB.accounts[0] || null; }
function g(id){ return document.getElementById(id); }
function toast(m){ const t=g('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function openModal(html){ const w=g('mw'); w.innerHTML='<div class="modal">'+html+'</div>'; w.classList.remove('hide'); }
function closeModal(){ g('mw').classList.add('hide'); g('mw').innerHTML=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* occurrences for a line within [from,to] */
function occ(line, from, to){
  const out=[], base=line.txn_date; if(!base) return out;
  const amt=Number(line.amount)||0;
  const fa=(line.forecast_amount!=null&&line.forecast_amount!=='')?Number(line.forecast_amount):amt;
  const mode=line.repeat||'never', step=REPSTEP[mode];
  const push=dt=>out.push({date:dt,amount:amt,famount:fa});
  if(mode==='never'||!step){ if(base>=from&&base<=to) push(base); return out; }
  const until=line.repeat_until||to;
  for(let i=0;i<800;i++){
    const dt= step.d? addDaysISO(base,step.d*i) : addMonthsISO(base,step.m*i);
    if(dt>to) break; if(dt>until) break;
    if(dt>=from) push(dt);
  }
  return out;
}
/* flatten all lines with parent entry */
function allLines(){ const em=Object.fromEntries(DB.entries.map(e=>[e.id,e])); const co=S&&S.company;
  return DB.lines.map(l=>({l,e:em[l.entry_id]})).filter(x=>x.e && (!co || x.e.company===co || !x.e.company)); }
/* top-bar company switch (option C, 2026-09-25): one button per company + "Total" (combined view, added on the user's request
   2026-09-25) and a contract-year selector; colour band under the bar says what you are looking at */
const CO_COLOR={'Club Unique':'#7a2e2e','Elite Escapes':'#14324a'};
const CO_ALL_COLOR='#5b5446';
function coColor(n){ return n?(CO_COLOR[n]||'#14324a'):CO_ALL_COLOR; }
function coLabel(){ return (S&&S.company)||'All companies'; }
function yearLabel(){ const y=S&&S.year; return !y||y==='all'?'All years':(Number(y)>=CUR_YEAR_NOW?'Year '+y+' onwards':'Year '+y); }
function fillCoSwitch(){ const s=g('coswitch'), b=g('coband'), ys=g('yearsel'); if(!s) return; const cos=(DB&&DB.companies)||[]; const cur=(S&&S.company)||'';
  if(!USER||!cos.length){ s.innerHTML=''; if(ys) ys.innerHTML=''; if(b) b.hidden=true; document.documentElement.style.setProperty('--band-h','0px'); return; }
  const btn=(on,label,col,click)=>`<button type="button" class="${on?'on':''}" style="${on?'background:'+col:''}" ${on?'aria-pressed="true"':''} onclick="${click}">${label}</button>`;
  s.innerHTML=cos.map((c,i)=>btn(cur===c.name,esc(c.name),coColor(c.name),`switchCompany(${i})`)).join('')+btn(!cur,'All',CO_ALL_COLOR,'switchCompany(-1)');
  if(ys){ const yrs=[]; for(let y=CUR_YEAR_NOW; y>=YEAR_MIN; y--) yrs.push(String(y)); const v=S.year||'all';
    ys.innerHTML=`<select onchange="setYear(this.value)" title="Choose contract year — loads only the selected year so it stays fast">${yrs.map(y=>`<option value="${y}"${v===y?' selected':''}>${Number(y)===CUR_YEAR_NOW?'Contracts '+y+'+':'Contracts '+y}</option>`).join('')}<option value="all"${v==='all'?' selected':''}>All years (load everything)</option></select>`; }
  if(b){ b.hidden=false; b.style.background=coColor(cur); b.textContent=(cur?'Working in '+String(cur).toUpperCase():'Viewing all companies')+' · '+yearLabel(); }
  document.documentElement.style.setProperty('--band-h','24px'); }
function switchCompany(i){ if(i<0){ if(!S.company) return; setCompany(''); toast('Showing all companies combined'); return; }
  const c=(DB.companies||[])[i]; if(!c||c.name===S.company) return; setCompany(c.name); toast('Switched to '+c.name); }
/* One company at a time by default; "Total" = combined view (S.coAll, S.company=''). Pages that must stay per company (Commission pay slips) ask to pick one. Remembered per viewer. */
function pickCompany(){ const names=(DB.companies||[]).map(c=>c.name); if(!names.length) return;
  if(S.coAll){ S.company=''; return; }
  if(S.company && names.includes(S.company)) return;
  let saved=''; try{ saved=localStorage.getItem('ee_company')||''; }catch(e){}
  if(saved==='__all'){ S.coAll=true; S.company=''; return; }
  S.company=names.includes(saved)?saved:(names.includes('Elite Escapes')?'Elite Escapes':names[0]); }
function setCompany(v){ S.coAll=!v; S.company=v||''; try{ localStorage.setItem('ee_company',v||'__all'); }catch(e){} render(); }

function initYear(){ let y=''; try{ y=localStorage.getItem('ee_year')||''; }catch(e){} S.year=(y==='all'||/^\d{4}$/.test(y))?y:String(CUR_YEAR_NOW); }
function entriesPath(){ const y=S.year||'all'; let p='cf_entries?select=*&order=title.asc,id.asc';
  if(y!=='all') p+='&or=(sign_year.is.null,sign_year.'+(Number(y)>=CUR_YEAR_NOW?'gte':'eq')+'.'+Number(y)+')';
  return p; }
function linesFor(entries,lines){ const ids=new Set((entries||[]).map(e=>e.id)); return (lines||[]).filter(l=>ids.has(l.entry_id)); }
async function setYear(y){ S.year=y; try{ localStorage.setItem('ee_year',y); }catch(e){} S.rcLim=60; S.syLim=60; S.fuLim=50; await loadAll(); toast('Showing contracts: '+yearLabel()); }

/* ============ Supabase REST ============ */
async function token(){ try{ const {data}=await SBC.auth.getSession(); return (data&&data.session)?data.session.access_token:SB_KEY; }catch(e){ return SB_KEY; } }
async function api(path, opts={}){
  const tok=await token();
  const r=await fetch(SB_URL+'/rest/v1/'+path, Object.assign({},opts,{headers:Object.assign({apikey:SB_KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json',Prefer:opts.prefer||''},opts.headers||{})}));
  if(!r.ok) throw new Error((await r.text()).slice(0,300));
  if(r.status===204) return null; const t=await r.text(); return t?JSON.parse(t):null;
}
/* PostgREST returns at most 1,000 rows per request — page through everything (Club Unique legacy import = 2,500+ entries) */
async function apiAll(path){ const out=[]; const sep=path.indexOf('?')>=0?'&':'?';
  for(let off=0; off<200000; off+=1000){ const rows=await api(path+sep+'limit=1000&offset='+off); if(!rows||!rows.length) break; out.push(...rows); if(rows.length<1000) break; }
  return out; }
/* sign_year is a generated column in cf_entries — never send it back */
function noGen(r){ if(r&&typeof r==='object'&&'sign_year' in r){ r=Object.assign({},r); delete r.sign_year; } return r; }
async function upsert(table, rows){ if(!rows.length) return; return api(table+'?on_conflict=id',{method:'POST',prefer:'return=minimal,resolution=merge-duplicates',body:JSON.stringify(rows.map(r=>Object.assign({updated_by:USER&&USER.email},noGen(r))))}); }
async function del(table, id){ return api(table+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',prefer:'return=minimal'}); }
async function patchRow(table, id, obj){ return api(table+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',prefer:'return=minimal',body:JSON.stringify(noGen(obj))}); }
/* ---- storage (payment slips + contract scans) ---- */
/* insert-only: members may add files but cannot read, overwrite or delete them directly (reads go through wm-file) — every path is unique */
async function uploadTo(bucket, path, file){ const {error}=await SBC.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type||undefined}); if(error) throw new Error(error.message); return path; }
/* ===== Access log (append-only cf_access_log): every contract/slip file opened or previewed and every print is recorded — who / when / what.
   Files do not open if the log cannot be written. Signed links are short-lived (5 min). */
function fileContext(path){ const e=(DB.entries||[]).find(x=>x.contract_path===path); if(e) return e.category||null;
  const l=(DB.lines||[]).find(x=>x.proof_path===path); return l?catOf(l):null; }
async function logAccess(action, o){ o=o||{};
  await api('cf_access_log',{method:'POST',prefer:'return=minimal',body:JSON.stringify([{actor:(USER&&USER.email)||'?',action,bucket:o.bucket||null,path:o.path||null,name:o.name||null,
    context:o.context||(o.path?fileContext(o.path):null),company:(S&&S.company)||null,tab:(S&&S.tab)||null}])}); }
/* Files are served by the Edge Function "wm-file": it logs the access (server side) and stamps a watermark
   (viewer email + time) on every page — a downloaded copy carries the name of whoever opened it. JPG/PNG slips come back as a watermarked PDF. */
async function wmFetch(bucket, path, action, name){ const tok=await token(); if(!tok||tok===SB_KEY) throw new Error('Not signed in');
  const r=await fetch(SB_URL+'/functions/v1/wm-file',{method:'POST',headers:{Authorization:'Bearer '+tok,apikey:SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({bucket,path,action,name:name||null,context:fileContext(path),company:(S&&S.company)||null,tab:(S&&S.tab)||null})});
  if(!r.ok){ let m=''; try{ m=(await r.json()).error; }catch(e){} throw new Error(m||('HTTP '+r.status)); }
  return r.blob(); }
/* view a contract / slip in an in-page viewer (watermarked by wm-file); "open in new tab" stays available */
async function openFile(bucket, path){
  const e=(DB.entries||[]).find(x=>x.contract_path===path); const label=(e&&e.contract_name)||String(path).split('/').pop();
  openModal(`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px"><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📄 ${esc(label)}</b><span style="flex:none"><button class="btn" id="fv_tab" disabled>Open in new tab</button> <button class="btn" onclick="closeModal()">✕ Close</button></span></div><div id="fv_box" style="height:78vh;display:flex;align-items:center;justify-content:center;background:#f4f4f4;border-radius:10px"><span class="mini">Preparing file (adding watermark)…</span></div>`);
  const m=g('mw').querySelector('.modal'); if(m){ m.style.width='min(1100px,96vw)'; m.style.padding='14px 16px'; }
  try{ const b=await wmFetch(bucket,path,'open'); const u=URL.createObjectURL(b); const box=g('fv_box'); if(!box){ URL.revokeObjectURL(u); return; }
    if(b.type==='application/pdf') box.innerHTML=`<iframe src="${u}#toolbar=1&view=FitH" style="width:100%;height:100%;border:0;border-radius:10px" title="${esc(label)}"></iframe>`;
    else if(/^image\//.test(b.type)) box.innerHTML=`<img src="${u}" alt="" style="max-width:100%;max-height:100%">`;
    else box.innerHTML='<span class="mini">This file type can’t be shown here — click “Open in new tab”</span>';

async function dpPagesOf(file){

    for(let i=1;i<=doc.numPages;i++){ const p=await doc.getPage(i); const v0=p.getViewport({scale:1}); const sc=Math.min(3,DP_W/v0.width); const v=p.getViewport({scale:sc});

  if(g('dp_ok')) g('dp_ok').onchange=status;
  const paint=(tmp)=>{ if(!img) return; cx.clearRect(0,0,can.width,can.height); cx.drawImage(img,0,0,can.width,can.height); cx.fillStyle='#000';
    for(const b of pages[cur].boxes) cx.fillRect(b[0]*can.width,b[1]*can.height,(b[2]-b[0])*can.width,(b[3]-b[1])*can.height);
    if(tmp){ cx.fillStyle='rgba(0,0,0,.55)'; cx.fillRect(tmp[0]*can.width,tmp[1]*can.height,(tmp[2]-tmp[0])*can.width,(tmp[3]-tmp[1])*can.height); cx.strokeStyle='#e33'; cx.lineWidth=2; cx.strokeRect(tmp[0]*can.width,tmp[1]*can.height,(tmp[2]-tmp[0])*can.width,(tmp[3]-tmp[1])*can.height); } };
  const show=async()=>{ const p=pages[cur]; img=await dpImgFromURL(p.src); const maxW=wrap.clientWidth-8, maxH=Math.max(300,wrap.clientHeight-8); const sc=Math.min(maxW/p.w, maxH/p.h, 1.4);

  const find=async(idxs)=>{ ['dp_find1','dp_findall','dp_done'].forEach(id=>{ const el=g(id); if(el) el.disabled=true; });
    const n=await dpAutoFind(pages,idxs,t=>{ const el=g('dp_status'); if(el) el.textContent=t; });

    paint(); side(); status(); if(n>=0) toast(n?('Suggested '+n+' box(es) — check every page, handwriting is often missed'):'Nothing found automatically — check the pages yourself'); };
  g('dp_find1').onclick=()=>find([cur]); g('dp_findall').onclick=()=>find(pages.map((p,i)=>p.keep?i:-1).filter(i=>i>=0));
  g('dp_done').onclick=async()=>{ const btn=g('dp_done'); btn.disabled=true; btn.textContent='Building…';
    try{ const out=await window.PDFLib.PDFDocument.create(); const kept=[];
      for(let i=0;i<pages.length;i++){ const p=pages[i]; if(!p.keep) continue; kept.push(i+1);
        const im=await dpImgFromURL(p.src); const c=document.createElement('canvas'); c.width=p.w; c.height=p.h; const x=c.getContext('2d'); x.drawImage(im,0,0); x.fillStyle='#000';
        for(const b of p.boxes) x.fillRect(Math.floor(b[0]*p.w),Math.floor(b[1]*p.h),Math.ceil((b[2]-b[0])*p.w)+1,Math.ceil((b[3]-b[1])*p.h)+1);
        const bytes=Uint8Array.from(atob(c.toDataURL('image/jpeg',0.82).split(',')[1]),ch=>ch.charCodeAt(0)); c.width=c.height=0;
        const jpg=await out.embedJpg(bytes); const pw=595.28, ph=pw*p.h/p.w; const pg=out.addPage([pw,ph]); pg.drawImage(jpg,{x:0,y:0,width:pw,height:ph}); }
      out.setProducer('Elite Escapes Extranet'); out.setCreator('Elite Escapes Extranet'); out.setTitle(file.name.replace(/\.[^.]+$/,''));

      done({file:f, info:{by:(USER&&USER.email)||null, at:new Date().toISOString(), source_name:file.name, pages_total:pages.length, pages_kept:kept, boxes:pages.reduce((s,p)=>s+(p.keep?p.boxes.length:0),0), confirmed:!g('dp_ok')||g('dp_ok').checked}});
    }catch(err){ btn.disabled=false; btn.textContent='Use this document'; toast('Could not build the document: '+err.message); } };
  window.addEventListener('resize',()=>{ if(document.getElementById('docprep')) show(); },{once:true});
  show();

/* ---- OCR helper for prepareDoc: suggests black boxes for card numbers, expiry, CVV, MRZ and passport numbers.
   Suggestions only — the person still checks every page (handwriting / faint scans are often missed). Runs in the browser. */
const DP_OCR={js:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',worker:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',core:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',lang:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int'};
async function dpOcrWorker(){ if(dpOcrWorker._w) return dpOcrWorker._w; await dpLoad(DP_OCR.js);
  dpOcrWorker._w=await window.Tesseract.createWorker('eng',1,{workerPath:DP_OCR.worker,corePath:DP_OCR.core,langPath:DP_OCR.lang}); return dpOcrWorker._w; }
function dpFindBoxes(words, W, H){
  const out=[]; const add=(ws)=>{ const x0=Math.min(...ws.map(w=>w.bbox.x0)), y0=Math.min(...ws.map(w=>w.bbox.y0)), x1=Math.max(...ws.map(w=>w.bbox.x1)), y1=Math.max(...ws.map(w=>w.bbox.y1)); const px=6;
    out.push([Math.max(0,(x0-px)/W),Math.max(0,(y0-px)/H),Math.min(1,(x1+px)/W),Math.min(1,(y1+px)/H)]); };
  const all=words.map(w=>w.text).join(' ');
  const idPage=/passport|passeport|pasaporte|reisepass|r[eé]publi|<<|nationality|date of birth|licen[cs]e/i.test(all);
  const lines={}; words.forEach(w=>{ const L=w.line&&w.line.bbox; const k=L?(L.y0+':'+L.x0+':'+L.y1):('y'+Math.round((w.bbox.y0+w.bbox.y1)/2/12)); (lines[k]=lines[k]||[]).push(w); });
  Object.values(lines).forEach(ws=>{
    ws.sort((a,b)=>a.bbox.x0-b.bbox.x0);
    // runs of digit groups (card numbers written as 4 groups, or one long run) — 12+ digits, not starting with 0, no '*'/'x' masking
    let run=[]; const flush=()=>{ const d=run.map(w=>w.text.replace(/\D/g,'')).join(''); if(d.length>=12&&d.length<=19&&d[0]!=='0'&&!run.some(w=>/[*xX•]/.test(w.text))) add(run); run=[]; };
    ws.forEach(w=>{ const t=w.text.replace(/[.,:;]/g,''); if(/^\d{2,19}$/.test(t)) run.push(w); else { flush(); } }); flush();
    ws.forEach((w,i)=>{ const t=w.text.trim();
      if(/^(0[1-9]|1[0-2])\/(\d{2}|20\d{2})$/.test(t)) add([w]);                                    // expiry MM/YY
      if(/^(cvv|cvc|cv2|security)/i.test(t)){ const n=ws.slice(i+1,i+4).find(x=>/^\d{3,4}$/.test(x.text.replace(/\D/g,''))&&x.text.replace(/\D/g,'').length===x.text.replace(/[^0-9A-Za-z]/g,'').length); if(n) add([n]); }
      if(/^(card|expiry|exp\.?|valid)/i.test(t)){ ws.slice(i+1,i+6).forEach(x=>{ const d=x.text.replace(/\D/g,''); if(d.length>=2&&!/\*/.test(x.text)) add([x]); }); }
      const c=t.replace(/[^A-Z0-9<]/g,'');
      if(t.includes('<<')||(/^[A-Z0-9<]{25,}$/.test(t)&&(c.match(/\d/g)||[]).length>=6)) add([w]);  // MRZ
      if(idPage&&/^([A-Z]{1,2}\d{6,8}|\d{2}[A-Z]{2}\d{5}|[A-Z][A-Z0-9]\d{7})$/.test(c)&&c.length===t.replace(/[\s.]/g,'').length) add([w]); // passport / document no.
      if(idPage&&/^\d{6}[-+A]\d{3}[0-9A-Z]$/.test(t)) add([w]);                                      // Nordic personal ID
    });
  });
  return out;
}
async function dpAutoFind(pages, idxs, setStatus){
  let found=0; let w;
  try{ setStatus('Loading the text reader (first time ~7 MB)…'); w=await dpOcrWorker(); }catch(e){ setStatus('Could not load the text reader: '+e.message); return -1; }
  for(let k=0;k<idxs.length;k++){ const i=idxs[k]; const p=pages[i]; setStatus('Reading page '+(i+1)+' ('+(k+1)+' of '+idxs.length+')…');
    try{ const r=await w.recognize(p.src); const boxes=dpFindBoxes((r.data&&r.data.words)||[],p.w,p.h);
      boxes.forEach(b=>{ if(!p.boxes.some(x=>Math.abs(x[0]-b[0])<0.004&&Math.abs(x[1]-b[1])<0.004)){ p.boxes.push(b); found++; } }); p.scanned=true;
    }catch(e){ /* one bad page should not stop the rest */ } }
  return found;
}

async function saveContractEdit(cno){

function seRender(){ const S2=window._se; const tot=(f)=>S2.rows.filter(r=>!r.del&&f(r)).reduce((s,r)=>s+(Number(r.amount)||0),0);
  const saleT=tot(r=>r.line_type!=='mfee'), saleU=tot(r=>r.line_type!=='mfee'&&!r.paid), origSale=S2.rows.filter(r=>r.line_type!=='mfee').reduce((s,r)=>s+(Number(r.orig.amount)||0),0);

function seResplit(){ const S2=window._se; const n=parseInt(g('se_n').value)||0; const d=g('se_d').value; const step=parseInt(g('se_every').value)||1; if(n<1||!d){ toast('Enter the number of instalments and the first date'); return; }
  const open=S2.rows.filter(r=>!r.locked&&!r.del&&r.line_type!=='mfee'); const total=Math.round(open.reduce((s,r)=>s+(Number(r.amount)||0),0)*100)/100; if(total<=0){ toast('There is no unpaid sale balance to re-split'); return; }
  open.forEach(r=>{ if(r.id) r.del=true; else r._drop=true; }); S2.rows=S2.rows.filter(r=>!r._drop);

function isoWeek(d){ const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=(dt.getUTCDay()+6)%7; dt.setUTCDate(dt.getUTCDate()-day+3);
  const firstThu=new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const week=1+Math.round(((dt-firstThu)/86400000-3+((firstThu.getUTCDay()+6)%7))/7);
  return {year:dt.getUTCFullYear(),week}; }

  const start=new Date(S.mktStart+'T00:00:00'); const end=new Date(start); end.setDate(end.getDate()+6);
  const thu=new Date(start); thu.setDate(start.getDate()+4); const iw=isoWeek(thu);
  return {startISO:iso(start), endISO:iso(end), year:iw.year, week:iw.week}; }

  (DB.mktReps||[]).forEach(rp=>{ const r=by[rp.code]||{}; const rd=r.days||{};
    // build day-keyed buckets 0..6; migrate any legacy weekly (top-level q/qp/ct + deal{}) into Sunday (day 0)
    const days={}; for(let i=0;i<7;i++){ if(rd[i]&&typeof rd[i]==='object') days[String(i)]=Object.assign({},rd[i]); }
    const hasLegacy = (typeof rd.q!=='object' && ((+rd.q||0)||(+rd.qp||0)||(+rd.ct||0))) || (r.deal && ((+r.deal.pack||0)||(+r.deal.full||0)));
    if(hasLegacy){ const d0=days['0']=days['0']||{};

/* weekly totals = sum of daily buckets (days["0".."6"]) + legacy top-level q/qp/ct + legacy deal{} */
function mktWeek(m){ const d=(m&&m.days)||{}; let q=0,qp=0,ct=0,pack=0,full=0;
  for(const k in d){ const x=d[k]; if(x&&typeof x==='object'){ q+=+x.q||0;qp+=+x.qp||0;ct+=+x.ct||0;pack+=+x.pack||0;full+=+x.full||0; } }
  if(typeof d.q!=='object' && ('q' in d||'qp' in d||'ct' in d)){ q+=+d.q||0;qp+=+d.qp||0;ct+=+d.ct||0; }
  if(m&&m.deal){ pack+=+m.deal.pack||0; full+=+m.deal.full||0; }
  return {q,qp,ct,pack,full}; }
function mktCalc(m){ const wk=mktWeek(m),ex=(m&&m.extra)||{},de=(m&&m.ded)||{};

  const tour=q*MKT_RATE.q+qp*MKT_RATE.qp+ct*MKT_RATE.ct, bonus=pack*MKT_RATE.pack+full*MKT_RATE.full;

  const ded=(+de.tax||0)+(+de.ss||0)+(+de.dac||0)+(+de.chargeback||0)+(+de.hold||0);

function arDaysOverdue(d){ return Math.round((Date.parse(TODAY)-Date.parse(d))/86400000); }
function arData(){
  const rows=allLines().filter(x=>x.e.kind==='income' && x.e.active!==false && (x.l.repeat||'never')==='never' && !x.l.paid && ['deposit','admin','installment','mfee'].indexOf(x.l.line_type||'')>=0);
  const nameByCat={}; DB.entries.forEach(e=>{ if(e.category && e.description && !nameByCat[e.category]) nameByCat[e.category]=(e.description||'').replace(/\n/g,' & '); });
  const g={};
  rows.forEach(x=>{ const cat=x.e.category||x.e.id; const amt=Number(x.l.amount||0);
    const o=(g[cat]=g[cat]||{cat,name:nameByCat[cat]||'',out:0,over:0,cur:0,b1:0,b2:0,b3:0,b4:0,mfee:0,next:null,oldest:null});
    o.out+=amt; if(x.l.line_type==='mfee') o.mfee+=amt;
    if(!o.next||x.l.txn_date<o.next) o.next=x.l.txn_date;
    if(x.l.txn_date<=TODAY){ o.over+=amt; if(!o.oldest||x.l.txn_date<o.oldest)o.oldest=x.l.txn_date;
      const d=arDaysOverdue(x.l.txn_date); if(d<=30)o.b1+=amt; else if(d<=60)o.b2+=amt; else if(d<=90)o.b3+=amt; else o.b4+=amt;
    } else o.cur+=amt;
  });
  return Object.values(g).sort((a,b)=>b.over-a.over || b.out-a.out);
}

/* ---- OPC Wages history / trends ---- */
async function mktLoadHistory(){ await loadMktBase(); let rows=[]; try{ rows=await api('mkt_dgr?select=*&year=eq.2026&order=week.asc')||[]; }catch(e){} S.mktHist=rows; }
function rMktHistory(){
  g('main').innerHTML=`<div class="head"><div><h1>OPC Wages · History</h1><p class="mini">Weekly net pay per person · year 2026</p></div></div>${mktSeg()}
   <div id="mktbody"><div class="emptyc"><div class="big">⏳</div>Loading…</div></div>`;
  mktLoadHistory().then(mktPaintHistory).catch(e=>{ const b=g('mktbody'); if(b) b.innerHTML='<div class="emptyc">Failed to load: '+esc(e.message)+'</div>'; }); }
function mktOverrideForWeek(rows){ const teams={}; rows.forEach(r=>{ const c=mktCalc(r); const t=r.team||'-'; const tm=(teams[t]=teams[t]||{amt:0,mgr:false});
    if(r.role!=='manager') tm.amt+=c.q*MKT_MGR.q+c.qp*MKT_MGR.qp+c.ct*MKT_MGR.ct+c.pack*MKT_MGR.pack+c.full*MKT_MGR.full;  // team members: tours+deals
    else { tm.mgr=true; tm.amt+=c.pack*MKT_MGR.pack+c.full*MKT_MGR.full; }  // manager: own deals only (no tour pay)
  });
  let ov=0; Object.values(teams).forEach(tm=>{ if(tm.mgr) ov+=tm.amt; }); return ov; }
function mktSpark(vals,w,h){ if(!vals.length) return ''; const mx=Math.max(...vals,1); const dx=vals.length>1?w/(vals.length-1):0;
  const pts=vals.map((v,i)=>[i*dx, h-(v/mx)*(h-4)-2]); const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="vertical-align:middle"><path d="${d}" fill="none" stroke="#1c3350" stroke-width="1.8"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" fill="#a9812a"/></svg>`; }
function mktPaintHistory(){ const body=g('mktbody'); if(!body) return; const rows=S.mktHist||[]; const reps=DB.mktReps||[];
  if(!rows.length){ body.innerHTML='<div class="emptyc"><div class="big">📊</div>No history yet</div>'; return; }
  const weeks=[...new Set(rows.map(r=>r.week))].sort((a,b)=>a-b);
  const byRep={}, wStaff={}, wMgr={};
  rows.forEach(r=>{ const net=mktCalc(r).net; (byRep[r.rep_code]=byRep[r.rep_code]||{})[r.week]=net; wStaff[r.week]=(wStaff[r.week]||0)+net; });
  weeks.forEach(w=>{ wMgr[w]=mktOverrideForWeek(rows.filter(r=>r.week===w)); });
  const wTot={}; weeks.forEach(w=>wTot[w]=(wStaff[w]||0)+(wMgr[w]||0));
  const grand=weeks.reduce((s,w)=>s+wTot[w],0);
  // rep rows sorted by total net desc
  const repRows=reps.map(rp=>{ const m=byRep[rp.code]||{}; const vals=weeks.map(w=>m[w]||0); const tot=vals.reduce((s,v)=>s+v,0); return {rp,vals,tot,active:tot>0||weeks.some(w=>m[w]!=null)}; })
    .filter(x=>x.active).sort((a,b)=>b.tot-a.tot);
  const topRep=repRows[0];
  // weekly bar chart (total payroll)
  const R='text-align:right', C='text-align:center';
  const bw=Math.max(360, weeks.length*84), bh=210, pad=34, mx=Math.max(...weeks.map(w=>wTot[w]),1), gapw=(bw-pad)/weeks.length;
  let bars='';
  weeks.forEach((w,i)=>{ const x=pad+i*gapw+gapw*0.18, bwid=gapw*0.64; const sh=(wStaff[w]/mx)*(bh-40), mh=(wMgr[w]/mx)*(bh-40); const y0=bh-20;
    bars+=`<rect x="${x.toFixed(1)}" y="${(y0-sh).toFixed(1)}" width="${bwid.toFixed(1)}" height="${sh.toFixed(1)}" rx="3" fill="#1c3350"/>`;
    if(mh>0.5) bars+=`<rect x="${x.toFixed(1)}" y="${(y0-sh-mh).toFixed(1)}" width="${bwid.toFixed(1)}" height="${mh.toFixed(1)}" rx="3" fill="#a9812a"/>`;
    bars+=`<text x="${(x+bwid/2).toFixed(1)}" y="${(y0-sh-mh-6).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink2)">${Math.round(wTot[w]/1000)}k</text>`;
    bars+=`<text x="${(x+bwid/2).toFixed(1)}" y="${(bh-6).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="var(--ink3)">W${w}</text>`; });
  const chart=`<div class="card pad" style="margin-bottom:16px"><h2 style="margin:0 0 4px;font-size:18px">Total weekly pay</h2>
    <p class="mini" style="margin:0 0 10px"><span style="color:#1c3350">■</span> Staff net &nbsp; <span style="color:#a9812a">■</span> Manager override</p>
    <div style="overflow-x:auto"><svg width="${bw}" height="${bh}" viewBox="0 0 ${bw} ${bh}" style="max-width:100%">${bars}</svg></div></div>`;
  // KPIs
  const kpis=`<div class="kpis" style="margin-bottom:16px">
    <div class="kpi"><div class="v">${fmt(grand)}</div><div class="l">Total paid (${weeks.length} weeks)</div></div>
    <div class="kpi"><div class="v">${fmt(Math.round(grand/weeks.length))}</div><div class="l">Average per week</div></div>
    <div class="kpi"><div class="v">${topRep?esc(topRep.rp.name):'—'}</div><div class="l">Highest paid · ${topRep?fmt(topRep.tot):''}</div></div>
    <div class="kpi"><div class="v">${repRows.length}</div><div class="l">Staff with pay</div></div></div>`;
  // table
  const th=(t,s)=>`<th style="${s||''};font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap">${t}</th>`;
  let trs='';
  repRows.forEach(x=>{ const cells=weeks.map(w=>{ const v=x.vals[weeks.indexOf(w)]; return `<td style="${R}">${v?fmt(v):'<span style="color:var(--ink3)">—</span>'}</td>`; }).join('');
    trs+=`<tr><td style="white-space:nowrap"><b>${esc(x.rp.code)}</b> ${esc(x.rp.name)}${x.rp.role==='manager'?' <span class="pill fc">Mgr</span>':''}</td><td style="${C}">${mktSpark(x.vals,84,26)}</td>${cells}<td style="${R}"><b>${fmt(x.tot)}</b></td></tr>`; });
  const totCells=weeks.map(w=>`<td style="${R}">${fmt(wStaff[w]||0)}</td>`).join('');
  const totRow=`<tr style="border-top:2px solid var(--line);font-weight:700"><td>Total staff net</td><td></td>${totCells}<td style="${R}">${fmt(weeks.reduce((s,w)=>s+(wStaff[w]||0),0))}</td></tr>`;
  const head=`<tr>${th('Staff')}${th('Trend',C)}${weeks.map(w=>th('W'+w,R)).join('')}${th('Total',R)}</tr>`;
  const table=`<div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead>${head}</thead><tbody>${trs}${totRow}</tbody></table></div>`;
  body.innerHTML=kpis+chart+table; }

async function saveTaxi(id){ const cur=id?(DB.taxi||[]).find(x=>x.id===id):null; const rid=id||uid('tx');
  const file=prepOf('tx_file');
  let doc_path=cur?cur.doc_path:null, doc_name=cur?cur.doc_name:null;
  const sv=g('tx_save'); if(sv){ sv.disabled=true; sv.textContent='Saving…'; }
  if(file){ const ext=(file.name.split('.').pop()||'jpg').toLowerCase(); const path='taxi/'+rid+'-'+Date.now()+'.'+ext;
    try{ await uploadTo('cf-receipts',path,file); doc_path=path; doc_name=file.name; }catch(e){ toast('Document upload failed: '+e.message); if(sv){sv.disabled=false;sv.textContent='Save';} return; } }
  const row={ id:rid, tour_date:g('tx_date').value||TODAY, guest_name:(g('tx_guest').value||'').trim()||null,
    opc_code:g('tx_opc').value||null, amount:parseFloat(g('tx_amt').value)||0, note:(g('tx_note').value||'').trim()||null,
    doc_path, doc_name, status:(cur&&cur.status==='approved')?'approved':'pending', recorded_by:cur?cur.recorded_by:(USER&&USER.email)||null, updated_at:new Date().toISOString() };
  if(cur&&cur.status==='rejected'){ row.review_note=null; }
  try{ await upsert('mkt_taxi',[row]); closeModal(); toast('Saved + sent to accounts for review'); await loadTaxi(); taxiPaint(); }catch(e){ toast('Save failed: '+e.message); if(sv){sv.disabled=false;sv.textContent='Save';} } }
async function taxiReview(id,decision){ let note=null;

    if(decision==='approved'&&row){ await taxiPost(row); } else { await taxiUnpost(id); }

/* ============ matrix engine ============ */
function periods(kind, start, n){
  const arr=[];
  if(kind==='week'){
    let d=start; // start is a monday iso
    for(let i=0;i<n;i++){ const s=d, e=addDaysISO(d,6); arr.push({key:s,label:fmtShort(s),s,e}); d=addDaysISO(d,7); }
  } else {
    for(let i=0;i<n;i++){ const iso2=addMonthsISO(start+'-01',i), key=iso2.slice(0,7); const [y,m]=key.split('-').map(Number); arr.push({key,label:MON[m-1]+' '+y,s:key+'-01',e:lastDayOfMonth(key)}); }
  }
  return arr;
}
function fmtShort(s){ const [y,m,d]=s.split('-').map(Number); return MON[m-1]+' '+d; }
function mondayOf(s){ const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); const wd=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-wd); return iso(dt); }
function bucketKey(kind, date, ps){
  if(kind==='week'){ for(const p of ps){ if(date>=p.s&&date<=p.e) return p.key; } return null; }
  return date.slice(0,7);
}
/* build matrix over given periods; includeForecast for pulse line */
function buildMatrix(ps, opts){
  opts=opts||{};
  const winS=ps[0].s, winE=ps[ps.length-1].e;
  const openBal=DB.accounts.reduce((s,a)=>s+(Number(a.opening_balance)||0),0);
  const lines=allLines().filter(x=>x.e.active!==false);
  // beginning before window
  let begin=openBal, beginF=openBal;
  lines.forEach(({l,e})=>{ const sign=e.kind==='expense'?-1:1; occ(l,'0000-01-01',addDaysISO(winS,-1)).forEach(o=>{ begin+=sign*o.amount; beginF+=sign*o.famount; }); });
  const inc={}, exp={}, incTot={}, expTot={}, incF={}, expF={};
  lines.forEach(({l,e})=>{
    const g0=e.category||(e.kind==='expense'?'Uncategorized expense':'Uncategorized income');
    occ(l,winS,winE).forEach(o=>{
      const pk=bucketKey(S.view,o.date,ps); if(!pk) return;
      const tot=e.kind==='expense'?expTot:incTot, totF=e.kind==='expense'?expF:incF, tgt=e.kind==='expense'?exp:inc;
      tot[pk]=(tot[pk]||0)+o.amount; totF[pk]=(totF[pk]||0)+o.famount;
      const grp=(tgt[g0]=tgt[g0]||{entries:{},tot:{}});
      const em=(grp.entries[e.id]=grp.entries[e.id]||{title:e.title||'(untitled)',kind:e.kind,m:{}});
      em.m[pk]=(em.m[pk]||0)+o.amount;
      grp.tot[pk]=(grp.tot[pk]||0)+o.amount;
    });
  });
  const beginByP={}, endByP={}, pulseByP={};
  let run=begin, runF=beginF;
  ps.forEach(p=>{ beginByP[p.key]=run; run=run+(incTot[p.key]||0)-(expTot[p.key]||0); endByP[p.key]=run;
    runF=runF+(incF[p.key]||0)-(expF[p.key]||0); pulseByP[p.key]=runF; });
  const hasFc=DB.lines.some(l=>l.forecast_amount!=null&&l.forecast_amount!==''&&Number(l.forecast_amount)!==Number(l.amount));
  return {ps,inc,exp,incTot,expTot,beginByP,endByP,pulseByP,begin,hasFc};
}

  const x=i=>pad+i*((W-2*pad)/(ps.length-1)); const y=v=>H-pad-((v-mn)/((mx-mn)||1))*(H-2*pad);

async function saveEntry(){

  const prev=(DB.entries||[]).find(x=>x.id===id); const meta=Object.assign({},(prev&&prev.meta)||{}); const mv=(k,id2)=>{ const el=g(id2); if(!el) return; const v=el.value.trim(); if(v) meta[k]=v; else delete meta[k]; };

function reportIE(M,ps){
  const th=`<th class="lab">Month</th><th class="n">Beginning Cash</th><th class="n">Income</th><th class="n">Expenses</th><th class="n">Ending Cash</th>${M.hasFc?'<th class="n">Pulse (fc)</th>':''}`;
  let sumI=0,sumE=0;
  const rows=ps.map(p=>{ const i=M.incTot[p.key]||0,e=M.expTot[p.key]||0; sumI+=i;sumE+=e;
    return `<tr><td class="lab">${p.label}</td><td class="n">${fmt(M.beginByP[p.key])}</td><td class="n" style="color:var(--income)">${i?fmt(i):'–'}</td><td class="n" style="color:var(--expense)">${e?fmt(e):'–'}</td><td class="n"><b>${fmt(M.endByP[p.key])}</b></td>${M.hasFc?`<td class="n pulse" style="color:var(--pulse)">${fmt(M.pulseByP[p.key])}</td>`:''}</tr>`;
  }).join('');
  const n=ps.length;
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="v">${fmt(M.beginByP[ps[0].key])}</div><div class="l">Beginning Cash on Hand</div></div>
    <div class="kpi"><div class="v" style="color:var(--income)">${fmt(sumI)}</div><div class="l">Total Income · ${n} mo</div></div>
    <div class="kpi"><div class="v" style="color:var(--expense)">${fmt(sumE)}</div><div class="l">Total Expenses · ${n} mo</div></div>
    <div class="kpi"><div class="v">${fmt(M.endByP[ps[ps.length-1].key])}</div><div class="l">Ending Cash on Hand</div></div>
    <div class="kpi"><div class="v">${fmt(sumI/n)} / ${fmt(sumE/n)}</div><div class="l">Monthly avg in / out</div></div>
  </div>`;
  return kpis+`<div class="scroll"><table class="mx"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function reportBy(keyFn,label,ps){
  const winS=ps[0].s, winE=ps[ps.length-1].e;
  const map={}; // key -> {inc:{},exp:{}}
  allLines().filter(x=>x.e.active!==false).forEach(({l,e})=>{
    const k=keyFn(e);
    occ(l,winS,winE).forEach(o=>{ const pk=o.date.slice(0,7); const m=(map[k]=map[k]||{inc:{},exp:{},ti:0,te:0});
      if(e.kind==='expense'){ m.exp[pk]=(m.exp[pk]||0)+o.amount; m.te+=o.amount; } else { m.inc[pk]=(m.inc[pk]||0)+o.amount; m.ti+=o.amount; } });
  });
  const keys=Object.keys(map).sort((a,b)=>(map[b].ti+map[b].te)-(map[a].ti+map[a].te));
  const th=`<th class="lab">${esc(label)}</th><th class="n">Income</th><th class="n">Expenses</th><th class="n">Net</th>${ps.map(p=>`<th class="n">${p.label}</th>`).join('')}`;
  if(!keys.length) return '<div class="card"><div class="emptyc">No data in this range.</div></div>';
  const rows=keys.map(k=>{ const m=map[k]; const net=m.ti-m.te;
    return `<tr><td class="lab"><b>${esc(k)}</b></td><td class="n" style="color:var(--income)">${m.ti?fmt(m.ti):'–'}</td><td class="n" style="color:var(--expense)">${m.te?fmt(m.te):'–'}</td><td class="n"><b>${fmtSigned(net)}</b></td>${ps.map(p=>{ const v=(m.inc[p.key]||0)-(m.exp[p.key]||0); return `<td class="n">${v?fmtSigned(v):'<span style=\"opacity:.28\">–</span>'}</td>`; }).join('')}</tr>`;
  }).join('');
  return `<div class="scroll"><table class="mx"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function saveSlip(){

      const memo='Payment slip · '+(r.type||'')+(r.cctype?(' · '+r.cctype):'')+(fu?(' · '+fu):'');

        lineIds.push(lid); created++;
      }
    }
    await upsert('cf_income_slips',[{id:slipId,slip_date:sdate,bank,method:null,fu,doc_path,doc_name,total_thb:Math.round(totThb),total_usd:Math.round(totUsd),line_count:rows.length,note,meta:{matched,created,line_ids:lineIds,new_contracts:unresolved},created_by:USER&&USER.email}]);

const CH_TYPE={deposit:'Deposit',installment:'Instalment',admin:'Admin fee',mfee:'Annual management fee',booking:'Booking fee',

function chTypeLabel(t){ return CH_TYPE[t]||t||'Other'; }
function chData(){
  const g={};
  allLines().forEach(({l,e})=>{ if(e.kind!=='income') return;
    const cat=e.category||('entry:'+e.id);
    const o=(g[cat]=g[cat]||{cat,cno:e.category||null,name:'',ptype:'',lines:[],tot:0,paid:0,out:0,n:0,paidN:0,ents:{}});
    o.ents[e.id]=e;
    if(e.description&&!o.name) o.name=(e.description||'').replace(/\n/g,' & ');
    if(e.meta&&e.meta.product_type&&!o.ptype) o.ptype=e.meta.product_type;
    const a=Number(l.amount||0); o.lines.push({l,e}); o.n++; o.tot+=a;
    if(l.paid){ o.paid+=Number(l.paid_amount!=null?l.paid_amount:a); o.paidN++; } else o.out+=a;
  });
  return Object.values(g).sort((a,b)=>(a.cat<b.cat?-1:1));

function ncBuildLines(eid,signd,tot,dep,n,inst1){ const lines=[];
  lines.push({id:eid+'_l0',entry_id:eid,amount:dep,txn_date:signd,repeat:'never',line_type:'deposit',memo:'Deposit'});
  const rem=Math.max(0,tot-dep);
  if(n>0 && rem>0){ const per=Math.round(rem/n*100)/100; let acc=0;
    for(let i=0;i<n;i++){ let amt=(i===n-1)?Math.round((rem-acc)*100)/100:per; acc+=per; lines.push({id:eid+'_l'+(i+1),entry_id:eid,amount:amt,txn_date:addMonthsISO(inst1,i),repeat:'never',line_type:'installment',memo:'Instalment '+(i+1)+'/'+n}); }
  }

/* ===== Payment record locking + audit trail =====

function lineLocked(l){ return !!(l && l.paid && l.proof_path); }

async function logPayAudit(l, action, reason, detail){

    line_id:l.id, entry_id:l.entry_id, contract:catOf(l), action:action, actor:(USER&&USER.email)||null, reason:reason||null, detail:detail||null}])}); }catch(e){}
}

  await logPayAudit(l,'unlock',reason.trim());

  toast('Unlocked for editing'); markReceived(id);
}

      if(d.changes) ch=Object.entries(d.changes).map(([k,v])=>`<div class="mini" style="opacity:.8">${esc(k)}: ${esc(String(v.from))} → ${esc(String(v.to))}</div>`).join('');

async function saveReceipt(id){
  const btn=g('r_save'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  try{
    const l=DB.lines.find(x=>x.id===id); const wasPaid=!!l.paid; const file=prepOf('r_file'); const prepI=prepInfo('r_file'); let path=l.proof_path||null, name=l.proof_name||null; let oldProof=null;
    if(file){ if(l.proof_path){ oldProof=l.proof_path; } const ext=(file.name.split('.').pop()||'bin').toLowerCase(); path='receipts/'+id+'-'+Date.now()+'.'+ext; await uploadTo('cf-receipts',path,file); name=file.name; }
    const method=g('r_method').value;
    let pay_meta=null;
    if(method==='card'){
      const pm={};
      const gv=id2=>{const el=g(id2);return el?String(el.value).trim():'';};
      const brand=gv('r_card_brand'); if(brand&&brand!=='—') pm.card_brand=brand;
      const last4=gv('r_card_last4'); if(last4) pm.card_last4=last4;
      const thb=gv('r_card_thb'); if(thb) pm.card_thb=parseFloat(thb);
      const ref=gv('r_card_ref'); if(ref) pm.card_ref=ref;
      const auth=gv('r_card_auth'); if(auth) pm.card_auth=auth;
      const term=gv('r_card_term'); if(term) pm.card_term=term;
      if(Object.keys(pm).length) pay_meta=pm;
    }
    { const pp=prepI||(!file&&l.pay_meta&&l.pay_meta.proof_prep)||null; if(pp) pay_meta=Object.assign({},pay_meta||{},{proof_prep:pp}); }
    if(!payCanVerify()) pay_meta=Object.assign({},pay_meta||{},{verified:false}); /* Member Service keys it → accounting verifies */
    const patch={paid:true,paid_date:g('r_date').value||TODAY,paid_amount:parseFloat(g('r_amt').value)||Number(l.amount),method:method,paid_note:g('r_note').value.trim()||null,paid_by:USER&&USER.email,proof_path:path,proof_name:name,pay_meta:pay_meta};
    await patchRow('cf_lines',id,patch);
    // audit: what changed
    const F=(a,b)=>String(a==null?'':a)!==String(b==null?'':b);
    const changes={};
    if(F(l.paid_date,patch.paid_date)) changes['date']={from:l.paid_date||'—',to:patch.paid_date};
    if(F(l.paid_amount,patch.paid_amount)) changes['amount']={from:l.paid_amount!=null?fmt(l.paid_amount):'—',to:fmt(patch.paid_amount)};
    if(F(l.method,patch.method)) changes['method']={from:methodLabel(l.method)||'—',to:methodLabel(patch.method)};
    if(F(l.paid_note,patch.paid_note)) changes['note']={from:l.paid_note||'—',to:patch.paid_note||'—'};
    const detail={}; if(Object.keys(changes).length) detail.changes=changes;
    if(file) detail.new_proof=name; if(oldProof) detail.old_proof_path=oldProof;
    await logPayAudit(l, wasPaid?'edit':'record', null, Object.keys(detail).length?detail:null);
    if(oldProof) await logPayAudit(l,'replace-evidence',null,{old_proof_path:oldProof,new_proof:name});
    if(S.payUnlocked) delete S.payUnlocked[id];
    closeModal(); toast(wasPaid?'Payment updated':'Payment recorded'); await loadAll(); S.tab='receipts'; render();
  }catch(e){ toast('Save failed: '+e.message); if(btn){ btn.disabled=false; btn.textContent='Save'; } }
}

/* ============ Stays & MFEE eligibility ============ */
function termOf(cno){ const t=parseInt(String(cno||'').split('/')[2]); return isNaN(t)?null:t; }
function mfeeLinesFor(cno){ return allLines().filter(x=>x.e.category===cno && x.l.line_type==='mfee').map(x=>x.l).sort((a,b)=>a.txn_date<b.txn_date?-1:1); }
function stayOf(cno,year){ return (DB.stays||[]).find(s=>s.contract===cno && Number(s.year)===Number(year))||null; }
function eligibility(cno){ const out=mfeeLinesFor(cno).filter(l=>l.txn_date<=TODAY && !l.paid); return {blocked:out.length>0, out}; }
const CUR_YEAR=Number(TODAY.slice(0,4));
/* Interval membership: CSV import fields (ii_tier/ii_from/ii_until) and/or the legacy add-on record meta.addons.iv
   {t:"5 yrs Gold", act:yes|no, pay:paid|owing|unknown, owe, id (II member no), ad (activation date dd.mm.yyyy)} */
function iiOf(meta){ meta=meta||{}; const iv=(meta.addons&&typeof meta.addons.iv==='object')?meta.addons.iv:null;
  if(!meta.ii_tier && !meta.ii_membership && !iv) return null;
  const t=String((iv&&iv.t)||meta.ii_membership||''); const yrs=Number((t.match(/(\d+)\s*y/i)||[])[1])||Number(meta.ii_years)||null;
  const tier=meta.ii_tier||((t.match(/gold|platinum|silver/i)||[''])[0].replace(/^./,c=>c.toUpperCase()));
  const adY=iv&&iv.ad?Number(String(iv.ad).slice(-4))||null:null;
  /* the Interval term runs from activation — a membership that is not activated yet has no end year */
  const notAct=iv&&iv.act!=='yes'&&!meta.ii_until;
  const from=notAct?null:(Number(meta.ii_from)||adY||Number(meta.fyo)||null); const until=Number(meta.ii_until)||((from&&yrs)?from+yrs-1:null);
  return {tier, years:yrs, from, until, label:meta.ii_membership||('Interval '+tier+(yrs?' '+yrs+' yrs':'')),
    act:iv?(iv.act==='yes'?'yes':(iv.act==='no'?'no':'')):'', pay:iv?(iv.pay||''):'', owe:iv&&iv.owe!=null?Number(iv.owe):null, id:iv?(iv.id||''):'', ad:iv?(iv.ad||''):''}; }
function iiStatusKey(ii){ if(!ii) return 'none'; if(ii.act==='yes') return 'active'; if(ii.pay==='owing') return 'owing'; if(ii.act==='no') return 'notact'; return 'unknown'; }
const II_STATUS={active:['✓ Activated','inc'],owing:['⏳ Not activated · owes II','exp'],notact:['Not activated','off'],unknown:['Status unknown','off'],none:['No Interval','off']};

  const lab=u.act==='yes'?'✓ UDP active':(u.act==='enroll'?'UDP · pending enroll':'UDP · not activated');

function upsellInfo(g){ const ii=iiOf(g.meta); const term=termOf(g.cno); const fyo=Number(g.meta&&g.meta.fyo)||null; const lyo=(fyo&&term)?fyo+term-1:null;
  const ends=[]; if(ii&&ii.until) ends.push({what:'Interval '+(ii.tier||'')+' expires',year:ii.until}); if(lyo) ends.push({what:'Membership ends',year:lyo});

/* Week-based stay entitlement (per contract T&C):
   - earn `weeks` per occupancy year (default 1);
   - each logged stay uses 1 week;
   - unused weeks roll over to the FOLLOWING year only, then expire (T&C 2.4);
   Returns {per:{year:{earned,avail,used,remaining,over,carriedIn}}, fyo,lyo,wk,term,usedTot,earnedTot}. */
function entitlement(g){
  const fyo=Number(g.meta&&g.meta.fyo)||null, term=termOf(g.cno);
  if(!fyo||!term) return null;
  const lyo=fyo+term-1, wk=Number(g.meta&&g.meta.weeks)||1;
  const per={}; let buckets=[]; // {ey:year earned, left}
  for(let y=fyo;y<=lyo;y++){
    buckets=buckets.filter(b=>b.ey>=y-1);                 // weeks older than last year expire
    const carriedIn=buckets.reduce((s,b)=>s+b.left,0);    // leftover from prior (still valid) year
    buckets.push({ey:y,left:wk});
    const avail=buckets.reduce((s,b)=>s+b.left,0);
    const st=stayOf(g.cno,y); const used=(st&&st.stayed)?1:0;
    let u=used; buckets.sort((a,b)=>a.ey-b.ey);
    for(const b of buckets){ const t=Math.min(b.left,u); b.left-=t; u-=t; }
    const remaining=buckets.reduce((s,b)=>s+b.left,0);
    per[y]={earned:wk,carriedIn,avail,used,remaining,over:u>0};
  }
  const usedTot=Object.values(per).reduce((s,r)=>s+r.used,0);
  return {per,fyo,lyo,wk,term,usedTot,earnedTot:wk*term};
}

    const upBadge= (u&&u.upsell)? `<span class="pill" style="background:#fbf1d8;color:#8a6d1f" title="${esc(u.soonest.what)} ${u.soonest.year}">⭐ Upsell — ${esc(u.soonest.what)} ${u.soonest.year}${u.due<0?' (expired)':''}</span>` : '';
    const ent=entitlement(g);
    let rows='';
    if(fyo&&lyo){
      // the member's "active" entitlement year = earliest year in the term they haven't used yet (log-stay opens here; later years stay locked)
      let activeYear=null; for(let yy=fyo;yy<=lyo;yy++){ const s=stayOf(g.cno,yy); if(!(s&&s.stayed)){ activeYear=yy; break; } }
      for(let y=fyo;y<=lyo;y++){
        const ml=mfeeLinesFor(g.cno).find(l=>l.txn_date.slice(0,4)==String(y));
        const mfeeCell = !ml ? '<span class="pill inc" title="No MFEE this year (free/included)">free</span>'
          : (ml.paid ? '<span class="pill inc">✓ paid</span>'
            : (ml.txn_date<=TODAY ? '<span class="pill exp">● overdue</span>' : '<span class="pill off">due '+fmtDate(ml.txn_date)+'</span>'));
        const mfeeAct = ml && !ml.paid ? ` <button class="btn link" onclick="markReceived('${esc(ml.id)}')">record MFEE</button>` : '';
        const st=stayOf(g.cno,y); const stayed=st&&st.stayed;
        // Stay side only: allow logging for the current active entitlement year (earliest unused, e.g. FYO) and any past/current year (retroactive); lock later years still to come.
        const canLog = stayed || y===activeYear || y<=CUR_YEAR;
        const stayCell = stayed ? `✓ Stayed${st.check_in?' ('+fmtDate(st.check_in)+(st.check_out?'–'+fmtDate(st.check_out):'')+')':''}` : `<span class="mini" style="opacity:${canLog?'.5':'.3'}">not yet</span>`;
        const stayAct = stayed ? `<button class="btn link" onclick="openStay('${esc(g.cno)}',${y})">edit</button>`
          : (canLog ? `<button class="btn link" onclick="openStay('${esc(g.cno)}',${y})">log stay</button>`
                    : `<span class="mini" style="opacity:.3;cursor:not-allowed" title="Can't log a stay before ${y} — the year hasn't started yet">log stay</span>`);
        const e=ent&&ent.per[y];
        const wkCell = !e ? '' : (e.over
            ? '<span class="pill exp" title="Used more weeks than available">⚠ over</span>'
            : `<span title="${e.earned} earned${e.carriedIn?' + '+e.carriedIn+' carried in':''} · ${e.used} used">${e.remaining}/${e.avail} wk${e.carriedIn?' <span class="mini">(+'+e.carriedIn+' carried)</span>':''}</span>`);
        rows+=`<tr><td><b>${y}</b>${y==fyo?' <span class="mini">FYO</span>':(y==lyo?' <span class="mini">LYO</span>':'')}</td><td>${mfeeCell}${mfeeAct}</td><td>${stayCell}</td><td class="mini">${wkCell}</td><td>${stayAct}</td></tr>`;
      }
    } else {
      rows=`<tr><td colspan="5" class="mini" style="opacity:.6">No occupancy years (FYO/term missing) — add FYO in the entry's Sales report details</td></tr>`;
    }
    const cust=(g.entries[0]&&g.entries[0].description||'').split('\n')[0];
    return `<div class="card" id="sy_${cssId(g.cno)}" style="margin-bottom:10px;transition:box-shadow .3s"><div class="pad rc-head" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;cursor:pointer${open?';border-bottom:1px solid var(--line)':''}" onclick="toggleSy('${esc(g.cno)}')">
      <div><b>${open?'▾':'▸'} ${esc(g.cno)}</b> <span class="mini">· ${esc(cust)}${g.meta.unit?' · '+esc(g.meta.unit):''}${fyo?' · stay '+fyo+'–'+lyo:''}</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center">${g.contract_path?`<a class="pill" style="text-decoration:none" href="#" onclick="event.stopPropagation();openFile('cf-contracts','${esc(g.contract_path)}');return false" title="View signed contract PDF">📎 Contract</a>`:''}${ent?`<span class="pill" style="background:var(--brandsoft);color:var(--brand2)" title="${ent.wk} week(s)/yr · ${ent.usedTot} used of ${ent.earnedTot}">📅 Weeks ${ent.usedTot}/${ent.earnedTot} used</span>`:''}${badge}${iiBadge}${upBadge}</div></div>
      ${open?`<div style="overflow:auto"><table><thead><tr><th>Year</th><th>Management Fee</th><th>Stay</th><th>Weeks left</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:''}</div>`;
  }).join('');
  g('main').innerHTML=head+kpis+bar+(blocks||`<div class="card"><div class="emptyc">${groups.length?'No contracts in this group':'No membership contracts yet.'}</div></div>`)+moreSy;
}

function maskAcct(s){ if(!s) return ''; if(S.bankShowFull) return s; const digits=(s.match(/\d/g)||[]); if(digits.length<=4) return s; let seen=0; const keep=digits.length-4; return s.replace(/\d/g,d=>{ seen++; return seen<=keep?'x':d; }); }
function bankSnap(accId, date){ return (DB.bankSnaps||[]).find(s=>s.account_id===accId && s.as_of===date) || null; }
function bankDates(){ return [...new Set((DB.bankSnaps||[]).map(s=>s.as_of))].sort().reverse(); }

function numVal(v){ if(v==null||v==='') return null; if(typeof v==='number') return v; const n=parseFloat(String(v).replace(/,/g,'').replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; }
function last3(s){ const d=String(s||'').replace(/\D/g,''); return d.length>=3?d.slice(-3):d; }
function parseThaiDate(s){ const m=String(s||'').match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if(!m) return null; let d=m[1],mo=m[2],y=m[3]; if(y.length===2)y='20'+y; let yy=+y; if(yy>2400) yy-=543; if(+mo>12||+d>31) return null; return yy+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function findStatementBalance(rows){
  let acctNo=null, stmtDate=null;
  const acctLabels=['account number','account no','a/c no.','a/c no','เลขที่บัญชี','บัญชีเลขที่','เลขบัญชี'];
  const dateLabels=['printed on','as of','statement date','ณ วันที่','วันที่พิมพ์','วันที่'];
  for(let r=0;r<rows.length && (!acctNo||!stmtDate);r++){ const row=rows[r]||[]; for(let c=0;c<row.length;c++){ const t=String(row[c]==null?'':row[c]).trim().toLowerCase().replace(/\s+/g,' '); if(!t) continue;
    if(!acctNo && acctLabels.some(l=>t===l||t.indexOf(l)>=0)){ for(let cc=c+1;cc<row.length;cc++){ const v=String(row[cc]||'').trim(); if(/\d{3,}/.test(v) && !/balance|บาท/i.test(v)){ acctNo=v; break; } } }
    if(!stmtDate && dateLabels.some(l=>t===l||t.indexOf(l)>=0)){ for(let cc=c+1;cc<row.length;cc++){ const d=parseThaiDate(row[cc]); if(d){ stmtDate=d; break; } } }
  } }
  /* summary balance field (BBL/KTB/SCB/KBank all expose one) — highest priority wins */
  const labels=[['ledger balance',6],['available balance',5],['current balance',6],['closing balance',6],['ending balance',6],
    ['balance carried forward',5],['cash balance',3],['ยอดคงเหลือยกไป',6],['ยอดเงินคงเหลือ',4],['ยอดคงเหลือ',4],['ยอดยกไป',5],['ยอดเงินฝากคงเหลือ',4]];
  let best=null,bp=-1,bl='';
  for(let r=0;r<rows.length;r++){ const row=rows[r]||[]; for(let c=0;c<row.length;c++){ const raw=String(row[c]==null?'':row[c]).trim(); if(!raw) continue; const t=raw.toLowerCase().replace(/\s+/g,' ');
    for(const [lab,p] of labels){ const exact=t===lab, inc=t.indexOf(lab)>=0; if(exact||inc){ const score=p+(exact?0.5:0);
      for(let cc=c+1;cc<row.length;cc++){ const v=numVal(row[cc]); if(v!=null){ if(score>bp){best=v;bp=score;bl=raw;} break; } } } } } }
  if(best!=null) return {balance:best,label:bl,acctNo,stmtDate};
  /* fallback: transaction table with a "balance" column → take the balance of the LATEST-dated row (handles newest-first or oldest-first) */
  let balCol=-1,dateCol=-1,hdrRow=-1;
  for(let r=0;r<Math.min(rows.length,10);r++){ const row=rows[r]||[]; for(let c=0;c<row.length;c++){ const h=String(row[c]||'').toLowerCase().trim();
    if(balCol<0 && (/\bbalance\b/.test(h)||/คงเหลือ/.test(h))) { balCol=c; hdrRow=r; }
    if(dateCol<0 && (/\bdate\b/.test(h)||/วันที่/.test(h))) dateCol=c; }
    if(balCol>=0) break; }
  if(balCol>=0){ let bestD='',bestV=null,lastV=null;
    for(let r=hdrRow+1;r<rows.length;r++){ const v=numVal((rows[r]||[])[balCol]); if(v==null) continue; lastV=v;
      if(dateCol>=0){ const d=parseThaiDate((rows[r]||[])[dateCol]); if(d && d>=bestD){ bestD=d; bestV=v; } } }
    const val=(bestV!=null)?bestV:lastV;
    if(val!=null) return {balance:val,label:'balance column'+(bestD?(' · '+fmtDate(bestD)):''),acctNo,stmtDate};
  }
  return (acctNo||stmtDate)?{balance:null,label:'',acctNo,stmtDate}:null;
}
async function onStatementPick(accId){ const f=g('bb_file').files[0]; const msg=g('bb_readmsg'); if(!f||!msg) return;
  if(!/\.(xls|xlsx|csv)$/i.test(f.name)){ msg.innerHTML='<span class="mini">PDF / image attached — enter the balance by hand</span>'; return; }
  msg.innerHTML='<span class="mini">Reading statement…</span>';
  try{ const rows=await readWorkbook(f); const res=findStatementBalance(rows);
    if(!res){ msg.innerHTML='<span class="mini">Could not read a balance — enter it by hand</span>'; return; }
    let html='';
    if(res.balance!=null){ g('bb_amt').value=res.balance; html+='<span class="pill inc">✓ read '+fmtB(res.balance)+'</span>'; }
    else html+='<span class="mini">No balance found — enter by hand.</span>';
    const info=[]; if(res.acctNo) info.push('a/c '+esc(res.acctNo)); if(res.stmtDate) info.push('dated '+fmtDate(res.stmtDate));
    if(info.length) html+=' <span class="mini">'+info.join(' · ')+'</span>';
    const acc=DB.bankAccounts.find(x=>x.id===accId); const warns=[];
    if(res.acctNo && acc && acc.acct_no && last3(res.acctNo)!==last3(acc.acct_no)) warns.push('⚠ statement account may not match this one ('+esc(maskAcct(acc.acct_no))+')');
    if(res.stmtDate && res.stmtDate!==S.bankDate) warns.push('⚠ statement dated '+fmtDate(res.stmtDate)+' — snapshot date is '+fmtDate(S.bankDate));
    if(warns.length) html+='<div style="margin-top:5px">'+warns.map(w=>'<span class="pill exp">'+w+'</span>').join(' ')+'</div>';
    else if(res.balance!=null) html+=' <span class="mini">— check &amp; Save</span>';
    msg.innerHTML=html;
  }catch(e){ msg.innerHTML='<span class="mini">Could not read the file — enter the balance by hand</span>'; }
}

async function useBankAsOpening(){ const date=S.bankDate; const accs=(DB.bankAccounts||[]).filter(a=>a.active!==false);

  const cur=pri.currency||'THB'; const opening = cur==='THB'? grandTHB : (grandTHB/cfRate(cur));
  const msg = cur==='THB' ? fmtB(grandTHB) : (fmtB(grandTHB)+' ≈ '+fmt(opening)+' at ฿'+cfRate(cur)+'/'+cur);
  if(!confirm('Set the Cash Flow opening balance ('+esc(pri.name)+') to '+msg+' as of '+fmtDate(date)+' ?')) return;
  try{ await patchRow('cf_accounts',pri.id,{opening_balance:Math.round(opening),opening_date:date}); toast('Opening balance updated'); await loadAll(); S.tab='bank'; render(); }catch(e){ toast('Failed: '+e.message); } }

/* ---- Cash & Bank: import accounts from Excel / CSV ---- */
function normType(v){ v=(v||'').toString().trim().toLowerCase(); if(/cash|เงินสด/.test(v)) return 'cash'; if(/sav|ออม/.test(v)) return 'savings'; return 'current'; }
function bankNum(v){ if(v==null||v==='') return null; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; }
function readWorkbook(file){ return new Promise((res,rej)=>{ const rd=new FileReader(); const isCsv=/\.csv$/i.test(file.name)||file.type==='text/csv';
  rd.onload=()=>{ try{ if(isCsv){ res(parseCSV(String(rd.result))); } else { const wb=XLSX.read(rd.result,{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]]; res(XLSX.utils.sheet_to_json(ws,{header:1,defval:''})); } }catch(e){ rej(e); } };
  rd.onerror=()=>rej(rd.error);
  if(isCsv) rd.readAsText(file,'utf-8'); else rd.readAsArrayBuffer(file); }); }
const BANK_IMPORT_COLS=['Company','Bank','Account no','Type','OD limit','OD note','Note','Balance','As of'];
function openBankImport(){
  openModal(`<h2>Import accounts from Excel / CSV</h2>
   <p class="mini" style="margin-bottom:10px">One account per row. Columns (header row required): <b>Company, Bank, Account no, Type</b> (current/savings/cash · Thai ok), OD limit, OD note, Note, and optionally <b>Balance</b> + <b>As of</b> (date) to also record a balance snapshot.</p>
   <input type="file" id="bi_file" accept=".xlsx,.xls,.csv" style="width:auto;display:inline-block"> <button class="btn ghost sm" onclick="downloadBankTemplate()">⬇ Template</button>
   <div id="bi_prev" style="margin-top:14px"></div>
   <div class="right"><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
  g('bi_file').onchange=async(ev)=>{ const f=ev.target.files[0]; if(!f) return;
    try{ const rows=await readWorkbook(f); bankImportPreview(rows); }catch(e){ g('bi_prev').innerHTML='<div class="pill exp">Read error: '+esc(e.message)+'</div>'; } };
}
function downloadBankTemplate(){
  const ex=[BANK_IMPORT_COLS.join(','),
    'Elite Escapes Co.,BBL,123-4-56789-0,current,,,Operating,1250000,'+TODAY,
    'Elite Escapes Co.,SCB,987-6-54321-0,savings,3000000,OD 3M,,,',
    'Elite Escapes Co.,Cash,PETTY-01,cash,,,Front desk,80000,'+TODAY];
  downloadFile('cash-bank-accounts-template.csv', ex.join('\n'));
