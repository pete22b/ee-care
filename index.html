let _biRows=null;
function bankImportPreview(rows){
  if(!rows || rows.length<2){ g('bi_prev').innerHTML='<div class="mini">Empty file.</div>'; return; }
  const hdr=rows[0].map(h=>String(h).trim().toLowerCase());
  const ix=(...names)=>{ for(const n of names){ const i=hdr.indexOf(n.toLowerCase()); if(i>=0) return i; } return -1; };
  const col={co:ix('company','บริษัท','เจ้าของ'),bank:ix('bank','ธนาคาร'),no:ix('account no','account','เลขบัญชี','acct','account number'),
    type:ix('type','ประเภท'),od:ix('od limit','od','วงเงิน od'),odn:ix('od note','od_note'),note:ix('note','หมายเหตุ'),
    bal:ix('balance','ยอดคงเหลือ','ยอด'),asof:ix('as of','asof','วันที่','date')};
  if(col.no<0 && col.co<0){ g('bi_prev').innerHTML='<div class="pill exp">Need at least a "Company" or "Account no" column</div>'; return; }
  const out=[];
  for(let r=1;r<rows.length;r++){ const row=rows[r]; if(!row.join('').trim()) continue;
    const cell=i=>i>=0?String(row[i]).trim():'';
    const co=cell(col.co), no=cell(col.no); if(!co && !no) continue;
    let asof=cell(col.asof); asof = asof? normDate(asof) : null;
    out.push({company:co||null,bank:cell(col.bank)||null,acct_no:no||null,acct_type:normType(cell(col.type)),
      od_limit:col.od>=0?bankNum(row[col.od]):null,od_note:cell(col.odn)||null,note:cell(col.note)||null,
      balance:col.bal>=0?bankNum(row[col.bal]):null, as_of:asof});
  }
  _biRows=out;
  const withBal=out.filter(x=>x.balance!=null).length;
  const prev=out.slice(0,10).map(x=>`<tr><td>${esc(x.company||'')}</td><td>${esc(x.bank||'')}</td><td class="mini">${esc(x.acct_no||'')}</td><td>${esc(ACCT_TYPE_LBL[x.acct_type])}</td><td class="n">${x.balance!=null?fmtB(x.balance):''}</td></tr>`).join('');
  g('bi_prev').innerHTML=`<div class="kpis" style="margin-bottom:10px">
      <div class="kpi"><div class="v">${out.length}</div><div class="l">Accounts ready</div></div>
      <div class="kpi"><div class="v">${withBal}</div><div class="l">With balance snapshot</div></div></div>
    <div class="scroll"><table><thead><tr><th>Company</th><th>Bank</th><th>Account</th><th>Type</th><th class="n">Balance</th></tr></thead><tbody>${prev}</tbody></table></div>
    ${out.length>10?`<p class="mini" style="margin-top:6px">…and ${out.length-10} more</p>`:''}
    <div class="right" style="margin-top:10px"><button class="btn pri" onclick="runBankImport()">Import ${out.length} accounts</button></div>`;
}
async function runBankImport(){
  if(!_biRows||!_biRows.length){ toast('Nothing to import'); return; }
  const btn=event.target; btn.disabled=true; btn.textContent='Importing…';
  try{
    const existing={}; (DB.bankAccounts||[]).forEach(a=>{ if(a.acct_no) existing[a.acct_no.replace(/\s/g,'')]=a.id; });
    const accs=[], snaps=[], audits=[]; let sort=(DB.bankAccounts||[]).length;
    _biRows.forEach(r=>{ const key=(r.acct_no||'').replace(/\s/g,''); const id= (key&&existing[key]) || uid('ba'); if(key) existing[key]=id;
      accs.push({id,company:r.company,bank:r.bank,acct_no:r.acct_no,acct_type:r.acct_type,od_limit:r.od_limit,od_note:r.od_note,note:r.note,active:true,sort:sort++});
      if(r.balance!=null){ const date=r.as_of||S.bankDate; snaps.push({id:uid('bs'),account_id:id,as_of:date,balance:r.balance,status:'confirmed',note:'imported'});
        audits.push({actor:USER&&USER.email,action:'add',as_of:date,account_id:id,company:r.company,bank:r.bank,acct_no:r.acct_no,old_balance:null,new_balance:r.balance,note:'imported from Excel'}); }
    });
    for(let i=0;i<accs.length;i+=200) await upsert('cf_bank_accounts',accs.slice(i,i+200));
    for(let i=0;i<snaps.length;i+=200) await api('cf_bank_snapshots?on_conflict=account_id,as_of',{method:'POST',prefer:'return=minimal,resolution=merge-duplicates',body:JSON.stringify(snaps.slice(i,i+200).map(s=>Object.assign({updated_by:USER&&USER.email},s)))});
    if(audits.length) for(let i=0;i<audits.length;i+=200) await api('cf_bank_audit',{method:'POST',prefer:'return=minimal',body:JSON.stringify(audits.slice(i,i+200))});
    _biRows=null; closeModal(); toast('Imported '+accs.length+' accounts'); await loadAll(); S.tab='bank'; render();
  }catch(e){ toast('Import failed: '+e.message); btn.disabled=false; btn.textContent='Retry import'; }
}

/* ============ Import / Export (Pulse CSV) ============ */
/* Import/Export page removed 2026-09-25 — data leaked before and could not be traced; nothing leaves the system as a bulk file. */
function downloadFile(name, text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
function parseCSV(text){
  const rows=[]; let i=0,f='',row=[],q=false; text=text.replace(/^﻿/,'');
  while(i<text.length){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else { if(c==='"') q=true; else if(c===','){ row.push(f); f=''; } else if(c==='\r'){} else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; } else f+=c; }
    i++; }
  if(f.length||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>!(r.length===1&&r[0].trim()===''));
}
function normDate(s){ s=(s||'').trim(); if(!s) return null;
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/); if(m){ let [_,a,b,y]=m; if(y.length===2)y='20'+y; return y+'-'+a.padStart(2,'0')+'-'+b.padStart(2,'0'); } // M/D/Y
  const d=new Date(s); if(!isNaN(d)) return iso(d); return null;
}
function num(s){ if(s==null) return 0; const n=parseFloat(String(s).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }

let LANG='en'; try{ LANG=localStorage.getItem('ee_lang')==='th'?'th':'en'; }catch(e){}
const I18N=(()=>{
  const multi=[], single={};
  for(const [en,th] of Object.entries(I18N_TH)){ if(/\s/.test(en.trim())) multi.push(en); else single[en]=th; }
  multi.sort((a,b)=>b.length-a.length);
  const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const rx=multi.length?new RegExp('(^|[^A-Za-z])('+multi.map(esc).join('|')+')(?![A-Za-z])','g'):null;
  const lead=new RegExp('^(\\s*[^A-Za-z]*?)('+Object.keys(single).map(esc).join('|')+')(?=\\s+[0-9$฿(#]|\\s*:)');
  const cnt=new RegExp('([0-9)/])(\\s+)('+Object.keys(single).map(esc).join('|')+')(?![A-Za-z])','g');
  return {tr(s){ if(!s||!/[A-Za-z]/.test(s)) return s;
      const core=s.replace(/^[^A-Za-z]+/,'').replace(/[^A-Za-z)]+$/,'');
      if(I18N_TH[core]!==undefined) return s.replace(core,I18N_TH[core]);
      let out=rx?s.replace(rx,(m,p,w)=>p+I18N_TH[w]):s;
      out=out.replace(lead,(m,p,w)=>p+single[w]).replace(cnt,(m,a,sp,w)=>a+sp+single[w]);
      return out; }};
})();
function trText(s){ return LANG==='th'?I18N.tr(s):s; }
const I18N_NOTEXT={SCRIPT:1,STYLE:1,TEXTAREA:1,CODE:1};
function i18nNode(n){
  if(n.nodeType===3){ const p=n.parentNode; if(!p||I18N_NOTEXT[p.nodeName]||(p.closest&&p.closest('[data-notr]'))) return;
    const v=n.nodeValue; if(!/[A-Za-z]/.test(v)) return;
    if(n.__en!==undefined && v===n.__th) return;
    const t=I18N.tr(v); if(t!==v){ n.__en=v; n.__th=t; n.nodeValue=t; } return; }
  if(n.nodeType!==1||n.nodeName==='SCRIPT'||n.nodeName==='STYLE'||n.hasAttribute('data-notr')) return;
  for(const a of ['title','placeholder','alt','aria-label']){ const v=n.getAttribute(a); if(v&&/[A-Za-z]/.test(v)&&v!==n['__th_'+a]){ const t=I18N.tr(v); if(t!==v){ n['__en_'+a]=v; n['__th_'+a]=t; n.setAttribute(a,t); } } }
  for(let c=n.firstChild;c;c=c.nextSibling) i18nNode(c);
}
function i18nRestore(n){
  if(n.nodeType===3){ if(n.__en!==undefined){ if(n.nodeValue===n.__th) n.nodeValue=n.__en; delete n.__en; delete n.__th; } return; }
  if(n.nodeType!==1) return;
  for(const a of ['title','placeholder','alt','aria-label']){ if(n['__en_'+a]!==undefined){ n.setAttribute(a,n['__en_'+a]); delete n['__en_'+a]; delete n['__th_'+a]; } }
  for(let c=n.firstChild;c;c=c.nextSibling) i18nRestore(c);
}
const I18N_OBS=new MutationObserver(ms=>{ if(LANG!=='th') return; I18N_OBS.disconnect();
  try{ for(const m of ms){ if(m.type==='childList') m.addedNodes.forEach(i18nNode); else i18nNode(m.target); } }finally{ i18nWatch(); } });
function i18nWatch(){ I18N_OBS.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['title','placeholder']}); }
(function(){ const oc=window.confirm.bind(window), op=window.prompt.bind(window), oa=window.alert.bind(window);
  window.confirm=m=>oc(trText(String(m))); window.prompt=(m,d)=>op(trText(String(m)),d); window.alert=m=>oa(trText(String(m))); })();
function renderLangSw(){ const b=document.getElementById('langsw'); if(!b) return;
  b.setAttribute('data-notr','');
  b.innerHTML=`<button class="${LANG==='en'?'on':''}" onclick="setLang('en')" title="English">EN</button><button class="${LANG==='th'?'on':''}" onclick="setLang('th')" title="ภาษาไทย">TH</button>`;
  document.documentElement.lang=LANG; }
function setLang(l){ if(l===LANG) return; LANG=l; try{ localStorage.setItem('ee_lang',l); }catch(e){}
  if(l==='th'){ i18nNode(document.body); i18nWatch(); } else { I18N_OBS.disconnect(); i18nRestore(document.body); }
  renderLangSw(); }
renderLangSw(); if(LANG==='th'){ i18nNode(document.body); i18nWatch(); }
</script>
