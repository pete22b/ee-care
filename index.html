<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elite Escapes — ระบบดูแลลูกค้า & การจ่ายคืน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=Montserrat:wght@500;600;700&family=EB+Garamond:wght@500;600;700&family=Trirong:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f7f9fb; --surface:#ffffff; --surface2:#f3f6f8; --line:#e7ebef;
  --ink:#2c3b4a; --ink2:#5b6b7a; --ink3:#97a3ae;
  --s1:#e0720d; --s2:#c2611b; --s3:#2e8b57; --s8:#c0392b;
  --brand:#2f3e4e; --brand2:#3a4d60; --deep:#2f3e4e; --deep2:#46586a;
  --gold:#c9a45c; --orange:#ed7d31; --mint:#c9a45c;
  --shadow-sm:0 1px 2px rgba(44,59,74,.04),0 6px 20px -10px rgba(44,59,74,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.7 "Sarabun","IBM Plex Sans Thai","Noto Sans Thai",-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#ccd4d0;border-radius:99px;border:2.5px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#b3bdb8}
::selection{background:rgba(201,164,92,.3)}
a{color:var(--s1);text-decoration-color:rgba(224,114,13,.35)}
h1,h2,h3,h4{font-family:"EB Garamond","Trirong",Georgia,"Sarabun",serif;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
.card .v,.balance .v,.btn,.kick{font-family:"Montserrat","Prompt","Sarabun","Noto Sans Thai",sans-serif}
.app{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
/* ===== left sidebar ===== */
.side{background:linear-gradient(168deg,#071a2e 0%,#102e4c 48%,#1d4a6e 100%);color:#eef3f7;padding:30px 20px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;box-shadow:8px 0 30px -20px rgba(7,26,46,.7)}
.brand{padding:0 10px 20px;border-bottom:1px solid rgba(255,255,255,.13)}
.wordmark{font-family:"EB Garamond",Georgia,"Prompt",serif;font-size:21.5px;font-weight:600;letter-spacing:.15em;color:#d6b878;line-height:1.2;white-space:nowrap}
.kick{font-size:10px;font-weight:600;letter-spacing:.30em;text-transform:uppercase;color:rgba(255,255,255,.55);margin:10px 0 3px}
.tb-title{display:none}
.tb-sub{font-size:12px;color:rgba(255,255,255,.62);line-height:1.55}
nav{display:flex;flex-direction:column;gap:3px;margin-top:20px}
nav button{font:inherit;font-family:"Montserrat","Prompt","Sarabun",sans-serif;font-size:13px;font-weight:600;text-align:left;width:100%;padding:12px 15px;border-radius:10px;border:none;background:none;color:rgba(255,255,255,.72);cursor:pointer;transition:all .15s;letter-spacing:.08em}
nav button:hover{color:#fff;background:rgba(255,255,255,.07)}
nav button.on{color:#fff;background:rgba(255,255,255,.12);box-shadow:inset 3px 0 0 #7fc9e8;font-weight:700}
.side .tag{margin-top:auto;padding:14px 10px 0;font-size:11px;color:rgba(255,255,255,.42);line-height:1.65;border-top:1px solid rgba(255,255,255,.1)}
main{padding:34px 42px 90px;max-width:1334px}
h1{font-size:27px;font-weight:600;margin:0 0 6px;letter-spacing:0}
.sub{color:var(--ink2);font-size:13px;margin:0 0 24px}
/* ===== KPI cards ===== */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 1px 2px rgba(28,40,35,.04),0 16px 44px -20px rgba(28,40,35,.18);overflow:hidden}
.card.kpi{padding:24px 26px 20px;transition:transform .18s,box-shadow .18s}
.card.kpi:hover{transform:translateY(-3px);box-shadow:0 4px 10px rgba(28,40,35,.05),0 26px 54px -20px rgba(28,40,35,.26)}
.card.red{background:#fdeef0;border-color:#f7dfe2}
.card.orange{background:#fdf3e7;border-color:#f5e5cf}
.card.green{background:#eaf8f1;border-color:#d8efe3}
.card.blue{background:#edf3fc;border-color:#dde8f6}
.card.gold{background:#faf4e6;border-color:#efe4c8}
.card .ic{display:none}
.card .l{font-size:11px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--ink3);line-height:1.5}
.card.kpi .l{order:-1;margin-bottom:8px}
.card.kpi{display:flex;flex-direction:column;align-items:flex-start}
.card .v{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15}
.card .v.sm{font-size:23px}
.card .m{font-size:12px;color:var(--ink3)}
.card.red .v{color:var(--s8)}
.card.orange .v{color:#b25412}
.card.green .v{color:var(--s3)}
.card.blue .v{color:var(--deep2)}
/* ===== panels ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 26px;margin-bottom:20px;box-shadow:0 1px 2px rgba(28,40,35,.04),0 16px 44px -20px rgba(28,40,35,.14)}
.panel h3{margin:0 0 3px;font-size:18px;font-weight:600;display:flex;align-items:center;gap:12px;white-space:nowrap;overflow:hidden}
.panel h3::after{content:'';flex:1;height:1px;min-width:24px;background:linear-gradient(90deg,#e4d9bd,rgba(0,0,0,0))}
.panel h3 .idx{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.28em;color:#c9702e;margin-right:10px;vertical-align:1px}
.panel .cs{font-size:12.5px;color:var(--ink2);margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1000px){.row2{grid-template-columns:1fr}}
/* ===== tables ===== */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #f0f4f2;vertical-align:top}
th{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.10em;border-bottom:1.5px solid var(--line);background:none;padding-bottom:7px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr.click{transition:background .12s}
tbody tr.click:hover{background:#f3f7f5;cursor:pointer}
/* ===== pills ===== */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 11px 2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.p-paid{background:#e2f4ec;color:#0d6b46}
.p-over{background:#fae5e2;color:#a12b1f}
.p-soon{background:#faeedd;color:#9c4d13}
.p-fut{background:#eaeff5;color:#46586a}
.p-none{background:#eef1f3;color:#6b7580}
.p-welcome{background:#eaeff5;color:#46586a}
.p-cancel{background:#eef1f3;color:#97a3ae;text-decoration:line-through}
.p-up{background:#ece9f7;color:#4a3aa7}
/* ===== inputs ===== */
.search{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.search input[type=text],.search input[type=search]{flex:1;min-width:220px;padding:12px 17px;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);outline:none;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:#c9a45c;box-shadow:0 0 0 3.5px rgba(201,164,92,.18)}
select.flt,input.flt{flex:0 0 auto;padding:10px 14px;font:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;outline:none;box-shadow:var(--shadow-sm)}
.hint{font-size:12.5px;color:var(--ink3);margin:-8px 0 14px}
.bk{background:none;border:none;color:var(--s1);font:inherit;cursor:pointer;padding:0;margin-bottom:14px;font-size:14px;font-weight:600}
/* ===== profile ===== */
.profile-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:6px}
.profile-head h2{margin:0 0 2px;font-size:24px;font-weight:600}
.kv{font-size:13.5px;color:var(--ink2)}
.kv b{color:var(--ink)}
.balance{text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px;box-shadow:var(--shadow-sm)}
.balance .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.chip{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:1px 9px;font-size:12px;margin:2px 3px 0 0;color:var(--ink2)}
.contract-card h4 .chip{background:#f6f0e0;border-color:#e8dcbd;color:#87671f;font-weight:600;vertical-align:2px}
.feegrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fy{width:68px;border-radius:9px;padding:5px 0 6px;text-align:center;font-size:10.5px;line-height:1.4;border:1px solid var(--line);background:var(--surface2);color:var(--ink3)}
.fy b{display:block;font-size:12.5px;color:inherit;font-family:"Prompt",sans-serif}
.fy.paid{background:#e2f4ec;border-color:#bfe3d2;color:#0d6b46}
.fy.due{background:#fae7e4;border-color:#efc9c3;color:#a12b1f}
/* ===== buttons ===== */
.btn{display:inline-block;font:inherit;font-family:"Montserrat","Prompt","Sarabun",sans-serif;font-size:13px;font-weight:600;padding:9px 22px;border-radius:99px;border:1.5px solid #102e4c;background:linear-gradient(135deg,#1c486b,#102e4c);color:#fff;cursor:pointer;box-shadow:0 4px 14px -5px rgba(16,46,76,.5);transition:transform .12s,box-shadow .12s,filter .12s;letter-spacing:.04em}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.sec{background:#d7e9e7;color:#14324a;border-color:#c2ddda;box-shadow:var(--shadow-sm)}
.btn.sec:hover{border-color:#9fc8c4;filter:none;background:#c8e2df}
.btn.sm{padding:4px 13px;font-size:12.5px;box-shadow:none}
.btn.ghost{background:none;border-color:var(--line);color:var(--ink2);box-shadow:none}
.btn.ghost:hover{background:var(--surface2);filter:none;transform:none}
.btn.danger{background:#fff;border-color:#ecc8c3;color:#a12b1f;box-shadow:none}
.btn.danger:hover{background:#fdf4f3;filter:none;transform:none}
.btn.paybtn{background:linear-gradient(180deg,#38a267,#2e8b57);border-color:#2e8b57;box-shadow:0 3px 12px -4px rgba(46,139,87,.5)}
/* ===== misc ===== */
.note{border:1px solid #ecdfb6;border-left:4px solid var(--gold);background:#fcf9ee;padding:12px 16px;border-radius:12px;font-size:13px;color:#5c4c1c;margin-bottom:18px}
.note.blue{border-color:#f0dcc0;border-left-color:var(--orange);background:#fdf7ee;color:#7a4e18}
.tabbtns{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabbtns button{font:inherit;font-size:13.5px;font-weight:500;padding:7px 17px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink2);box-shadow:var(--shadow-sm);transition:all .13s}
.tabbtns button:hover{border-color:#dcc7a8}
.tabbtns button.on{background:linear-gradient(135deg,#1c486b,#102e4c);border-color:#102e4c;color:#fff;font-weight:700}
.contract-card{border:1px solid var(--line);border-radius:15px;padding:18px 20px;margin-bottom:16px;background:var(--surface);box-shadow:var(--shadow-sm)}
.contract-card h4{margin:0 0 2px;font-size:17.5px;font-weight:600}
.payout-sec{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0}
.form label{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:4px;font-weight:700;letter-spacing:.03em}
.form input,.form select{width:100%;padding:9px 12px;font:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.form input:focus,.form select:focus{border-color:#c9a45c;box-shadow:0 0 0 3px rgba(201,164,92,.16)}
.form .full{grid-column:1/-1}
.bars{display:grid;gap:7px;margin-top:6px}
.bar-h{display:grid;grid-template-columns:64px 1fr 130px;gap:10px;align-items:center;font-size:12.5px;color:var(--ink2)}
.bar-h .tr{height:18px;border-radius:6px;background:#eef1f4;position:relative;overflow:hidden;box-shadow:inset 0 1px 2px rgba(44,59,74,.06)}
.bar-h .tr i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#1c486b,#4180b0);border-radius:6px;min-width:0}
.bar-h .tr i.ov{background:linear-gradient(90deg,#b13527,#dd7264)}
.bar-h .amt{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
#modalwrap{position:fixed;inset:0;background:rgba(31,42,54,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
#modalwrap.hide{display:none}
#modal{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:26px 28px;box-shadow:0 24px 80px -12px rgba(22,32,44,.45)}
#modal h3{margin:0 0 12px;font-size:17px;font-weight:600}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#102e4c;color:#fff;padding:11px 22px;border-radius:99px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;box-shadow:0 10px 30px -8px rgba(22,32,44,.45)}
#toast.show{opacity:.96}
.right{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.mini{font-size:12px;color:var(--ink3)}
.scroll{overflow-x:auto}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:2px 0 12px}
.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.stack{display:grid;grid-template-columns:44px 1fr 120px;gap:10px;align-items:center;font-size:12.5px;color:var(--ink2);margin-bottom:7px;border-radius:6px;padding:1px 4px}
.stack:hover{background:#f3f6f8;cursor:pointer}
.stack .tr{display:flex;height:20px;border-radius:6px;overflow:hidden;background:#eef1f4}
.stack .tr i{height:100%;display:block}
.stack .rt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vwrap{display:flex;align-items:flex-end;gap:7px;margin-top:16px}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--ink2);cursor:pointer;border-radius:6px;padding:2px 0}
.vb:hover{background:#f3f6f8}
.vb .col{width:100%;max-width:46px;border-radius:6px 6px 0 0;background:#7d99b4}
.vb.hot .col{background:#c9702e}
.vb .num{margin-bottom:3px;font-variant-numeric:tabular-nums}
.vb .yl{margin-top:6px}
.pmix{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:12px 0 10px}
.pmix i{display:block;height:100%}
.card.gold .v{color:#8a6a25}
.sechead{font-family:"Montserrat","Prompt","Sarabun",sans-serif;font-size:16.5px;font-weight:700;margin:30px 0 14px;color:var(--ink)}
.sechead small{display:block;font-size:10px;letter-spacing:.28em;color:var(--gold);text-transform:uppercase;margin-bottom:2px;font-weight:600}
nav .badge{display:inline-block;margin-left:8px;background:#cf3d3d;color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 7px;vertical-align:1px;letter-spacing:0}
.navlab{font:600 9.5px "Montserrat",sans-serif;letter-spacing:.30em;text-transform:uppercase;color:rgba(255,255,255,.35);margin:16px 16px 5px}
.brandseg{display:flex;gap:4px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:99px;padding:4px;margin:18px 2px 0}
.brandseg button{flex:1;font:600 10px "Montserrat","Sarabun",sans-serif;padding:6px 2px;border:none;border-radius:99px;background:none;color:rgba(255,255,255,.6);cursor:pointer;letter-spacing:.02em;transition:all .15s;white-space:nowrap}
.brandseg button:hover{color:#fff}
.brandseg button.on{background:#fff;color:#102e4c;font-weight:700}
.bchip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;border-radius:6px;padding:1px 8px;vertical-align:2px;margin-left:6px;white-space:nowrap}
.bchip.ee{background:#f6eedd;color:#8a6a25;border:1px solid #e8dcbd}
.bchip.cu{background:#e8eff7;color:#3a5f88;border:1px solid #cfdff0}
.pk{font:600 10px "Montserrat",sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#b4622a;margin-bottom:7px}
h1::after{content:'';display:block;width:46px;height:3px;border-radius:2px;background:#c9702e;margin-top:10px}
.hero h1::after{background:linear-gradient(90deg,#d9853f,rgba(217,133,63,.25))}
nav .navlab:first-child{margin-top:2px}
/* ===== hero band (ภาพรวม) ===== */
.hero{position:relative;overflow:hidden;background:linear-gradient(112deg,#071c32 0%,#113250 45%,#1f547e 100%);border-radius:20px;padding:30px 34px 28px;color:#fff;margin-bottom:22px;box-shadow:0 26px 64px -26px rgba(7,28,50,.65)}
.hero::before{content:'';position:absolute;top:-130px;right:-90px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(127,201,232,.20),transparent 70%)}
.hero::after{content:'';position:absolute;bottom:-150px;left:28%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(201,164,92,.20),transparent 70%)}
.hero-in{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap}
.hero-kick{font:600 10px "Montserrat",sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#7fc9e8;margin-bottom:9px}
.hero h1{color:#fff;font-size:31px;margin:0 0 4px}
.hero .sub{color:rgba(255,255,255,.62);margin:0}
.hero-stats{display:flex;gap:36px;flex-wrap:wrap}
.hero-stats>div{padding-left:20px;border-left:1px solid rgba(255,255,255,.16)}
.hero-stats b{display:block;font:700 29px "Montserrat","Prompt",sans-serif;color:#fff;line-height:1.1;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums}
.hero-stats span{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.09em;text-transform:uppercase;font-family:"Montserrat","Sarabun",sans-serif;font-weight:600}
/* ===== donut ===== */
.donut{width:176px;height:176px;border-radius:50%;position:relative;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05),0 12px 30px -14px rgba(28,40,35,.4)}
.donut i{position:absolute;inset:27px;background:var(--surface);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;box-shadow:inset 0 2px 10px rgba(28,40,35,.07)}
.donut i b{font:700 26px "Prompt",sans-serif;letter-spacing:-.02em}
.donut i small{font-size:11px;color:var(--ink3)}
@media(max-width:840px){.app{grid-template-columns:1fr}.side{position:static;height:auto;padding:18px 16px 16px}.brand{padding-bottom:12px}.tb-title{font-size:17px}nav{flex-direction:row;flex-wrap:wrap;margin-top:14px}nav button{width:auto;padding:8px 16px}.side .tag{display:none}main{padding:22px 16px 60px}}
@media print{.side,.btn,.search,.tabbtns{display:none!important}.app{display:block}main{max-width:none;padding:0}body{background:#fff}}

/* ===== LIVE: login gate ===== */
#gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#071a2e;overflow:hidden;transition:opacity .5s}
#gate.bye{opacity:0;pointer-events:none}
#gate .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 14s ease-in-out infinite alternate}
#gate .o1{width:540px;height:540px;background:#1d4a6e;top:-160px;left:-130px}
#gate .o2{width:440px;height:440px;background:#123252;bottom:-140px;right:-90px;animation-delay:-7s}
#gate .o3{width:280px;height:280px;background:#b08d3e;bottom:18%;left:12%;opacity:.22;animation-delay:-3s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(70px,45px) scale(1.15)}}

async function authToken(){
  if(!SBC) return SB_KEY;
  try{ const {data}=await SBC.auth.getSession(); return (data&&data.session)?data.session.access_token:SB_KEY; }catch(e){ return SB_KEY; }
}
async function sbApi(path, opts={}){
  const tok = await authToken();
  const r = await fetch(SB_URL+'/rest/v1/'+path, Object.assign({}, opts, {headers:Object.assign({
    apikey:SB_KEY, Authorization:'Bearer '+tok, 'Content-Type':'application/json',
    Prefer:(opts.prefer||'')}, opts.headers||{})}));
  if(!r.ok) throw new Error((await r.text()).slice(0,300));
  if(r.status===204) return null;
  const t = await r.text(); return t?JSON.parse(t):null;
}
async function fetchAllRows(table, order){
  const out=[]; let off=0;
  while(true){
    const rows = await sbApi(table+'?select=*&order='+order+'.asc&limit=1000&offset='+off);
    out.push(...rows); if(rows.length<1000) break; off+=1000;
  }
  return out;
}

async function saveFee(cid, year){
  const c=contractById(cid); if(!c) return;
  const paid=document.getElementById('fm_paid').value==='1';
  const amtV=document.getElementById('fm_amt').value;
  const amount=amtV===''?null:parseFloat(amtV);
  const paid_date=paid?(document.getElementById('fm_date').value||TODAY):null;
  const paid_note=document.getElementById('fm_note').value.trim()||null;
  let f=(c.fees||[]).find(x=>x.year===year);
  if(!f){ f={year:year,amount:amount,amount_raw:null,paid:paid,paid_date:paid_date,paid_note:paid_note}; c.fees=c.fees||[]; c.fees.push(f); c.fees.sort((a,b)=>a.year-b.year); }

    await sbApi('mfee?on_conflict=contract_id,year',{method:'POST',prefer:'return=minimal,resolution=merge-duplicates',

const CURS = {THB:'฿',USD:'US$',EUR:'€',AUD:'A$',GBP:'£'};
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const TODAY = todayISO();
function addDaysISO(iso,days){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
const SOON = addDaysISO(TODAY,30);
function addMonthsISO(iso,m){
  const [y,mo,da]=iso.split('-').map(Number);
  const t=(mo-1)+m, ny=y+Math.floor(t/12), nm=t%12;
  const last=new Date(ny,nm+1,0).getDate();
  return ny+'-'+String(nm+1).padStart(2,'0')+'-'+String(Math.min(da,last)).padStart(2,'0');
}
function fmtD(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-').map(Number); return d+' '+TH_M[m-1]+' '+y; }
function fmtM(v,cur){ const s=CURS[cur]||cur+' '; const n=Math.round(v*100)/100; return s+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function fmtMap(map){ const ks=Object.keys(map).filter(k=>map[k]>0); if(!ks.length) return '0'; return ks.map(k=>fmtM(map[k],k)).join(' + '); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* installment status */
function instStatus(inst){
  if(inst.paid) return 'paid';
  if(inst.due < TODAY) return 'over';
  if(inst.due <= SOON) return 'soon';

}

/* every installment flattened: {contract, client, plan, inst} */
function allInstallments(){
  const out=[];
  for(const cid in OV.plans){
    const plan=OV.plans[cid], c=contractById(Number(cid));
    if(!c || !inBrand(c)) continue;
    const cl=clientByCode(c.client);
    (plan.installments||[]).forEach(inst=>out.push({c,cl,plan,inst}));
  }
  return out;
}
function planTotals(plan){
  let paid=0,unpaid=0,over=0,np=0,npaid=0;
  (plan.installments||[]).forEach(i=>{
    if(i.paid){paid+=i.amount; npaid++;}
    else {unpaid+=i.amount; np++; if(i.due<TODAY) over+=i.amount;}
  });
  return {paid,unpaid,over,np,npaid,n:(plan.installments||[]).length};
}

function bibleStats(){
  const cur = BASE.cur_year || Number(TODAY.slice(0,4));
  const act = allContracts().filter(c=>c.status!=='Cancelled' && inBrand(c));
  const years=[]; for(let y=2021;y<=cur;y++) years.push(y);
  const fee={}; years.forEach(y=>fee[y]={due:0,paid:0,billed:0,none:0});
  let billedAmt=0,billedCnt=0; const lyo={},prod={};
  act.forEach(c=>{
    prod[c.product]=(prod[c.product]||0)+1;
    if(c.lyo&&c.lyo>=cur) lyo[c.lyo]=(lyo[c.lyo]||0)+1;
    const recs={}; (c.fees||[]).forEach(f=>{recs[f.year]=f; if(!f.paid&&f.amount){billedAmt+=f.amount;billedCnt++;}});
    years.forEach(y=>{
      const inR=c.fyo&&c.lyo&&y>=c.fyo&&y<=c.lyo, r=recs[y];
      if(!inR&&!r) return;
      fee[y].due++;
      if(r&&r.paid) fee[y].paid++; else if(r) fee[y].billed++; else fee[y].none++;
    });
  });
  const exp5=act.filter(c=>c.lyo&&c.lyo>=cur&&c.lyo<=cur+4).length;
  return {cur,nAct:act.length,years,fee,billedAmt,billedCnt,lyo,prod,exp5};
}

function runCounters(){
  document.querySelectorAll('.cnt').forEach(el=>{
    const target=Number(el.dataset.n)||0;
    if(el._done===target){ el.textContent=target.toLocaleString(); return; }
    el._done=target;
    const t0=performance.now(), dur=900;
    const step=(t)=>{ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=Math.round(target*e).toLocaleString();
      if(p<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
    setTimeout(()=>{ if(document.body.contains(el)) el.textContent=target.toLocaleString(); }, dur+250);
  });
}
function areaChart(vals,labs){
  const W=640,H=200,P=26,BW=W-P*2,BH=H-P*2;
  const mx=Math.max(1,...vals);
  const pts=vals.map((v,i)=>[P+BW*i/(vals.length-1), P+BH*(1-v/mx)]);
  const line=pts.map((p,i)=>(i?'L ':'M ')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${P+BW} ${P+BH} L ${P} ${P+BH} Z`;
  const grid=[0,0.25,0.5,0.75].map(g=>`<line x1="${P}" x2="${P+BW}" y1="${(P+BH*g).toFixed(1)}" y2="${(P+BH*g).toFixed(1)}" stroke="#e9eef4" stroke-dasharray="3 4"/>`).join('');
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H+16}" style="width:100%;height:auto;min-width:480px">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f7cab" stop-opacity=".28"/><stop offset="1" stop-color="#3f7cab" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <line x1="${P}" x2="${P+BW}" y1="${P+BH}" y2="${P+BH}" stroke="#dfe6ee"/>
    <path d="${area}" fill="url(#ag)"/>
    <path d="${line}" fill="none" stroke="#1c486b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${vals[i]?4:2.5}" fill="#fff" stroke="#1c486b" stroke-width="2"><title>${labs[i]} · ${vals[i].toLocaleString()}</title></circle>`).join('')}
    ${labs.map((l,i)=>`<text x="${(P+BW*i/(vals.length-1)).toFixed(1)}" y="${H+10}" font-size="10.5" text-anchor="middle" fill="#8a97a5" font-family="Sarabun,sans-serif">${l}</text>`).join('')}
  </svg></div>
  <div class="mini">ยอดรวมทุกสกุลเงิน แยกตามเดือนที่ครบกำหนด — ชี้ที่จุดเพื่อดูตัวเลข</div>`;
}

function norm(s){ return String(s||'').toLowerCase(); }
function searchClients(q){
  q=norm(q.trim());
  if(!q) return [];
  const toks=q.split(/\s+/);
  return allClients().filter(cl=>{
    const hay = norm(cl.name)+' '+norm((cl.alt_names||[]).join(' '))+' '+norm((cl.emails||[]).join(' '))+' '+norm(cl.code)+' '+
      (cl.contract_ids||[]).map(id=>{const c=contractById(id);return c?norm(c.pa):'';}).join(' ');
    return toks.every(t=>hay.includes(t));
  });
}

      ${(()=>{ const sc=scansOf(c.pa); return sc.length?`<div class="kv">📄 สแกนสัญญา (PA) ${sc.length} ไฟล์: <span class="mini">${sc.map(s=>esc(s.file_name)).join(' · ')}</span><br>${scanDriveLink(sc)}</div>`:''; })()}

  <div style="border-top:1px dashed var(--line);padding-top:10px"><b style="font-size:13.5px">สร้างงวดจ่ายอัตโนมัติ</b>
  <div class="form">
    <div><label>วิธีคำนวณ</label><select id="pf_mode" onchange="document.getElementById('pf_rate_w').style.display=this.value==='rate'?'':'none';document.getElementById('pf_fix_w').style.display=this.value==='rate'?'none':''"><option value="rate">% ผลตอบแทนต่อปี จากมูลค่าสัญญา</option><option value="fixed">จำนวนเงินคงที่ต่องวด</option></select></div>
    <div id="pf_rate_w"><label>อัตรา % ต่อปี</label><input type="number" id="pf_rate" step="any" placeholder="เช่น 7"></div>

    <div><label>ความถี่</label><select id="pf_freq"><option value="12">รายปี</option><option value="6">ทุก 6 เดือน</option><option value="3">รายไตรมาส</option><option value="1">รายเดือน</option></select></div>
    <div><label>จำนวนงวด</label><input type="number" id="pf_count" min="1" value="5"></div>
    <div><label>วันครบกำหนดงวดแรก</label><input type="date" id="pf_first" value="${TODAY}"></div>
  </div></div>`}
  <div class="right">
    <button class="btn ghost" onclick="S.planEdit=null;render()">ยกเลิก</button>
    <button class="btn" onclick="savePlan(${c.id})">💾 บันทึกแผน</button>
  </div></div>`;
}
function savePlan(cid){
  const val=parseFloat(document.getElementById('pf_value').value);
  if(!(val>=0)){ toast('กรุณาใส่มูลค่าสัญญา'); return; }
  const cur=document.getElementById('pf_cur').value, note=document.getElementById('pf_note').value.trim();
  let plan=OV.plans[cid];
  if(!plan){ plan=OV.plans[cid]={value:val,currency:cur,note:note,installments:[]}; }
  else { plan.value=val; plan.currency=cur; plan.note=note; }
  /* auto-generate only when no installments yet and form present */
  const modeEl=document.getElementById('pf_mode');
  if(modeEl && (!plan.installments || !plan.installments.length)){
    const mode=modeEl.value, freq=parseInt(document.getElementById('pf_freq').value), count=parseInt(document.getElementById('pf_count').value)||0;
    const first=document.getElementById('pf_first').value||TODAY;
    let per=0;
    if(mode==='rate'){ const r=parseFloat(document.getElementById('pf_rate').value)||0; per=val*r/100*(freq/12); }
    else { per=parseFloat(document.getElementById('pf_fix').value)||0; }
    per=Math.round(per*100)/100;
    if(per>0 && count>0){
      plan.installments=[];
      for(let i=0;i<count;i++){
        plan.installments.push({id:uid(),label:'งวด '+(i+1)+'/'+count,due:addMonthsISO(first,freq*i),amount:per,paid:false,paid_date:null,note:''});
      }
    }
  }
  save(); pushPlan(cid); S.planEdit=null; render(); toast('บันทึกแผนจ่ายคืนแล้ว');
}
function delPlan(cid){
  const c=contractById(cid);
  if(!confirm('ลบแผนจ่ายคืนของสัญญา '+(c?c.pa:cid)+' ทั้งหมด? (รวมประวัติงวดที่จ่ายแล้ว)')) return;
  delete OV.plans[cid]; save(); pushDeletePlan(cid); render(); toast('ลบแผนแล้ว');
}
function delInst(cid,iid){
  const p=OV.plans[cid]; if(!p) return;
  const i=p.installments.find(x=>x.id===iid);
  if(!confirm('ลบงวด '+(i?i.label:'')+' ?')) return;
  p.installments=p.installments.filter(x=>x.id!==iid); save(); pushPlan(cid); render(); toast('ลบงวดแล้ว');
}
function unpay(cid,iid){
  const p=OV.plans[cid]; if(!p) return;
  const i=p.installments.find(x=>x.id===iid); if(!i) return;
  i.paid=false; i.paid_date=null; save(); pushPlan(cid); render(); toast('ยกเลิกสถานะจ่ายแล้ว');
}

function confirmPay(cid,iid){

function saveInst(cid,iid){

function exportCSV(){

function rAR(){
  const st=bibleStats();
  if(!S.ay) S.ay=st.cur;
  const act=allContracts().filter(c=>c.status!=='Cancelled' && inBrand(c));
  let rows=[];
  act.forEach(c=>{
    const recs={}; (c.fees||[]).forEach(f=>recs[f.year]=f);
    const inR=c.fyo&&c.lyo&&S.ay>=c.fyo&&S.ay<=c.lyo, r=recs[S.ay];
    if(!inR&&!r) return;
    if(r&&r.paid) return;
    const cat=r?'billed':'none';
    if(S.at!=='all'&&S.at!==cat) return;
    const paidYears=(c.fees||[]).filter(f=>f.paid).map(f=>f.year);
    rows.push({c,cat,amt:r?(r.amount||0):0,lastPaid:paidYears.length?Math.max(...paidYears):0});

  $main.innerHTML=`

/* ================= การเข้าพัก / Week Usage (สำหรับบัญชีรับรู้รายได้) ================= */
async function pushWeek(rec){
  try{
    await sbApi('week_usage?on_conflict=id',{method:'POST',prefer:'return=minimal,resolution=merge-duplicates',
      body:JSON.stringify([{id:rec.id,client_code:rec.client_code,contract_no:rec.contract_no,client_name:rec.client_name,
        use_year:rec.use_year,check_in:rec.check_in,check_out:rec.check_out,nights:rec.nights,room:rec.room,note:rec.note,
        week_type:rec.week_type||'own',rate_per_night:rec.rate_per_night,updated_by:USER&&USER.email}])});
    toast('☁️ บันทึกลงฐานกลางแล้ว');
  }catch(e){ toast('⚠️ บันทึกฐานกลางไม่สำเร็จ: '+e.message); }
}
async function deleteWeekPush(id){
  try{ await sbApi('week_usage?id=eq.'+encodeURIComponent(id),{method:'DELETE'}); }
  catch(e){ toast('⚠️ ลบจากฐานกลางไม่สำเร็จ: '+e.message); }
}

function weekCost(w){ return (w.nights||0)*(w.rate_per_night||0); }

function wuCost(){
  const g=k=>document.getElementById(k); if(!g('wu_cost')) return;
  const a=g('wu_in').value,b=g('wu_out').value; const n=(a&&b&&b>=a)?Math.round((new Date(b)-new Date(a))/86400000):0;
  const r=parseFloat(g('wu_rate').value)||0;
  g('wu_cost').value = n? (n+' คืน × '+usd(r)+' = '+usd(n*r)) : '—';
}
function saveWeek(code,id){
  const g=k=>document.getElementById(k);
  const cin=g('wu_in').value, cout=g('wu_out').value;
  if(!cin||!cout){ toast('กรุณาใส่วัน check-in และ check-out'); return; }
  if(cout<cin){ toast('วัน check-out ต้องหลัง check-in'); return; }
  const nights=Math.max(0,Math.round((new Date(cout)-new Date(cin))/86400000));
  const cno=g('wu_cno').value.trim();
  const rate=g('wu_rate').value===''?null:parseFloat(g('wu_rate').value);
  const data={client_code:code||null, client_name:g('wu_name').value.trim(), contract_no:cno, week_type:g('wu_type').value,
    use_year:parseInt(g('wu_year').value)||null, check_in:cin, check_out:cout, nights:nights, rate_per_night:rate,
    room:g('wu_room').value.trim(), note:g('wu_note').value.trim(), updated_by:(typeof USER!=='undefined'&&USER)?USER.email:null};
  let rec=id?WU.find(x=>x.id===id):null;
  if(rec){ Object.assign(rec,data); }
  else { rec=Object.assign({id:'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)},data); WU.unshift(rec); }
  pushWeek(rec); closeModal(); render(); toast(id?'แก้ไขการเข้าพักแล้ว ✅':'บันทึกการเข้าพักแล้ว ✅');
}
function deleteWeek(id){
  if(!confirm('ลบรายการเข้าพักนี้?')) return;
  WU=WU.filter(w=>w.id!==id); deleteWeekPush(id); closeModal(); render(); toast('ลบแล้ว');
}

const PAY_SOURCES=['ธนาคารกรุงเทพ (BBL)','ธนาคารไทยพาณิชย์ (SCB)','ธนาคารกสิกรไทย (KBank)','ธนาคารกรุงไทย (KTB)','Stripe','PayPal'];
function recvPayments(cno){ return RP.filter(p=>p.contract_no===cno).sort((a,b)=>(a.paid_date||'')<(b.paid_date||'')?1:-1); }
function recStatus(r){
  const st=(r.status||'').toLowerCase();
  if(st.includes('cancel')||st.includes('canx')||st.includes('cxl')) return 'cancel';
  if((r.balance||0)>0) return 'owing';
  return 'paid';   /* balance 0 = จ่ายครบ / cash out */
}
function recStats(list){
  let price=0,dep=0,bal=0,nOwe=0,nCancel=0,nPaid=0;
  const prod={};
  list.forEach(r=>{ const s2=recStatus(r);
    if(s2==='cancel'){ nCancel++; return; }
    if(r.currency==='THB'){ if(s2==='owing') nOwe++; else nPaid++; return; }  /* สัญญาสกุลบาท ไม่รวมในยอด US$ */
    price+=r.price||0; dep+=r.deposit||0; bal+=r.balance||0;
    if(s2==='owing') nOwe++; else nPaid++;
    const p=prod[r.product]=prod[r.product]||{n:0,price:0,bal:0};
    p.n++; p.price+=r.price||0; p.bal+=r.balance||0;
  });
  return {price,dep,bal,nOwe,nCancel,nPaid,prod,n:list.length};
}
function usd(v){ return 'US$'+Math.round(v||0).toLocaleString('en-US'); }
function money(r,v){ return (r&&r.currency==='THB')? '฿'+Math.round(v||0).toLocaleString('en-US') : usd(v); }

function confirmRecvPay(cno){
  const r=REC.find(x=>x.contract_no===cno); if(!r) return;

  const p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), contract_no:cno, amount:amt,
    paid_date:g('rp_date').value||TODAY, pay_type:g('rp_type').value, source:g('rp_source').value.trim(), note:g('rp_note').value.trim(),
    updated_by:(typeof USER!=='undefined'&&USER)?USER.email:null};
  RP.unshift(p); pushPayment(p);
  r.deposit=(r.deposit||0)+amt;
  r.balance=Math.max(0,(r.price||0)-r.deposit);
  r.paid_note='รับเพิ่ม '+usd(amt)+' ('+p.paid_date+') '+(p.pay_type||'')+(p.source?' · '+p.source:'');

function deletePayment(id){
  const p=RP.find(x=>x.id===id); if(!p) return;
  if(!confirm('ลบรายการรับเงิน '+usd(p.amount)+' นี้? ยอดรับแล้ว/คงค้างของสัญญาจะถูกปรับกลับ')) return;
  RP=RP.filter(x=>x.id!==id); deletePaymentPush(id);

const TOUR_LINES={AUS:'ออสเตรเลีย',NZ:'นิวซีแลนด์',USA:'อเมริกา (USA)',UK:'อังกฤษ (UK)',FR:'ฝรั่งเศส / สวิส-เบลเยียมฝรั่งเศส',SCANDI:'สแกนดิเนเวีย (สวีเดน/นอร์เวย์)',FIN:'ฟินแลนด์',OTHER:'อื่น ๆ'};
const TOUR_QUAL={'Q':['Q — Qualified',3000],'Q+':['Q+ — ทัวร์ Kudo',3500],'CT':['CT — Courtesy Tour (<35 / ไม่น่าดีล)',1500],'NQ':['ไม่ผ่านเกณฑ์ / ไม่จ่าย',0]};

function addDaysISO(iso,n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d+n); const p=x=>String(x).padStart(2,'0'); return dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate()); }
function fridayOf(iso){ if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return null; const [y,m,d]=iso.split('-').map(Number); const dow=new Date(y,m-1,d).getDay(); return addDaysISO(iso,(5-dow+7)%7); }
function tourPay(t){
  const q=t.qualify||'NQ'; let base=0, split=0, bonus=0, why=[];
  const attended = t.showed!==false && t.presentation_90!==false;
  if(!attended){ why.push(t.showed===false?'ไม่มาทัวร์':'ฟัง presentation ไม่ครบ 90 นาที'); return {base:0,split:0,bonus:0,total:0,why}; }
  base=(TOUR_QUAL[q]||[0,0])[1]; if(base) why.push(q+' ฿'+base.toLocaleString());
  if(q==='Q'||q==='Q+'){
    const L=t.line||'OTHER', night=t.found==='night';
    if(['AUS','NZ','FR','FIN','SCANDI'].includes(L)){ split=night?2000:1000; why.push('Split '+(night?'night':'day')+' ฿'+split.toLocaleString()); }
    else if(L==='USA'){ split=night?2000:500; why.push('Split USA '+(night?'night':'day')+' ฿'+split.toLocaleString()); if(t.deal){ bonus=1000; why.push('เซ็นสัญญา +฿1,000'); } }
    else if(L==='UK'){ if(t.deal){ split=1000; why.push('UK ได้ดีล ฿1,000'); } else why.push('UK ไม่ดีล — ไม่มี split'); }
  } else if(q==='CT') why.push('CT ไม่มี split');
  return {base,split,bonus,total:base+split+bonus,why};
}

  <div class="cards">
    <div class="card"><div class="v">${allClients().length.toLocaleString()}</div><div class="l">ลูกค้าในฐานกลาง</div></div>
    <div class="card"><div class="v">${allContracts().length.toLocaleString()}</div><div class="l">สัญญาในฐานกลาง</div></div>
    <div class="card"><div class="v">${nPlans}</div><div class="l">สัญญาที่มีแผนจ่ายคืน</div></div>
    <div class="card"><div class="v">${nInst}</div><div class="l">งวดจ่ายคืนทั้งหมด (จ่ายแล้ว ${nPaid})</div></div>
  </div>
  <div class="panel">
    <h3><span class="idx">01</span>เครื่องมือ</h3>
    <div class="cs">ดึงข้อมูลล่าสุดจากฐานกลาง หรือสำรองสำเนาแผนจ่ายคืน ณ เวลานี้</div>
    <button class="btn" onclick="boot();toast('กำลังโหลดข้อมูลใหม่…')">🔄 โหลดข้อมูลใหม่จากฐานกลาง</button>
    <button class="btn sec" onclick="exportOV()">⬇️ สำรองแผนจ่ายคืน (JSON)</button>
  </div>
  ${USER&&USER.role==='admin'?`<div class="panel">
    <h3><span class="idx">02</span>ผู้ใช้งานระบบ</h3>
    <div class="cs">อีเมลที่ได้รับสิทธิ์เข้าใช้งาน — ทุกการแก้ไขจะบันทึกอีเมลผู้ทำรายการ (updated_by)</div>
    <div id="userslist" class="mini">กำลังโหลดรายชื่อ…</div>
    <div class="form" style="max-width:620px;margin-top:14px">
      <div><label>อีเมล</label><input type="text" id="au_email" placeholder="somchai@elite-escapes.club"></div>
      <div><label>ชื่อ</label><input type="text" id="au_name"></div>
      <div><label>สิทธิ์</label><select id="au_role"><option value="editor">กรอกได้</option><option value="viewer">ดูอย่างเดียว</option><option value="admin">แอดมิน</option></select></div>
    </div>
    <button class="btn sec" onclick="addAppUser()">➕ เพิ่มผู้ใช้</button>
  </div>`:''}
  <div class="panel">
    <h3><span class="idx">${USER&&USER.role==='admin'?'03':'02'}</span>ความเคลื่อนไหวล่าสุด</h3>
    <div class="cs">ใครแก้อะไรเมื่อไหร่ — จากทุกเครื่องที่ใช้ระบบนี้ (คลิกแถวเพื่อเปิดโปรไฟล์)</div>
    <div id="actfeed" class="mini">กำลังโหลด…</div>
  </div>`;
  if(USER&&USER.role==='admin') loadUsers();
  loadActivity();
}
function exportOV(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({exported:TODAY,app:'ee_care_v1',data:OV},null,1)],{type:'application/json'}));
  a.download='ee-payout-backup-'+TODAY+'.json'; a.click(); toast('ส่งออกแล้ว');
}
function importOV(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const j=JSON.parse(r.result); const d=j.data||j;
    if(!d.plans){ toast('ไฟล์ไม่ถูกต้อง'); return; }
    if(!confirm('นำเข้าจะแทนที่ข้อมูลที่กรอกในเครื่องนี้ทั้งหมด — ดำเนินการต่อ?')) return;
    OV=Object.assign({plans:{},customClients:[],customContracts:[],nextCid:100000},d);
    invalidate(); save(); render(); toast('นำเข้าข้อมูลแล้ว ✅');
  }catch(e){ toast('อ่านไฟล์ไม่ได้: '+e.message); } };
  r.readAsText(f);
}
function resetOV(){
  if(!confirm('ลบแผนจ่ายคืน บันทึกการจ่าย และลูกค้าที่เพิ่มใหม่ทั้งหมดในเครื่องนี้?')) return;
  if(!confirm('ยืนยันอีกครั้ง — การลบนี้ย้อนกลับไม่ได้ (ถ้ายังไม่ได้ส่งออกสำรอง กด Cancel)')) return;
  OV={plans:{},customClients:[],customContracts:[],nextCid:100000}; invalidate(); save(); render(); toast('ล้างข้อมูลแล้ว');
}

/* ===== LIVE: viewer role guards ===== */
function canEdit(){ return USER && USER.role!=='viewer'; }
['savePlan','delPlan','delInst','unpay','confirmPay','saveInst','saveNewClient','openPayModal','openInstModal','openNewClientModal','openFeeModal','promptFeeYear','saveFee','openRecvPay','confirmRecvPay','openRecvEdit','saveRecvEdit','deletePayment','openWeekModal','saveWeek','deleteWeek','saveCase','openMktModal','saveMkt','deleteMkt','openTourModal','saveTour','deleteTour'].forEach(fn=>{
  const orig=window[fn];
  if(typeof orig==='function') window[fn]=function(){ if(!canEdit()){ toast('บัญชีของคุณมีสิทธิ์ดูอย่างเดียว'); return; } return orig.apply(this,arguments); };
});
/* ===== LIVE: activity feed ===== */
async function loadActivity(){
  const el=document.getElementById('actfeed'); if(!el) return;
  try{
    const flt='updated_by=not.is.null&updated_by=neq.migration&order=updated_at.desc&limit=12';
    const [fees,insts,plans,arp,wus]=await Promise.all([
      sbApi('mfee?select=contract_id,year,paid,updated_by,updated_at&'+flt),
      sbApi('payout_installments?select=contract_id,label,paid,updated_by,updated_at&'+flt),
      sbApi('payout_plans?select=contract_id,updated_by,updated_at&'+flt),
      sbApi('ar_payments?select=contract_no,amount,pay_type,updated_by,updated_at&'+flt).catch(()=>[]),
      sbApi('week_usage?select=client_code,client_name,contract_no,check_in,updated_by,updated_at&'+flt).catch(()=>[])
    ]);
    const items=[];
    arp.forEach(p=>items.push({at:p.updated_at,by:p.updated_by,txt:'รับเงินลูกหนี้ US$'+Number(p.amount||0).toLocaleString()+(p.pay_type?' ('+p.pay_type+')':'')+' — '+p.contract_no,code:null}));
    wus.forEach(w=>items.push({at:w.updated_at,by:w.updated_by,txt:'บันทึกการเข้าพัก '+(w.client_name||'')+' — '+(w.contract_no||'')+' (check-in '+(w.check_in||'')+')',code:w.client_code}));
    fees.forEach(f=>{const c=contractById(f.contract_id); items.push({at:f.updated_at,by:f.updated_by,txt:'บันทึกค่าบำรุงปี '+f.year+' ('+(f.paid?'ชำระแล้ว':'ยังไม่ชำระ')+') — '+(c?c.pa:f.contract_id),code:c&&c.client});});
    insts.forEach(i=>{const c=contractById(i.contract_id); items.push({at:i.updated_at,by:i.updated_by,txt:(i.paid?'บันทึกจ่าย ':'อัปเดต ')+(i.label||'งวด')+' — '+(c?c.pa:i.contract_id),code:c&&c.client});});
    plans.forEach(p=>{const c=contractById(p.contract_id); items.push({at:p.updated_at,by:p.updated_by,txt:'แก้ไขแผนจ่ายคืน — '+(c?c.pa:p.contract_id),code:c&&c.client});});
    items.sort((a,b)=>a.at<b.at?1:-1);
    const fmtT=(iso)=>{const d=new Date(iso); return d.getDate()+' '+TH_M[d.getMonth()]+' '+d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');};
    el.innerHTML = items.length? '<div class="scroll"><table><thead><tr><th>เมื่อ</th><th>ผู้ทำรายการ</th><th>รายการ</th></tr></thead><tbody>'+
      items.slice(0,15).map(x=>`<tr class="${x.code?'click':''}" ${x.code?`onclick="openClient('${x.code}','backup')"`:''}><td style="white-space:nowrap">${fmtT(x.at)}</td><td>${x.by==='team'?'ทีมงาน':esc(x.by)}</td><td>${esc(x.txt)}</td></tr>`).join('')+'</tbody></table></div>'
      : '<div class="mini">ยังไม่มีความเคลื่อนไหวจากทีม</div>';
  }catch(e){ el.textContent='โหลดไม่สำเร็จ: '+e.message; }
}
/* ===== LIVE: command palette + sync clock ===== */
let LAST_SYNC=null;
function updateSync(){
  const el=document.getElementById('synctag'); if(!el) return;
  const t=LAST_SYNC? LAST_SYNC.getHours().toString().padStart(2,'0')+':'+LAST_SYNC.getMinutes().toString().padStart(2,'0') : '—';
  el.innerHTML='🟢 ฐานข้อมูลกลาง Supabase<br>ข้อมูล ณ '+t+' น. · <a href="#" style="color:#9fd0f0" onclick="boot();toast(\'กำลังโหลดข้อมูลใหม่…\');return false">รีเฟรช</a>';
}
let PAL={q:'',idx:0,items:[]};
function openPalette(){
  if(!USER) return;
  document.getElementById('pal').classList.remove('hide');
  const inp=document.getElementById('palq'); inp.value=''; PAL.q=''; PAL.idx=0; palRender(); inp.focus();
}
function closePalette(){ document.getElementById('pal').classList.add('hide'); }
function palRender(){
  const q=norm(PAL.q.trim()); let items=[];
  if(q){
    searchClients(PAL.q).slice(0,7).forEach(cl=>items.push({t:'👤 '+cl.name,s:cl.code+(cl.nat?' · '+cl.nat:''),code:cl.code}));
    if(items.length<9){
      const have=new Set(items.map(x=>x.code));
      allContracts().filter(c=>norm(c.pa).includes(q)&&!have.has(c.client)).slice(0,9-items.length)
        .forEach(c=>items.push({t:'📄 '+c.pa,s:c.name,code:c.client}));
    }
  } else {
    items=[{t:'📊 ภาพรวม',s:'',view:'dash'},{t:'💸 การจ่ายคืน',s:'',view:'payouts'},{t:'💳 ค้างชำระ',s:'',view:'ar'},{t:'⏳ ใกล้หมดอายุ',s:'',view:'renew'},{t:'📒 ทะเบียนสัญญา',s:'',view:'bible'}];
  }
  PAL.items=items; if(PAL.idx>=items.length) PAL.idx=Math.max(0,items.length-1);
  document.getElementById('palres').innerHTML = items.length?
    items.map((it,i)=>`<div class="pal-item ${i===PAL.idx?'on':''}" onmousedown="palGo(${i})"><span>${esc(it.t)}</span><small>${esc(it.s)}</small></div>`).join('')
    : '<div class="pal-empty">ไม่พบ "'+esc(PAL.q)+'"</div>';
}
function palGo(i){
  const it=PAL.items[i]; if(!it) return;
  closePalette();
  if(it.view) go(it.view); else openClient(it.code,'clients');
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
  const pal=document.getElementById('pal');
  if(pal && !pal.classList.contains('hide')){
    if(e.key==='Escape') closePalette();
    else if(e.key==='ArrowDown'){ e.preventDefault(); PAL.idx=Math.min(PAL.idx+1,PAL.items.length-1); palRender(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); PAL.idx=Math.max(PAL.idx-1,0); palRender(); }
    else if(e.key==='Enter'){ palGo(PAL.idx); }
  } else if(e.key==='Escape'){ closeModal(); }
});
boot();
</script>
