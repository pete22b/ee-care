/* Full verification: everything the system CAN check for "can this member really stay?".
   Room/date availability is NOT here — it lives in the resort calendar, so it's a manual step. */
function bookingChecks(b,cno){
  const out=[]; const yr=Number(String(b.check_in||'').slice(0,4))||null;
  const avail = b.room_ok
    ? {s:'ok',t:'Room availability (reservations)',d:'Booked'+(b.room_unit?' · '+esc(b.room_unit):'')+(b.room_ref?' · ref '+esc(b.room_ref):'')+(b.room_by?' · by '+esc(b.room_by):'')+(b.room_at?' · '+fmtDate(String(b.room_at).slice(0,10)):'')}
    : {s:'manual',t:'Room availability (reservations)',d:'Reservations must check the resort calendar for '+(b.check_in?fmtDate(b.check_in):'?')+' – '+(b.check_out?fmtDate(b.check_out):'?')+' and confirm a room is free. Required before Confirm.'};
  if(!cno){ out.push({s:'fail',t:'Member not found',d:'No contract matches this membership no. / name. Link one below, or verify the member before confirming.'});
    out.push(avail); return out; }
  const grp=contractGroup(cno); const desc=grp?grp.entries.map(e=>e.description||'').join(' ').toLowerCase():'';
  const nm=(b.member_name||'').trim().toLowerCase(); const first=nm.split(/\s+/)[0]||'';
  const nameOk = first.length>2 && desc.indexOf(first)>=0;
  out.push({s:'ok',t:'Member found',d:esc(cno)+(b.contract?' · linked manually':' · auto-matched from '+(b.membership_no?'membership no.':'name'))});
  out.push({s:nameOk?'ok':'warn',t:'Name matches contract',d:nameOk?'The name appears on the contract.':'Name not found on the contract — verify ID / spelling before confirming.'});
  const cEmail=grp&&grp.meta&&grp.meta.email?String(grp.meta.email).trim().toLowerCase():''; const bEmail=(b.email||'').trim().toLowerCase();
  if(cEmail){ out.push({s: bEmail&&bEmail===cEmail?'ok':(bEmail?'warn':'manual'), t:'Email matches contract', d: bEmail&&bEmail===cEmail?'Booking email matches the contract on file.':(bEmail?'Booking email differs from contract ('+esc(grp.meta.email)+') — verify identity.':'No booking email to compare.')}); }
  const fyo=Number(grp&&grp.meta&&grp.meta.fyo)||null, term=termOf(cno), lyo=(fyo&&term)?fyo+term-1:null;
  if(fyo&&lyo&&yr){ const active=yr>=fyo&&yr<=lyo; out.push({s:active?'ok':'fail',t:'Membership active for '+yr,d:active?('valid '+fyo+'–'+lyo):('contract runs '+fyo+'–'+lyo+' — the requested stay year is outside the term.')}); }
  else out.push({s:'warn',t:'Membership period',d:'Contract term unknown in the system — verify manually.'});
  const el=eligibility(cno); out.push({s:el.blocked?'fail':'ok',t:'Management Fee (MFEE)',d:el.blocked?('owes '+fmt(el.out.reduce((s,l)=>s+Number(l.amount||0),0))+' — member must pay before staying.'):'No outstanding MFEE.'});
  // Stay entitlement (weeks): does the member have a week available for the requested year?
  if(grp && yr){ const ent=entitlement(grp); const e=ent&&ent.per[yr];
    if(e){ out.push({s: e.remaining>=1?'ok':'warn', t:'Stay entitlement '+yr,
      d: e.remaining>=1 ? (e.remaining+' of '+e.avail+' week(s) available'+(e.carriedIn?' (incl '+e.carriedIn+' carried over)':'')+'.')
        : (e.used>0?'This year’s week is already used.':'No entitlement week left for '+yr+' — carried-over week expired.') }); }
    else if(ent) out.push({s:'warn',t:'Stay entitlement',d:'Requested year '+yr+' is outside the entitlement term ('+ent.fyo+'–'+ent.lyo+').'}); }
  if(yr){ const st=stayOf(cno,yr); if(st&&st.stayed) out.push({s:'warn',t:'Already stayed in '+yr,d:'A stay is already logged for this year — check the remaining entitlement.'}); }
  out.push(avail);
  return out;
}
function checksHtml(b,cno){ const ic={ok:'✅',warn:'⚠️',fail:'🔴',manual:'🔎'};
  const rows=bookingChecks(b,cno).map(c=>`<div style="display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line)"><div style="flex:0 0 20px">${ic[c.s]||'•'}</div><div><b>${c.t}</b><br><span class="mini">${c.d}</span></div></div>`).join('');

/* ============ Stays & MFEE eligibility ============ */
function termOf(cno){ const t=parseInt(String(cno||'').split('/')[2]); return isNaN(t)?null:t; }
function mfeeLinesFor(cno){ return allLines().filter(x=>x.e.category===cno && x.l.line_type==='mfee').map(x=>x.l).sort((a,b)=>a.txn_date<b.txn_date?-1:1); }
function stayOf(cno,year){ return (DB.stays||[]).find(s=>s.contract===cno && Number(s.year)===Number(year))||null; }
function eligibility(cno){ const out=mfeeLinesFor(cno).filter(l=>l.txn_date<=TODAY && !l.paid); return {blocked:out.length>0, out}; }
const CUR_YEAR=Number(TODAY.slice(0,4));
function iiOf(meta){ meta=meta||{}; if(!meta.ii_tier && !meta.ii_membership) return null; return {tier:meta.ii_tier||'', from:Number(meta.ii_from)||null, until:Number(meta.ii_until)||null, label:meta.ii_membership||('Interval '+(meta.ii_tier||''))}; }
/* upsell when Interval membership (or the contract itself) expires this year or next */
function upsellInfo(g){ const ii=iiOf(g.meta); const term=termOf(g.cno); const fyo=Number(g.meta&&g.meta.fyo)||null; const lyo=(fyo&&term)?fyo+term-1:null;
  const ends=[]; if(ii&&ii.until) ends.push({what:'Interval '+(ii.tier||'')+' expires',year:ii.until}); if(lyo) ends.push({what:'Membership ends',year:lyo});
  if(!ends.length) return null; ends.sort((a,b)=>a.year-b.year); const soonest=ends[0];
  const due = soonest.year - CUR_YEAR; // <=1 = this year/next, <0 expired
  return {soonest, due, upsell: due<=1, ends}; }
function toggleSy(cno){ S.syOpen[cno]=!S.syOpen[cno]; render(); }
function syAll(open){ S.syOpen={}; if(open) membershipContracts().forEach(g=>S.syOpen[g.cno]=true); render(); }
function membershipContracts(){
  const m={}; DB.entries.forEach(e=>{ if(e.kind==='income' && e.category){ const g=(m[e.category]=m[e.category]||{cno:e.category,entries:[],meta:{}}); g.entries.push(e); if(e.meta&&Object.keys(e.meta).length) g.meta=Object.assign({},e.meta,g.meta); if(e.contract_path && !g.contract_path){ g.contract_path=e.contract_path; g.contract_name=e.contract_name; } } });
  return Object.values(m).sort((a,b)=>a.cno<b.cno?-1:1);
}
function contractPathFor(cat){ const e=(DB.entries||[]).find(x=>x.category===cat && x.contract_path); return e?{path:e.contract_path,name:e.contract_name}:{path:null,name:null}; }
/* Week-based stay entitlement (per contract T&C):
   - earn `weeks` per occupancy year (default 1);
   - each logged stay uses 1 week;
   - unused weeks roll over to the FOLLOWING year only, then expire (T&C 2.4);
   Returns {per:{year:{earned,avail,used,remaining,over,carriedIn}}, fyo,lyo,wk,term,usedTot,earnedTot}. */
function entitlement(g){
  const fyo=Number(g.meta&&g.meta.fyo)||null, term=termOf(g.cno);
  if(!fyo||!term) return null;
  const lyo=fyo+term-1, wk=Number(g.meta&&g.meta.weeks)||1;
  const per={}; let buckets=[]; // {ey:year earned, left}
  for(let y=fyo;y<=lyo;y++){
    buckets=buckets.filter(b=>b.ey>=y-1);                 // weeks older than last year expire
    const carriedIn=buckets.reduce((s,b)=>s+b.left,0);    // leftover from prior (still valid) year
    buckets.push({ey:y,left:wk});
    const avail=buckets.reduce((s,b)=>s+b.left,0);
    const st=stayOf(g.cno,y); const used=(st&&st.stayed)?1:0;
    let u=used; buckets.sort((a,b)=>a.ey-b.ey);
    for(const b of buckets){ const t=Math.min(b.left,u); b.left-=t; u-=t; }
    const remaining=buckets.reduce((s,b)=>s+b.left,0);
    per[y]={earned:wk,carriedIn,avail,used,remaining,over:u>0};
  }
  const usedTot=Object.values(per).reduce((s,r)=>s+r.used,0);
  return {per,fyo,lyo,wk,term,usedTot,earnedTot:wk*term};
}
function rStays(){
  const groups=membershipContracts().filter(g=>!(g.meta&&g.meta.subscription));
  let blocked=0, eligible=0, upsell=0;
  groups.forEach(g=>{ if(eligibility(g.cno).blocked) blocked++; else eligible++; const u=upsellInfo(g); if(u&&u.upsell) upsell++; });
  const head=`<div class="head"><div><h1>Member Benefits</h1><p class="mini">Members may not stay while a Management Fee (MFEE) is outstanding. Interval membership is tracked for renewal / upsell.</p></div></div>`;
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="v">${groups.length}</div><div class="l">Membership contracts</div></div>
    <div class="kpi"><div class="v" style="color:var(--income)">${eligible}</div><div class="l">Eligible to stay</div></div>
    <div class="kpi"><div class="v" style="color:var(--expense)">${blocked}</div><div class="l">Blocked · owes MFEE</div></div>
    <div class="kpi"><div class="v" style="color:var(--gold)">${upsell}</div><div class="l">Renew / upsell soon</div></div></div>`;
  const bar=`<div class="toolbar" style="margin-bottom:10px"><button class="btn sm ghost" onclick="syAll(true)">Expand all</button><button class="btn sm ghost" onclick="syAll(false)">Collapse all</button></div>`;
  const blocks=groups.map(g=>{
    const open=!!S.syOpen[g.cno];
    const el=eligibility(g.cno); const fyo=Number(g.meta.fyo)||null; const term=termOf(g.cno); const lyo=(fyo&&term)?fyo+term-1:null;
    const badge= el.blocked
      ? `<span class="pill exp">🔴 Blocked — owes MFEE ${fmt(el.out.reduce((s,l)=>s+Number(l.amount||0),0))}</span>`
      : `<span class="pill inc">🟢 Can stay</span>`;
    const ii=iiOf(g.meta); const u=upsellInfo(g);
    const iiBadge= ii? `<span class="pill fc" title="Interval International membership">🌐 Interval ${esc(ii.tier)}${ii.until?' · until '+ii.until:''}</span>` : '';
    const upBadge= (u&&u.upsell)? `<span class="pill" style="background:#fbf1d8;color:#8a6d1f" title="${esc(u.soonest.what)} ${u.soonest.year}">⭐ Upsell — ${esc(u.soonest.what)} ${u.soonest.year}${u.due<0?' (expired)':''}</span>` : '';
    const ent=entitlement(g);
    let rows='';
    if(fyo&&lyo){
      // the member's "active" entitlement year = earliest year in the term they haven't used yet (log-stay opens here; later years stay locked)
      let activeYear=null; for(let yy=fyo;yy<=lyo;yy++){ const s=stayOf(g.cno,yy); if(!(s&&s.stayed)){ activeYear=yy; break; } }
      for(let y=fyo;y<=lyo;y++){
        const ml=mfeeLinesFor(g.cno).find(l=>l.txn_date.slice(0,4)==String(y));
        const mfeeCell = !ml ? '<span class="pill inc" title="No MFEE this year (free/included)">free</span>'
          : (ml.paid ? '<span class="pill inc">✓ paid</span>'
            : (ml.txn_date<=TODAY ? '<span class="pill exp">● overdue</span>' : '<span class="pill off">due '+fmtDate(ml.txn_date)+'</span>'));
        const mfeeAct = ml && !ml.paid ? ` <button class="btn link" onclick="markReceived('${esc(ml.id)}')">record MFEE</button>` : '';
        const st=stayOf(g.cno,y); const stayed=st&&st.stayed;
        // Stay side only: allow logging for the current active entitlement year (earliest unused, e.g. FYO) and any past/current year (retroactive); lock later years still to come.
        const canLog = stayed || y===activeYear || y<=CUR_YEAR;
        const stayCell = stayed ? `✓ Stayed${st.check_in?' ('+fmtDate(st.check_in)+(st.check_out?'–'+fmtDate(st.check_out):'')+')':''}` : `<span class="mini" style="opacity:${canLog?'.5':'.3'}">not yet</span>`;
        const stayAct = stayed ? `<button class="btn link" onclick="openStay('${esc(g.cno)}',${y})">edit</button>`
          : (canLog ? `<button class="btn link" onclick="openStay('${esc(g.cno)}',${y})">log stay</button>`
                    : `<span class="mini" style="opacity:.3;cursor:not-allowed" title="Can't log a stay before ${y} — the year hasn't started yet">log stay</span>`);
        const e=ent&&ent.per[y];
        const wkCell = !e ? '' : (e.over
            ? '<span class="pill exp" title="Used more weeks than available">⚠ over</span>'
            : `<span title="${e.earned} earned${e.carriedIn?' + '+e.carriedIn+' carried in':''} · ${e.used} used">${e.remaining}/${e.avail} wk${e.carriedIn?' <span class="mini">(+'+e.carriedIn+' carried)</span>':''}</span>`);
        rows+=`<tr><td><b>${y}</b>${y==fyo?' <span class="mini">FYO</span>':(y==lyo?' <span class="mini">LYO</span>':'')}</td><td>${mfeeCell}${mfeeAct}</td><td>${stayCell}</td><td class="mini">${wkCell}</td><td>${stayAct}</td></tr>`;
      }
    } else {
      rows=`<tr><td colspan="5" class="mini" style="opacity:.6">No occupancy years (FYO/term missing) — add FYO in the entry's Sales report details</td></tr>`;
    }
    const cust=(g.entries[0]&&g.entries[0].description||'').split('\n')[0];
    return `<div class="card" id="sy_${cssId(g.cno)}" style="margin-bottom:10px;transition:box-shadow .3s"><div class="pad rc-head" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;cursor:pointer${open?';border-bottom:1px solid var(--line)':''}" onclick="toggleSy('${esc(g.cno)}')">
      <div><b>${open?'▾':'▸'} ${esc(g.cno)}</b> <span class="mini">· ${esc(cust)}${g.meta.unit?' · '+esc(g.meta.unit):''}${fyo?' · stay '+fyo+'–'+lyo:''}</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center">${g.contract_path?`<a class="pill" style="text-decoration:none" href="#" onclick="event.stopPropagation();openFile('cf-contracts','${esc(g.contract_path)}');return false" title="View signed contract PDF">📎 Contract</a>`:''}${ent?`<span class="pill" style="background:var(--brandsoft);color:var(--brand2)" title="${ent.wk} week(s)/yr · ${ent.usedTot} used of ${ent.earnedTot}">📅 Weeks ${ent.usedTot}/${ent.earnedTot} used</span>`:''}${badge}${iiBadge}${upBadge}</div></div>
      ${open?`<div style="overflow:auto"><table><thead><tr><th>Year</th><th>Management Fee</th><th>Stay</th><th>Weeks left</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:''}</div>`;
  }).join('');
  g('main').innerHTML=head+kpis+bar+(blocks||'<div class="card"><div class="emptyc">No membership contracts yet.</div></div>');
}

/* ============ Cash & Bank (balance register + daily snapshots) ============ */
const BANKS=['BBL','KBank','KTB','SCB','TTB','Cash','Other'];
const ACCT_TYPES=[['current','Current (กระแสรายวัน)'],['savings','Savings (ออมทรัพย์)'],['cash','Cash (เงินสด)']];
const ACCT_TYPE_LBL={current:'Current',savings:'Savings',cash:'Cash'};
function fmtB(n){ return '฿'+Math.round(n||0).toLocaleString('en-US'); }  /* bank register is always THB */
function maskAcct(s){ if(!s) return ''; if(S.bankShowFull) return s; const digits=(s.match(/\d/g)||[]); if(digits.length<=4) return s; let seen=0; const keep=digits.length-4; return s.replace(/\d/g,d=>{ seen++; return seen<=keep?'x':d; }); }
function bankSnap(accId, date){ return (DB.bankSnaps||[]).find(s=>s.account_id===accId && s.as_of===date) || null; }
function bankDates(){ return [...new Set((DB.bankSnaps||[]).map(s=>s.as_of))].sort().reverse(); }
function bankFiltered(){ let list=(DB.bankAccounts||[]).filter(a=>a.active!==false);
  if(S.bankCompany!=='all') list=list.filter(a=>a.company===S.bankCompany);
  if(S.bankBank!=='all') list=list.filter(a=>a.bank===S.bankBank);
  if(S.bankType!=='all') list=list.filter(a=>a.acct_type===S.bankType);
  const q=(S.bankQ||'').trim().toLowerCase();
  if(q) list=list.filter(a=>((a.acct_no||'')+' '+(a.note||'')+' '+(a.company||'')).toLowerCase().includes(q));
  return list; }
function rBankCash(){
  const date=S.bankDate; const accs=(DB.bankAccounts||[]).filter(a=>a.active!==false);
  const snapOf=a=>bankSnap(a.id,date);
  const bankAccs=accs.filter(a=>a.acct_type!=='cash'), cashAccs=accs.filter(a=>a.acct_type==='cash');

  const cashTotal=cashUpd.reduce((s,a)=>s+Number(snapOf(a).balance||0),0);
  const grand=bankTotal+cashTotal;
  const odUpd=accs.filter(a=>Number(a.od_limit)>0 && snapOf(a));

  const dates=bankDates();
  const head=`<div class="head"><div><h1>Cash &amp; Bank</h1><p class="mini">Daily balance snapshot per account · bank from statement · cash counted by hand · account no. shows last 4 digits · every change is logged</p></div></div>`;
  const bar=`<div class="toolbar">
     <label class="mini" style="align-self:center">Snapshot date</label>
     <input type="date" value="${date}" onchange="S.bankDate=this.value;render()" style="width:auto">

     ${dates.length?`<div class="mini" style="margin:-4px 0 12px">Snapshots: ${dates.slice(0,8).map(d=>`<a href="#" onclick="S.bankDate='${d}';render();return false" style="margin-right:10px">${fmtDate(d)}</a>`).join('')}</div>`:''}`;
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="v">${fmtB(grand)}</div><div class="l">Grand total · ${bankUpd.length+cashUpd.length} account(s) · ${fmtDate(date)}</div></div>
    <div class="kpi"><div class="v">${fmtB(bankTotal)}</div><div class="l">Bank balance · ${bankUpd.length}/${bankAccs.length} updated${waitBank>0?' · '+waitBank+' waiting':''}</div></div>
    <div class="kpi"><div class="v">${fmtB(cashTotal)}</div><div class="l">Cash on hand · ${cashUpd.length} point(s)${waitCash>0?' · '+waitCash+' waiting':''}</div></div>

  g('main').innerHTML=head+bar+kpis+(empty?'':filt)+body+bankAuditHtml();

function bankRows(list,date,grand){
  if(!list.length) return '<tr><td colspan="9" style="opacity:.5;padding:16px">No accounts match.</td></tr>';

      : `<button class="btn sm ghost" onclick="openBankBal('${esc(a.id)}')">${a.acct_type==='cash'?'Count cash':'Upload statement'}</button>`;

      <td>${typ}</td>

/* auto-read the current balance out of an attached bank statement (Excel/CSV) */
function numVal(v){ if(v==null||v==='') return null; if(typeof v==='number') return v; const n=parseFloat(String(v).replace(/,/g,'').replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; }
function last3(s){ const d=String(s||'').replace(/\D/g,''); return d.length>=3?d.slice(-3):d; }
function parseThaiDate(s){ const m=String(s||'').match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if(!m) return null; let d=m[1],mo=m[2],y=m[3]; if(y.length===2)y='20'+y; let yy=+y; if(yy>2400) yy-=543; if(+mo>12||+d>31) return null; return yy+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function findStatementBalance(rows){
  let acctNo=null, stmtDate=null;
  const acctLabels=['account number','account no','a/c no.','a/c no','เลขที่บัญชี','บัญชีเลขที่','เลขบัญชี'];
  const dateLabels=['printed on','as of','statement date','ณ วันที่','วันที่พิมพ์','วันที่'];
  for(let r=0;r<rows.length && (!acctNo||!stmtDate);r++){ const row=rows[r]||[]; for(let c=0;c<row.length;c++){ const t=String(row[c]==null?'':row[c]).trim().toLowerCase().replace(/\s+/g,' '); if(!t) continue;
    if(!acctNo && acctLabels.some(l=>t===l||t.indexOf(l)>=0)){ for(let cc=c+1;cc<row.length;cc++){ const v=String(row[cc]||'').trim(); if(/\d{3,}/.test(v) && !/balance|บาท/i.test(v)){ acctNo=v; break; } } }
    if(!stmtDate && dateLabels.some(l=>t===l||t.indexOf(l)>=0)){ for(let cc=c+1;cc<row.length;cc++){ const d=parseThaiDate(row[cc]); if(d){ stmtDate=d; break; } } }
  } }
  /* summary balance field (BBL/KTB/SCB/KBank all expose one) — highest priority wins */
  const labels=[['ledger balance',6],['available balance',5],['current balance',6],['closing balance',6],['ending balance',6],
    ['balance carried forward',5],['cash balance',3],['ยอดคงเหลือยกไป',6],['ยอดเงินคงเหลือ',4],['ยอดคงเหลือ',4],['ยอดยกไป',5],['ยอดเงินฝากคงเหลือ',4]];
  let best=null,bp=-1,bl='';
  for(let r=0;r<rows.length;r++){ const row=rows[r]||[]; for(let c=0;c<row.length;c++){ const raw=String(row[c]==null?'':row[c]).trim(); if(!raw) continue; const t=raw.toLowerCase().replace(/\s+/g,' ');
    for(const [lab,p] of labels){ const exact=t===lab, inc=t.indexOf(lab)>=0; if(exact||inc){ const score=p+(exact?0.5:0);
      for(let cc=c+1;cc<row.length;cc++){ const v=numVal(row[cc]); if(v!=null){ if(score>bp){best=v;bp=score;bl=raw;} break; } } } } } }
  if(best!=null) return {balance:best,label:bl,acctNo,stmtDate};
  /* fallback: transaction table with a "balance" column → take the balance of the LATEST-dated row (handles newest-first or oldest-first) */
  let balCol=-1,dateCol=-1,hdrRow=-1;
  for(let r=0;r<Math.min(rows.length,10);r++){ const row=rows[r]||[]; for(let c=0;c<row.length;c++){ const h=String(row[c]||'').toLowerCase().trim();
    if(balCol<0 && (/\bbalance\b/.test(h)||/คงเหลือ/.test(h))) { balCol=c; hdrRow=r; }
    if(dateCol<0 && (/\bdate\b/.test(h)||/วันที่/.test(h))) dateCol=c; }
    if(balCol>=0) break; }
  if(balCol>=0){ let bestD='',bestV=null,lastV=null;
    for(let r=hdrRow+1;r<rows.length;r++){ const v=numVal((rows[r]||[])[balCol]); if(v==null) continue; lastV=v;
      if(dateCol>=0){ const d=parseThaiDate((rows[r]||[])[dateCol]); if(d && d>=bestD){ bestD=d; bestV=v; } } }
    const val=(bestV!=null)?bestV:lastV;
    if(val!=null) return {balance:val,label:'balance column'+(bestD?(' · '+fmtDate(bestD)):''),acctNo,stmtDate};
  }
  return (acctNo||stmtDate)?{balance:null,label:'',acctNo,stmtDate}:null;
}
async function onStatementPick(accId){ const f=g('bb_file').files[0]; const msg=g('bb_readmsg'); if(!f||!msg) return;
  if(!/\.(xls|xlsx|csv)$/i.test(f.name)){ msg.innerHTML='<span class="mini">PDF / image attached — enter the balance by hand</span>'; return; }
  msg.innerHTML='<span class="mini">Reading statement…</span>';
  try{ const rows=await readWorkbook(f); const res=findStatementBalance(rows);
    if(!res){ msg.innerHTML='<span class="mini">Could not read a balance — enter it by hand</span>'; return; }
    let html='';
    if(res.balance!=null){ g('bb_amt').value=res.balance; html+='<span class="pill inc">✓ read '+fmtB(res.balance)+'</span>'; }
    else html+='<span class="mini">No balance found — enter by hand.</span>';
    const info=[]; if(res.acctNo) info.push('a/c '+esc(res.acctNo)); if(res.stmtDate) info.push('dated '+fmtDate(res.stmtDate));
    if(info.length) html+=' <span class="mini">'+info.join(' · ')+'</span>';
    const acc=DB.bankAccounts.find(x=>x.id===accId); const warns=[];
    if(res.acctNo && acc && acc.acct_no && last3(res.acctNo)!==last3(acc.acct_no)) warns.push('⚠ statement account may not match this one ('+esc(maskAcct(acc.acct_no))+')');
    if(res.stmtDate && res.stmtDate!==S.bankDate) warns.push('⚠ statement dated '+fmtDate(res.stmtDate)+' — snapshot date is '+fmtDate(S.bankDate));
    if(warns.length) html+='<div style="margin-top:5px">'+warns.map(w=>'<span class="pill exp">'+w+'</span>').join(' ')+'</div>';
    else if(res.balance!=null) html+=' <span class="mini">— check &amp; Save</span>';
    msg.innerHTML=html;
  }catch(e){ msg.innerHTML='<span class="mini">Could not read the file — enter the balance by hand</span>'; }
}

function normType(v){ v=(v||'').toString().trim().toLowerCase(); if(/cash|เงินสด/.test(v)) return 'cash'; if(/sav|ออม/.test(v)) return 'savings'; return 'current'; }
function bankNum(v){ if(v==null||v==='') return null; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; }
function readWorkbook(file){ return new Promise((res,rej)=>{ const rd=new FileReader(); const isCsv=/\.csv$/i.test(file.name)||file.type==='text/csv';
  rd.onload=()=>{ try{ if(isCsv){ res(parseCSV(String(rd.result))); } else { const wb=XLSX.read(rd.result,{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]]; res(XLSX.utils.sheet_to_json(ws,{header:1,defval:''})); } }catch(e){ rej(e); } };
  rd.onerror=()=>rej(rd.error);
  if(isCsv) rd.readAsText(file,'utf-8'); else rd.readAsArrayBuffer(file); }); }

let _biRows=null;
function bankImportPreview(rows){
  if(!rows || rows.length<2){ g('bi_prev').innerHTML='<div class="mini">Empty file.</div>'; return; }
  const hdr=rows[0].map(h=>String(h).trim().toLowerCase());
  const ix=(...names)=>{ for(const n of names){ const i=hdr.indexOf(n.toLowerCase()); if(i>=0) return i; } return -1; };
  const col={co:ix('company','บริษัท','เจ้าของ'),bank:ix('bank','ธนาคาร'),no:ix('account no','account','เลขบัญชี','acct','account number'),
    type:ix('type','ประเภท'),od:ix('od limit','od','วงเงิน od'),odn:ix('od note','od_note'),note:ix('note','หมายเหตุ'),
    bal:ix('balance','ยอดคงเหลือ','ยอด'),asof:ix('as of','asof','วันที่','date')};
  if(col.no<0 && col.co<0){ g('bi_prev').innerHTML='<div class="pill exp">Need at least a "Company" or "Account no" column</div>'; return; }

      balance:col.bal>=0?bankNum(row[col.bal]):null, as_of:asof});

  const prev=out.slice(0,10).map(x=>`<tr><td>${esc(x.company||'')}</td><td>${esc(x.bank||'')}</td><td class="mini">${esc(x.acct_no||'')}</td><td>${esc(ACCT_TYPE_LBL[x.acct_type])}</td><td class="n">${x.balance!=null?fmtB(x.balance):''}</td></tr>`).join('');
  g('bi_prev').innerHTML=`<div class="kpis" style="margin-bottom:10px">

    <div class="right" style="margin-top:10px"><button class="btn pri" onclick="runBankImport()">Import ${out.length} accounts</button></div>`;
}
async function runBankImport(){
  if(!_biRows||!_biRows.length){ toast('Nothing to import'); return; }
  const btn=event.target; btn.disabled=true; btn.textContent='Importing…';
  try{
    const existing={}; (DB.bankAccounts||[]).forEach(a=>{ if(a.acct_no) existing[a.acct_no.replace(/\s/g,'')]=a.id; });
    const accs=[], snaps=[], audits=[]; let sort=(DB.bankAccounts||[]).length;
    _biRows.forEach(r=>{ const key=(r.acct_no||'').replace(/\s/g,''); const id= (key&&existing[key]) || uid('ba'); if(key) existing[key]=id;
      accs.push({id,company:r.company,bank:r.bank,acct_no:r.acct_no,acct_type:r.acct_type,od_limit:r.od_limit,od_note:r.od_note,note:r.note,active:true,sort:sort++});

        audits.push({actor:USER&&USER.email,action:'add',as_of:date,account_id:id,company:r.company,bank:r.bank,acct_no:r.acct_no,old_balance:null,new_balance:r.balance,note:'imported from Excel'}); }
    });
    for(let i=0;i<accs.length;i+=200) await upsert('cf_bank_accounts',accs.slice(i,i+200));
    for(let i=0;i<snaps.length;i+=200) await api('cf_bank_snapshots?on_conflict=account_id,as_of',{method:'POST',prefer:'return=minimal,resolution=merge-duplicates',body:JSON.stringify(snaps.slice(i,i+200).map(s=>Object.assign({updated_by:USER&&USER.email},s)))});
    if(audits.length) for(let i=0;i<audits.length;i+=200) await api('cf_bank_audit',{method:'POST',prefer:'return=minimal',body:JSON.stringify(audits.slice(i,i+200))});
    _biRows=null; closeModal(); toast('Imported '+accs.length+' accounts'); await loadAll(); S.tab='bank'; render();
  }catch(e){ toast('Import failed: '+e.message); btn.disabled=false; btn.textContent='Retry import'; }
}

/* ============ Companies ============ */
function rCompanies(){
  const cnt={}; DB.entries.forEach(e=>{ if(e.company) cnt[e.company]=(cnt[e.company]||0)+1; });
  const head=`<div class="head"><div><h1>Companies</h1><p class="mini">Group entries by company — like Pulse projects</p></div><div class="sp"></div><button class="btn pri" onclick="openCompany()">＋ Add company</button></div>`;
  const rows=DB.companies.length?DB.companies.map(c=>`<tr><td><b>${esc(c.name)}</b>${c.note?'<br><span class="mini">'+esc(c.note)+'</span>':''}</td><td class="n">${cnt[c.name]||0} entries</td><td><button class="btn link" onclick="openCompany('${esc(c.id)}')">Edit</button></td></tr>`).join('')
    :'<tr><td colspan="3" style="opacity:.5;padding:20px">No companies yet.</td></tr>';
  g('main').innerHTML=head+`<div class="scroll"><table><thead><tr><th>Company</th><th class="n">Entries</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function openCompany(id){ const c=id?DB.companies.find(x=>x.id===id):null;
  openModal(`<h2>${id?'Edit':'Add'} company</h2><div class="grid2"><div class="full"><label>Name</label><input id="c_name" value="${esc(c?c.name:'')}"></div><div class="full"><label>Note</label><input id="c_note" value="${esc(c?c.note:'')}"></div></div>
  <div class="right">${id?`<button class="btn danger" onclick="delCompany('${esc(id)}')">Delete</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveCompany('${id?esc(id):''}')">Save</button></div>`); }
async function saveCompany(id){ const name=g('c_name').value.trim(); if(!name){ toast('Name required'); return; }
  const c={id:id||uid('co'),name,note:g('c_note').value.trim()||null};
  try{ await upsert('cf_companies',[c]); closeModal(); toast('Saved'); await loadAll(); }catch(e){ toast('Failed: '+e.message); } }
async function delCompany(id){ if(!confirm('Delete company?')) return; try{ await del('cf_companies',id); closeModal(); toast('Deleted'); await loadAll(); }catch(e){ toast('Failed: '+e.message); } }

/* ============ Accounts (Financial Accounts) ============ */
function rAccounts(){
  const head=`<div class="head"><div><h1>Financial Accounts</h1><p class="mini">Opening balance per account — the starting point for Cash on Hand</p></div><div class="sp"></div><button class="btn pri" onclick="openAccount()">＋ Add account</button></div>`;
  const rows=DB.accounts.map(a=>`<tr><td><b>${esc(a.name)}</b> ${a.is_primary?'<span class="pill inc">Primary</span>':''}</td><td>${esc(a.currency||'THB')}</td><td class="n">${fmt(a.opening_balance)}</td><td>${a.opening_date?fmtDate(a.opening_date):'—'}</td><td><button class="btn link" onclick="openAccount('${esc(a.id)}')">Edit</button></td></tr>`).join('');
  g('main').innerHTML=head+`<div class="scroll"><table><thead><tr><th>Account</th><th>Currency</th><th class="n">Opening balance</th><th>As of</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function openAccount(id){ const a=id?DB.accounts.find(x=>x.id===id):null;
  openModal(`<h2>${id?'Edit':'Add'} account</h2><div class="grid2">
    <div class="full"><label>Name</label><input id="a_name" value="${esc(a?a.name:'')}"></div>
    <div><label>Opening balance</label><input id="a_bal" type="number" step="any" value="${a?a.opening_balance:0}"></div>
    <div><label>As of date</label><input id="a_date" type="date" value="${(a&&a.opening_date)||TODAY}"></div>
    <div><label>Currency</label><select id="a_cur">${Object.keys(CURSYM).map(c=>`<option ${(a&&a.currency||'THB')===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div><label><input type="checkbox" id="a_pri" ${a&&a.is_primary?'checked':''} style="width:auto;margin-right:6px">Primary account</label></div>
  </div><div class="right">${id&&!a.is_primary?`<button class="btn danger" onclick="delAccount('${esc(id)}')">Delete</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveAccount('${id?esc(id):''}')">Save</button></div>`); }
async function saveAccount(id){ const name=g('a_name').value.trim(); if(!name){ toast('Name required'); return; }
  const pri=g('a_pri').checked;
  const a={id:id||uid('ac'),name,opening_balance:parseFloat(g('a_bal').value)||0,opening_date:g('a_date').value||TODAY,currency:g('a_cur').value,is_primary:pri,sort:(DB.accounts.find(x=>x.id===id)||{}).sort||DB.accounts.length};
  try{ if(pri){ const others=DB.accounts.filter(x=>x.is_primary&&x.id!==a.id).map(x=>Object.assign({},x,{is_primary:false})); if(others.length) await upsert('cf_accounts',others); }
    await upsert('cf_accounts',[a]); closeModal(); toast('Saved'); await loadAll(); }catch(e){ toast('Failed: '+e.message); } }
async function delAccount(id){ if(!confirm('Delete account?')) return; try{ await del('cf_accounts',id); closeModal(); toast('Deleted'); await loadAll(); }catch(e){ toast('Failed: '+e.message); } }

/* ============ Import / Export (Pulse CSV) ============ */
const IMPORT_COLS=['Date','Title','Account','Company','Description','Category','Memo','Payment','Deposit'];
function rImport(){
  const head=`<div class="head"><div><h1>Import / Export</h1><p class="mini">Bring data in from a CSV, or export what you have — Pulse-compatible format</p></div></div>`;
  const body=`<div class="card pad" style="margin-bottom:16px">
    <h2>Import from CSV</h2>
    <p class="mini" style="margin-bottom:12px">One (1) payment or deposit per row. Required: <b>Date</b> and either <b>Payment</b> (expense) or <b>Deposit</b> (income). Optional: Title, Account, Company, Description, Category, Memo.</p>
    <input type="file" id="csvfile" accept=".csv,text/csv" style="max-width:340px;display:inline-block;width:auto">
    <button class="btn ghost sm" onclick="downloadTemplate()">⬇ Download CSV template</button>
    <div id="preview" style="margin-top:16px"></div>
  </div>
  <div class="card pad"><h2>Export</h2><p class="mini" style="margin-bottom:10px">Download every scheduled line as CSV (${DB.lines.length} rows) in the same column format.</p>
  <button class="btn" onclick="exportCSV()">⬇ Export CSV</button></div>
  <table style="margin-top:16px" class="mini"><thead><tr>${IMPORT_COLS.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
  <tbody><tr><td>2026-10-01</td><td>Office Rent</td><td>Primary</td><td>Club Unique</td><td>HQ Patong</td><td>Rent</td><td>Monthly</td><td>50000</td><td></td></tr>
  <tr><td>2026-10-05</td><td>Sales Deck PBH</td><td>Primary</td><td>Club Unique</td><td>John Smith</td><td>TCU-0001</td><td>Instalment</td><td></td><td>36500</td></tr></tbody></table>`;
  g('main').innerHTML=head+body;
  g('csvfile').onchange=onCSV;
}
function downloadTemplate(){
  const rows=[IMPORT_COLS.join(','),'2026-10-01,Office Rent,Primary,Club Unique,HQ,Rent,Monthly,50000,','2026-10-05,Sales Deck PBH,Primary,Club Unique,John Smith,TCU-0001,Instalment,,36500'];
  downloadFile('cashflow-template.csv', rows.join('\n'));
}
function downloadFile(name, text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
function parseCSV(text){
  const rows=[]; let i=0,f='',row=[],q=false; text=text.replace(/^﻿/,'');
  while(i<text.length){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else { if(c==='"') q=true; else if(c===','){ row.push(f); f=''; } else if(c==='\r'){} else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; } else f+=c; }
    i++; }
  if(f.length||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>!(r.length===1&&r[0].trim()===''));
}
function normDate(s){ s=(s||'').trim(); if(!s) return null;
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/); if(m){ let [_,a,b,y]=m; if(y.length===2)y='20'+y; return y+'-'+a.padStart(2,'0')+'-'+b.padStart(2,'0'); } // M/D/Y
  const d=new Date(s); if(!isNaN(d)) return iso(d); return null;
}
function num(s){ if(s==null) return 0; const n=parseFloat(String(s).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
let _importRows=null;
function onCSV(ev){
  const file=ev.target.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ buildPreview(parseCSV(rd.result)); }catch(e){ g('preview').innerHTML='<div class="pill exp">Parse error: '+esc(e.message)+'</div>'; } };
  rd.readAsText(file);
}
function buildPreview(rows){
  if(rows.length<2){ g('preview').innerHTML='<div class="mini">Empty file.</div>'; return; }
  const hdr=rows[0].map(h=>h.trim().toLowerCase());
  const idx=name=>hdr.indexOf(name.toLowerCase());
  const col={date:idx('date'),title:idx('title'),account:idx('account'),company:idx('company'),description:idx('description'),category:idx('category'),memo:idx('memo'),payment:idx('payment'),deposit:idx('deposit')};
  if(col.date<0){ g('preview').innerHTML='<div class="pill exp">Missing required "Date" column</div>'; return; }
  const parsed=[], bad=[];
  for(let r=1;r<rows.length;r++){ const row=rows[r]; if(!row.join('').trim()) continue;
    const date=normDate(row[col.date]);
    const pay=col.payment>=0?num(row[col.payment]):0, dep=col.deposit>=0?num(row[col.deposit]):0;
    if(!date || (pay<=0&&dep<=0)){ bad.push(r+1); continue; }
    const kind = dep>0?'income':'expense', amount= dep>0?dep:pay;
    parsed.push({date,kind,amount,
      title:(col.title>=0?row[col.title]:'')||'(imported)',
      account:col.account>=0?(row[col.account]||''):'',
      company:col.company>=0?(row[col.company]||''):'',
      description:col.description>=0?(row[col.description]||''):'',
      category:col.category>=0?(row[col.category]||''):'',
      memo:col.memo>=0?(row[col.memo]||''):''});
  }
  _importRows=parsed;
  const inc=parsed.filter(p=>p.kind==='income'), exp=parsed.filter(p=>p.kind==='expense');
  const sum=a=>a.reduce((s,x)=>s+x.amount,0);
  const prev=parsed.slice(0,12).map(p=>`<tr><td>${fmtDate(p.date)}</td><td><span class="pill ${p.kind==='income'?'inc':'exp'}">${p.kind}</span></td><td>${esc(p.title)}</td><td>${esc(p.category||'—')}</td><td>${esc(p.company||'—')}</td><td class="n">${fmt(p.amount)}</td></tr>`).join('');
  g('preview').innerHTML=`<div class="kpis" style="margin-bottom:12px">
      <div class="kpi"><div class="v">${parsed.length}</div><div class="l">Rows ready</div></div>
      <div class="kpi"><div class="v" style="color:var(--income)">${fmt(sum(inc))}</div><div class="l">${inc.length} income</div></div>
      <div class="kpi"><div class="v" style="color:var(--expense)">${fmt(sum(exp))}</div><div class="l">${exp.length} expense</div></div>
      ${bad.length?`<div class="kpi"><div class="v" style="color:var(--ink3)">${bad.length}</div><div class="l">Skipped (no date/amount)</div></div>`:''}
    </div>
    <div class="scroll"><table><thead><tr><th>Date</th><th>Type</th><th>Title</th><th>Category</th><th>Company</th><th class="n">Amount</th></tr></thead><tbody>${prev}</tbody></table></div>
    ${parsed.length>12?`<p class="mini" style="margin-top:6px">…and ${parsed.length-12} more rows</p>`:''}
    <div class="right"><button class="btn pri" onclick="runImport()">Import ${parsed.length} rows</button></div>`;
}
async function runImport(){
  if(!_importRows||!_importRows.length){ toast('Nothing to import'); return; }
  const btn=event.target; btn.disabled=true; btn.textContent='Importing…';
  try{
    const primary=primaryAccount();
    // ensure companies & categories
    const cos=[...new Set(_importRows.map(r=>r.company).filter(Boolean))];
    const cats=[...new Set(_importRows.map(r=>r.category).filter(Boolean))];
    const newCos=cos.filter(n=>!DB.companies.some(c=>c.name===n)).map(n=>({id:uid('co'),name:n}));
    const newCats=cats.filter(n=>!DB.categories.some(c=>c.name===n)).map(n=>({id:uid('ct'),name:n}));
    if(newCos.length) await upsert('cf_companies',newCos);
    if(newCats.length) await upsert('cf_categories',newCats);
    const entries=[], lines=[];
    _importRows.forEach(r=>{ const id=uid('en');
      const acc=DB.accounts.find(a=>a.name.toLowerCase()===(r.account||'').toLowerCase());
      entries.push({id,kind:r.kind,title:r.title,category:r.category||null,company:r.company||null,account:(acc&&acc.id)||(primary&&primary.id),description:r.description||null,active:true,note:r.memo||null});
      lines.push({id:uid('ln'),entry_id:id,amount:r.amount,txn_date:r.date,repeat:'never',forecast:false});
    });
    // batch in chunks of 500
    for(let i=0;i<entries.length;i+=500) await upsert('cf_entries',entries.slice(i,i+500));
    for(let i=0;i<lines.length;i+=500) await upsert('cf_lines',lines.slice(i,i+500));
    toast('Imported '+entries.length+' entries'); _importRows=null;
    await loadAll(); S.tab='cashflow'; render();
  }catch(e){ toast('Import failed: '+e.message); btn.disabled=false; btn.textContent='Retry import'; }
}
function exportCSV(){
  const out=[IMPORT_COLS.join(',')];
  allLines().forEach(({l,e})=>{ const cell=v=>{ v=v==null?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    out.push([l.txn_date,e.title,accName(e.account),e.company,e.description,e.category,(l.memo||(l.repeat&&l.repeat!=='never'?REPLBL[l.repeat]:'')||e.note||''),
      e.kind==='expense'?l.amount:'', e.kind==='income'?l.amount:''].map(cell).join(',')); });
  downloadFile('elite-cashflow-'+TODAY+'.csv', out.join('\n'));
  toast('Exported '+(out.length-1)+' rows');
}

/* ============ start ============ */
boot();
</script>
