<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Extranet — Elite Escapes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=EB+Garamond:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f8;--surface:#fff;--ink:#1a2733;--ink2:#5a6b7a;--ink3:#93a1af;--line:#e4e9ee;--line2:#eef2f5;
--brand:#0e9f8e;--brand2:#0b7e70;--brandsoft:#e6f6f4;--income:#12a56f;--incomesoft:#e5f6ee;--expense:#e2574b;--expensesoft:#fbe9e7;
--gold:#c9a45c;--pulse:#2f7fd6;--shadow:0 1px 2px rgba(16,32,48,.05),0 6px 20px -8px rgba(16,32,48,.12);--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Inter","IBM Plex Sans Thai",system-ui,sans-serif}
a{color:var(--brand)}
h1{font-size:22px;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
.mini{font-size:12px;color:var(--ink3)}
.muted{color:var(--ink2)}
button{font:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;box-shadow:var(--shadow);transition:.13s}
.btn:hover{border-color:#cdd6de}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.inc{background:linear-gradient(135deg,#18b579,#0f8f60);border-color:transparent;color:#fff}
.btn.exp{background:linear-gradient(135deg,#ef6a5e,#d8483c);border-color:transparent;color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line)}
.btn.danger{color:var(--expense);border-color:#f0c9c4}
.btn.link{border:none;background:none;box-shadow:none;color:var(--brand);padding:4px 2px}
input,select{font:inherit;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);outline:none;width:100%}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandsoft)}
label{font-size:12px;font-weight:600;color:var(--ink2);display:block;margin-bottom:4px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
.pill.inc{background:var(--incomesoft);color:#0c7d52}
.pill.exp{background:var(--expensesoft);color:#b83c31}
.pill.fc{background:#e8f0fb;color:#2565aa}
.pill.off{background:#eef2f5;color:#8a98a5}
/* layout */
:root{--side-w:248px;--top-h:64px}
/* left sidebar nav — PISONA-style grouped dark card (below full-width header) */
.side{position:fixed;top:var(--top-h);left:0;bottom:0;width:var(--side-w);z-index:40;
  display:flex;flex-direction:column;padding:14px;gap:0;overflow:visible;
  border-left:4px solid #1f5fa0}
.sidecard{flex:1;min-height:0;overflow-y:auto;-ms-overflow-style:none;scrollbar-width:thin;
  background:linear-gradient(180deg,#40566a 0%,#1c3d5a 48%,#0b2338 100%);
  border-radius:18px;padding:18px 12px;display:flex;flex-direction:column;gap:6px;
  box-shadow:0 14px 40px -18px rgba(9,24,44,.6)}
.sidecard::-webkit-scrollbar{width:6px}
.sidecard::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px}
.side-title{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:#d8b568;padding:2px 12px 8px}
.navgrp{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.navgrp:first-of-type{margin-top:0}
.navlbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:#d8b65e;padding:8px 12px 4px}
.sidecard button{display:block;width:100%;text-align:left;background:none;border:none;
  color:rgba(255,255,255,.82);padding:10px 13px;margin:0;cursor:pointer;font-weight:600;
  font-size:13px;letter-spacing:.01em;white-space:nowrap;border-radius:10px;line-height:1.1;
  transition:background .12s,color .12s}
.sidecard button:hover{color:#fff;background:rgba(255,255,255,.08)}
.sidecard button.on{color:#123453;background:#fff;font-weight:700;
  box-shadow:0 4px 14px -6px rgba(0,0,0,.4)}
/* full-width top header (logo left · search · user right) — matches public site */
.top{position:sticky;top:0;z-index:50;background:#fff;color:var(--ink);border-bottom:1px solid var(--line);box-shadow:0 2px 12px -8px rgba(16,32,48,.18)}
.top-in{max-width:none;margin:0;display:flex;align-items:center;gap:22px;padding:0 24px;height:var(--top-h)}
.top-in .brand{flex:none;display:flex;align-items:center}
.top-in .brand .logo{height:40px;width:auto;display:block}
.top .right{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2);white-space:nowrap;flex:none}
.gsearch{position:relative;flex:1 1 auto;max-width:680px;margin:0 auto}
.gsearch input{width:100%;padding:11px 16px;border-radius:22px;background:var(--bg);border:1px solid var(--line);font-size:13.5px}
.gsearch input:focus{background:#fff;border-color:var(--brand);box-shadow:0 0 0 3px var(--brandsoft)}
.gsres{position:absolute;top:calc(100% + 8px);right:0;width:380px;max-width:86vw;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:60;padding:6px}
.gsres.hide{display:none}
.gsres .grp{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);padding:9px 10px 4px;font-weight:700}
.gsitem{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
.gsitem:hover,.gsitem.hl{background:var(--brandsoft)}
.gsitem .ic{font-size:16px;flex:none;width:20px;text-align:center}
.gsitem .tx b{font-size:13px;color:var(--ink)}
.gsitem .tx .s{font-size:11px;color:var(--ink2)}
.gsempty{padding:14px 12px;color:var(--ink3);font-size:12.5px}
@media(max-width:720px){.gsearch input{width:130px}.gsres{width:300px}}
.top .right a{color:#e08128}
.wrap{max-width:1560px;margin:0 0 0 var(--side-w);padding:22px 28px 80px}
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.head .sp{flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:var(--shadow)}
.seg button{border:none;background:none;padding:7px 15px;cursor:pointer;color:var(--ink2);font-weight:500;font-size:13px}
.seg button.on{background:var(--brand);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--ink3);margin-top:2px}
/* matrix */
.scroll{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:9px 13px;white-space:nowrap;border-bottom:1px solid var(--line2);text-align:left}
thead th{position:sticky;top:0;background:#f7f9fb;z-index:2;font-weight:600;color:var(--ink2);font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.mx .lab{position:sticky;left:0;background:var(--surface);z-index:1;min-width:220px;font-weight:500}
.mx thead th.lab{z-index:3}
.mx tr.sec td{background:#f2f6f8;text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;color:var(--ink3);font-weight:700}
.mx tr.grp .lab{font-weight:700;cursor:pointer}
.mx tr.item .lab{padding-left:30px;color:var(--ink2);font-weight:500}
.mx tr.item td.n{color:var(--ink)}
.mx tr.beg td,.mx tr.end td{background:var(--brandsoft);font-weight:700}
.mx tr.end td{border-top:2px solid #cfe7e3}
.mx tr.pulse td{background:#eef5fd;color:#1f5f9e;font-weight:600}
.mx tr.tot td{font-weight:700;border-top:1px solid var(--line)}
.mx tr.item:hover td{background:#f8fbfc}
.click{cursor:pointer}
/* modal */
#mw{position:fixed;inset:0;z-index:80;background:rgba(15,30,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
#mw.hide{display:none}
.modal{background:#fff;border-radius:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);width:min(720px,100%);padding:22px 24px;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .full{grid-column:1/3}
.right{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.lines th,.lines td{padding:6px 8px}
.lines input,.lines select{padding:6px 8px}
.emptyc{text-align:center;color:var(--ink3);padding:48px 20px}
.emptyc .big{font-size:40px;opacity:.4}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#12303c;color:#fff;padding:11px 20px;border-radius:10px;box-shadow:0 12px 40px -8px rgba(0,0,0,.5);z-index:120;opacity:0;transition:.25s;pointer-events:none;font-size:13.5px}
#toast.show{opacity:1}
/* gate */
#gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#0c2230;overflow:hidden;transition:opacity .5s}
#gate.bye{opacity:0;pointer-events:none}
#gate .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 15s ease-in-out infinite alternate}
#gate .o1{width:520px;height:520px;background:#12564c;top:-150px;left:-120px}
#gate .o2{width:420px;height:420px;background:#123252;bottom:-130px;right:-80px;animation-delay:-7s}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(60px,40px)}}
.gatecard{position:relative;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:40px 40px 30px;width:min(400px,92vw);text-align:center;color:#fff;backdrop-filter:blur(12px)}
.gatecard .k{font-size:10px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:#6fd3bd}
.gatecard .w{font-size:26px;font-weight:700;margin:8px 0 3px}
.gatecard .s{font-size:13px;opacity:.7;margin-bottom:24px}
.gbtn{width:100%;padding:12px;border-radius:11px;border:none;background:#fff;color:#3c4043;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
.gerr{min-height:18px;font-size:12.5px;color:#ff9b8a;margin-top:12px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}.grid2 .full{grid-column:1}.top-in{gap:10px;padding:0 14px}
  .top-in .brand .logo{height:32px}
  .gsearch{max-width:none}
  .wrap{margin-left:0;padding:18px 16px 80px}
  .side{position:static;top:auto;width:auto;flex-direction:row;align-items:center;gap:8px;padding:8px 10px;overflow:visible;border-left:none}
  .sidecard{flex:1;min-height:0;flex-direction:row;align-items:center;gap:2px;overflow-x:auto;overflow-y:hidden;
    padding:6px 8px;border-radius:14px}
  .side-title,.navlbl{display:none}
  .navgrp{flex-direction:row;gap:2px;margin:0;padding:0 2px;border-left:1px solid rgba(255,255,255,.14)}
  .navgrp:first-of-type{border-left:none}
  .sidecard button{padding:8px 12px;font-size:12px;border-radius:9px}
  .top{top:0}}
[hidden]{display:none!important}
/* ---- proof/slip inline preview ---- */
.proofview{margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2,#faf8f3);min-height:60px;display:flex;align-items:center;justify-content:center}
.proofview img{display:block;max-width:100%;height:auto}
.proofview iframe{width:100%;height:460px;border:0;background:#fff}
/* ---- Contract payment history ---- */
.chgrid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.chside{position:sticky;top:calc(var(--top-h,64px) + 12px);max-height:calc(100vh - var(--top-h,64px) - 40px);display:flex;flex-direction:column}
.chlist{overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.chrow{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit;color:inherit;transition:border-color .15s,background .15s}
.chrow:hover{border-color:var(--brand,#1f5fa0)}
.chrow.on{background:var(--navy,#123453);border-color:transparent;color:#fff}
.chrow.on .mini,.chrow.on b{color:#fff}
.chrow-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.chrow-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.chbar{background:var(--line2,#eee);border-radius:6px;height:5px;overflow:hidden}
.chrow.on .chbar{background:rgba(255,255,255,.22)}
.chbar-fill{height:100%;background:var(--income,#2f7d5b);border-radius:6px}
.chtl{position:relative;display:flex;flex-direction:column;gap:2px}
.chtl-item{display:grid;grid-template-columns:16px 1fr;gap:10px;padding:8px 0;position:relative}
.chtl-item:not(:last-child)::before{content:"";position:absolute;left:7px;top:18px;bottom:-8px;width:2px;background:var(--line)}
.chtl-dot{width:12px;height:12px;border-radius:50%;margin-top:4px;z-index:1;box-shadow:0 0 0 3px var(--surface)}
.chtl-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.chtl-amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:820px){ .chgrid{grid-template-columns:1fr} .chside{position:static;max-height:none} .chlist{max-height:300px} }
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="brand"><img src="logo.png" alt="Elite Escapes" class="logo"></div>
  <div class="gsearch">
    <input id="gsq" type="search" placeholder="🔍  ค้นหาทุกอย่าง… ( / )" autocomplete="off" spellcheck="false" oninput="onSearch(this.value)" onkeydown="gsKey(event)" onfocus="onSearch(this.value)">

<script>
/* ============ config ============ */
const SB_URL='https://vpsrfukevrcaapwlkoop.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwc3JmdWtldnJjYWFwd2xrb29wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5ODA4ODgsImV4cCI6MjEwMjU1Njg4OH0.F9ClGxUU0WjG_d-H2Ic3f48Bvoc1IhBPFEP3W6F1h-w';
const SBC = window.supabase ? window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}}) : null;
let USER=null;
const REPEATS=[['never','One-time'],['weekly','Weekly'],['biweekly','Biweekly'],['monthly','Monthly'],['bimonthly','Bimonthly'],['quarterly','Quarterly'],['biannually','Biannually'],['annually','Annually']];
const REPSTEP={weekly:{d:7},biweekly:{d:14},monthly:{m:1},bimonthly:{m:2},quarterly:{m:3},biannually:{m:6},annually:{m:12}};
const REPLBL=Object.fromEntries(REPEATS);
const CURSYM={THB:'฿',USD:'US$',GBP:'£',EUR:'€',AUD:'A$'};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ============ state + data ============ */
let DB={companies:[],accounts:[],categories:[],entries:[],lines:[]};
const today=new Date(); const TODAY=iso(today);
const S={tab:'dashboard', view:'month', start:TODAY.slice(0,7), span:12, q:'', repType:'all',
  report:'ie', rStart:TODAY.slice(0,7), rSpan:12, excludePast:false, collapsed:{}, rcOpen:{},
  bankDate:TODAY, bankCompany:'all', bankBank:'all', bankType:'all', bankQ:'', bankShowFull:false, bankAuditPage:0, weekRef:TODAY,
  fRep:'all', fChan:'all', fNat:'all', syOpen:{}, bookFilter:'all'};

/* ============ helpers ============ */
function iso(d){ const p=x=>String(x).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function addDaysISO(s,n){ const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d+n); return iso(dt); }
function addMonthsISO(s,n){ const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1+n,1); const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate(); dt.setDate(Math.min(d,last)); return iso(dt); }
function lastDayOfMonth(key){ const [y,m]=key.split('-').map(Number); return key+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0'); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(p){ return (p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function curSym(){ const a=primaryAccount(); return CURSYM[(a&&a.currency)||'THB']||'฿'; }
function fmt(n){ n=Math.round((n||0)); return curSym()+n.toLocaleString('en-US'); }
function fB(n){ return '฿'+Math.round(n||0).toLocaleString('en-US'); }  /* OPC Wages/Taxi = THB always */
function fmtSigned(n){ return (n<0?'-':'')+curSym()+Math.abs(Math.round(n||0)).toLocaleString('en-US'); }
function fmtDate(s){ if(!s) return '—'; const [y,m,d]=s.split('-').map(Number); return MON[m-1]+' '+d+', '+y; }
function primaryAccount(){ return DB.accounts.find(a=>a.is_primary) || DB.accounts[0] || null; }
function g(id){ return document.getElementById(id); }
function toast(m){ const t=g('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function openModal(html){ const w=g('mw'); w.innerHTML='<div class="modal">'+html+'</div>'; w.classList.remove('hide'); }
function closeModal(){ g('mw').classList.add('hide'); g('mw').innerHTML=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* occurrences for a line within [from,to] */
function occ(line, from, to){
  const out=[], base=line.txn_date; if(!base) return out;
  const amt=Number(line.amount)||0;
  const fa=(line.forecast_amount!=null&&line.forecast_amount!=='')?Number(line.forecast_amount):amt;
  const mode=line.repeat||'never', step=REPSTEP[mode];
  const push=dt=>out.push({date:dt,amount:amt,famount:fa});
  if(mode==='never'||!step){ if(base>=from&&base<=to) push(base); return out; }
  const until=line.repeat_until||to;
  for(let i=0;i<800;i++){
    const dt= step.d? addDaysISO(base,step.d*i) : addMonthsISO(base,step.m*i);
    if(dt>to) break; if(dt>until) break;
    if(dt>=from) push(dt);
  }
  return out;
}

function isoWeek(d){ const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=(dt.getUTCDay()+6)%7; dt.setUTCDate(dt.getUTCDate()-day+3);
  const firstThu=new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const week=1+Math.round(((dt-firstThu)/86400000-3+((firstThu.getUTCDay()+6)%7))/7);
  return {year:dt.getUTCFullYear(),week}; }

  (DB.mktReps||[]).forEach(rp=>{ const r=by[rp.code]||{}; const rd=r.days||{};
    // build day-keyed buckets 0..6; migrate any legacy weekly (top-level q/qp/ct + deal{}) into วันอาทิตย์ (day 0)
    const days={}; for(let i=0;i<7;i++){ if(rd[i]&&typeof rd[i]==='object') days[String(i)]=Object.assign({},rd[i]); }
    const hasLegacy = (typeof rd.q!=='object' && ((+rd.q||0)||(+rd.qp||0)||(+rd.ct||0))) || (r.deal && ((+r.deal.pack||0)||(+r.deal.full||0)));
    if(hasLegacy){ const d0=days['0']=days['0']||{};
      d0.q=(+d0.q||0)+(+rd.q||0); d0.qp=(+d0.qp||0)+(+rd.qp||0); d0.ct=(+d0.ct||0)+(+rd.ct||0);

function mktWeek(m){ const d=(m&&m.days)||{}; let q=0,qp=0,ct=0,pack=0,full=0;
  for(const k in d){ const x=d[k]; if(x&&typeof x==='object'){ q+=+x.q||0;qp+=+x.qp||0;ct+=+x.ct||0;pack+=+x.pack||0;full+=+x.full||0; } }

  if(m&&m.deal){ pack+=+m.deal.pack||0; full+=+m.deal.full||0; }
  return {q,qp,ct,pack,full}; }

  const ded=(+de.tax||0)+(+de.ss||0)+(+de.dac||0)+(+de.chargeback||0)+(+de.hold||0);
  return {q,qp,ct,pack,full,tour,bonus,extra,gross,ded,net:gross-ded}; }

async function mktSave(){ const p=mktPeriod(); const reps=DB.mktReps||[];
  const rows=reps.map(rp=>{ const m=S.mktData[rp.code]; return { id:p.year+'_'+p.week+'_'+rp.code, year:p.year, week:p.week,
    period_start:p.startISO, period_end:p.endISO, rep_code:rp.code, rep_name:rp.name, team:rp.team, role:rp.role,
    days:m.days, deal:m.deal, extra:m.extra, ded:m.ded, updated_at:new Date().toISOString() }; });
  try{ await upsert('mkt_dgr',rows);
    // sync to accounting (Cashflow/P&L) — weekly payroll expense
    const staffNet=reps.reduce((s,rp)=>s+mktCalc(S.mktData[rp.code]).net,0);
    const total=staffNet+mktOverrideForWeek(reps.map(rp=>Object.assign({team:rp.team,role:rp.role},S.mktData[rp.code])));
    const fri=new Date(p.startISO+'T00:00:00'); fri.setDate(fri.getDate()+5);
    await syncWageLine(p.year,p.week,total,iso(fri)); await reloadEL();
    toast('บันทึก + ลงบัญชีแล้ว (สัปดาห์ '+p.week+', '+reps.length+' คน)');
  }catch(e){ toast('บันทึกไม่สำเร็จ: '+e.message); } }

/* ============ AR — receivables by customer + aging ============ */
function arDaysOverdue(d){ return Math.round((Date.parse(TODAY)-Date.parse(d))/86400000); }
function arData(){
  const rows=allLines().filter(x=>x.e.kind==='income' && x.e.active!==false && (x.l.repeat||'never')==='never' && !x.l.paid && ['deposit','admin','installment','mfee'].indexOf(x.l.line_type||'')>=0);
  const nameByCat={}; DB.entries.forEach(e=>{ if(e.category && e.description && !nameByCat[e.category]) nameByCat[e.category]=(e.description||'').replace(/\n/g,' & '); });
  const g={};
  rows.forEach(x=>{ const cat=x.e.category||x.e.id; const amt=Number(x.l.amount||0);
    const o=(g[cat]=g[cat]||{cat,name:nameByCat[cat]||'',out:0,over:0,cur:0,b1:0,b2:0,b3:0,b4:0,mfee:0,next:null,oldest:null});
    o.out+=amt; if(x.l.line_type==='mfee') o.mfee+=amt;
    if(!o.next||x.l.txn_date<o.next) o.next=x.l.txn_date;
    if(x.l.txn_date<=TODAY){ o.over+=amt; if(!o.oldest||x.l.txn_date<o.oldest)o.oldest=x.l.txn_date;
      const d=arDaysOverdue(x.l.txn_date); if(d<=30)o.b1+=amt; else if(d<=60)o.b2+=amt; else if(d<=90)o.b3+=amt; else o.b4+=amt;
    } else o.cur+=amt;
  });
  return Object.values(g).sort((a,b)=>b.over-a.over || b.out-a.out);
}
function rAR(){ const data=arData();
  const T={out:0,over:0,cur:0,b1:0,b2:0,b3:0,b4:0};
  data.forEach(o=>{ T.out+=o.out;T.over+=o.over;T.cur+=o.cur;T.b1+=o.b1;T.b2+=o.b2;T.b3+=o.b3;T.b4+=o.b4; });

    <div class="kpi"><div class="v" style="color:${T.b4>0?'var(--expense)':'var(--ink)'}">${fmt(T.b4)}</div><div class="l">ค้างเกิน 90 วัน</div></div></div>`;
  // aging summary bar
  const buckets=[['ยังไม่ถึงกำหนด',T.cur,'#2f7d5b'],['1–30 วัน',T.b1,'#a9812a'],['31–60',T.b2,'#c67b1e'],['61–90',T.b3,'#d8583c'],['90+',T.b4,'#b0201a']];
  const bmax=Math.max(...buckets.map(b=>b[1]),1);
  const barRows=buckets.map(b=>`<div style="display:flex;align-items:center;gap:10px;margin:6px 0">

    <div style="width:96px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700">${fmt(b[1])}</div></div>`).join('');
  const aging=`<div class="card pad" style="margin-bottom:16px"><h2 style="margin:0 0 8px;font-size:18px">สรุปช่วงอายุหนี้ (Aging)</h2>${barRows}</div>`;
  const th=(t,s)=>`<th style="${s||''};font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap">${t}</th>`;
  let trs='';

    trs+=`<tr>
      <td style="white-space:nowrap"><b>${esc(o.cat)}</b>${o.name?'<br><span class="mini" style="color:var(--ink2)">'+esc(o.name)+'</span>':''}</td>
      <td style="${R}"><b>${fmt(o.out)}</b></td>
      <td style="${R}">${o.cur?fmt(o.cur):'<span style="color:var(--ink3)">—</span>'}</td>
      <td style="${R}">${o.b1?fmt(o.b1):'—'}</td>
      <td style="${R}">${o.b2?fmt(o.b2):'—'}</td>
      <td style="${R}">${o.b3?fmt(o.b3):'—'}</td>
      <td style="${R}${o.b4?';color:var(--expense);font-weight:700':''}">${o.b4?fmt(o.b4):'—'}</td>
      <td style="${C}">${o.over>0?'<span class="pill exp">เกิน '+od+' วัน</span>':(o.next?'<span class="mini">'+fmtDate(o.next)+'</span>':'—')}</td>

/* ============ AP — payables by vendor/category + aging ============ */
function apData(){
  const rows=allLines().filter(x=>x.e.kind==='expense' && x.e.active!==false && (x.l.repeat||'never')==='never' && !x.l.paid);
  const g={};
  rows.forEach(x=>{ const key=x.e.id; const amt=Number(x.l.amount||0);
    const o=(g[key]=g[key]||{key,name:x.e.title||x.e.category||key,cat:x.e.category||'',out:0,over:0,cur:0,soon:0,b1:0,b2:0,b3:0,b4:0,next:null,oldest:null});
    o.out+=amt; if(!o.next||x.l.txn_date<o.next)o.next=x.l.txn_date;
    if(x.l.txn_date<=TODAY){ o.over+=amt; if(!o.oldest||x.l.txn_date<o.oldest)o.oldest=x.l.txn_date;
      const d=arDaysOverdue(x.l.txn_date); if(d<=30)o.b1+=amt; else if(d<=60)o.b2+=amt; else if(d<=90)o.b3+=amt; else o.b4+=amt;
    } else { o.cur+=amt; if(-arDaysOverdue(x.l.txn_date)<=7) o.soon+=amt; }
  });
  return Object.values(g).sort((a,b)=>b.over-a.over || b.out-a.out);
}
function rAP(){ const data=apData();
  const T={out:0,over:0,cur:0,soon:0,b1:0,b2:0,b3:0,b4:0};
  data.forEach(o=>{ T.out+=o.out;T.over+=o.over;T.cur+=o.cur;T.soon+=o.soon;T.b1+=o.b1;T.b2+=o.b2;T.b3+=o.b3;T.b4+=o.b4; });

  const buckets=[['ยังไม่ถึงกำหนด',T.cur,'#2f7d5b'],['1–30 วัน',T.b1,'#a9812a'],['31–60',T.b2,'#c67b1e'],['61–90',T.b3,'#d8583c'],['90+',T.b4,'#b0201a']];
  const bmax=Math.max(...buckets.map(b=>b[1]),1);
  const barRows=buckets.map(b=>`<div style="display:flex;align-items:center;gap:10px;margin:6px 0">
    <div style="width:110px;font-size:12.5px;color:var(--ink2)">${b[0]}</div>

  const aging=`<div class="card pad" style="margin-bottom:16px"><h2 style="margin:0 0 8px;font-size:18px">สรุปช่วงอายุหนี้ค้างจ่าย (Aging)</h2>${barRows}</div>`;
  const th=(t,s)=>`<th style="${s||''};font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap">${t}</th>`;
  let trs='';

    trs+=`<tr>
      <td style="white-space:nowrap"><b>${esc(o.name)}</b>${o.cat?'<br><span class="mini" style="color:var(--ink3)">'+esc(o.cat)+'</span>':''}</td>

      <td style="${R}">${o.b1?fmt(o.b1):'—'}</td>
      <td style="${R}">${o.b2?fmt(o.b2):'—'}</td>
      <td style="${R}">${o.b3?fmt(o.b3):'—'}</td>
      <td style="${R}${o.b4?';color:var(--expense);font-weight:700':''}">${o.b4?fmt(o.b4):'—'}</td>
      <td style="${C}">${o.over>0?'<span class="pill exp">เกิน '+od+' วัน</span>':(o.next?'<span class="mini">'+fmtDate(o.next)+'</span>':'—')}</td>
      <td style="${R}"><button class="btn sm ${o.cat?'':'ghost'}" onclick="arGo('${esc(o.cat)}')">จ่าย</button></td>
    </tr>`; });
  if(!data.length) trs='<tr><td colspan="9"><div class="emptyc" style="padding:24px">🎉 ไม่มียอดค้างจ่าย</div></td></tr>';
  const totR=`<tr style="border-top:2px solid var(--line);font-weight:700">
    <td>รวม</td><td style="${R};color:var(--expense)">${fmt(T.out)}</td><td style="${R}">${fmt(T.cur)}</td><td style="${R}">${fmt(T.b1)}</td><td style="${R}">${fmt(T.b2)}</td><td style="${R}">${fmt(T.b3)}</td><td style="${R}">${fmt(T.b4)}</td><td></td><td></td></tr>`;
  const table=`<div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr>${th('เจ้าหนี้ / รายการ')}${th('ค้างจ่าย',R)}${th('ยังไม่ถึง',R)}${th('1–30',R)}${th('31–60',R)}${th('61–90',R)}${th('90+',R)}${th('สถานะ',C)}${th('',R)}</tr></thead><tbody>${trs}${data.length?totR:''}</tbody></table></div>`;
  g('main').innerHTML=head+kpis+aging+table;

/* ---- OPC Wages history / trends ---- */
async function mktLoadHistory(){ await loadMktBase(); let rows=[]; try{ rows=await api('mkt_dgr?select=*&year=eq.2026&order=week.asc')||[]; }catch(e){} S.mktHist=rows; }
function rMktHistory(){
  g('main').innerHTML=`<div class="head"><div><h1>OPC Wages · สรุปย้อนหลัง</h1><p class="mini">ค่าจ้างสุทธิรายสัปดาห์ต่อคน · ปี 2026</p></div></div>${mktSeg()}
   <div id="mktbody"><div class="emptyc"><div class="big">⏳</div>กำลังโหลด…</div></div>`;
  mktLoadHistory().then(mktPaintHistory).catch(e=>{ const b=g('mktbody'); if(b) b.innerHTML='<div class="emptyc">โหลดไม่สำเร็จ: '+esc(e.message)+'</div>'; }); }
function mktOverrideForWeek(rows){ const teams={}; rows.forEach(r=>{ const c=mktCalc(r); const t=r.team||'-'; const tm=(teams[t]=teams[t]||{amt:0,mgr:false});
    if(r.role!=='manager') tm.amt+=c.q*MKT_MGR.q+c.qp*MKT_MGR.qp+c.ct*MKT_MGR.ct+c.pack*MKT_MGR.pack+c.full*MKT_MGR.full;  // ลูกทีม: ทัวร์+ดีล
    else { tm.mgr=true; tm.amt+=c.pack*MKT_MGR.pack+c.full*MKT_MGR.full; }  // ผจก.: ดีลของตัวเองเท่านั้น (ทัวร์ไม่ได้)
  });
  let ov=0; Object.values(teams).forEach(tm=>{ if(tm.mgr) ov+=tm.amt; }); return ov; }
function mktSpark(vals,w,h){ if(!vals.length) return ''; const mx=Math.max(...vals,1); const dx=vals.length>1?w/(vals.length-1):0;
  const pts=vals.map((v,i)=>[i*dx, h-(v/mx)*(h-4)-2]); const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="vertical-align:middle"><path d="${d}" fill="none" stroke="#1c3350" stroke-width="1.8"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" fill="#a9812a"/></svg>`; }
function mktPaintHistory(){ const body=g('mktbody'); if(!body) return; const rows=S.mktHist||[]; const reps=DB.mktReps||[];
  if(!rows.length){ body.innerHTML='<div class="emptyc"><div class="big">📊</div>ยังไม่มีข้อมูลย้อนหลัง</div>'; return; }
  const weeks=[...new Set(rows.map(r=>r.week))].sort((a,b)=>a-b);
  const byRep={}, wStaff={}, wMgr={};
  rows.forEach(r=>{ const net=mktCalc(r).net; (byRep[r.rep_code]=byRep[r.rep_code]||{})[r.week]=net; wStaff[r.week]=(wStaff[r.week]||0)+net; });
  weeks.forEach(w=>{ wMgr[w]=mktOverrideForWeek(rows.filter(r=>r.week===w)); });
  const wTot={}; weeks.forEach(w=>wTot[w]=(wStaff[w]||0)+(wMgr[w]||0));
  const grand=weeks.reduce((s,w)=>s+wTot[w],0);
  // rep rows sorted by total net desc
  const repRows=reps.map(rp=>{ const m=byRep[rp.code]||{}; const vals=weeks.map(w=>m[w]||0); const tot=vals.reduce((s,v)=>s+v,0); return {rp,vals,tot,active:tot>0||weeks.some(w=>m[w]!=null)}; })
    .filter(x=>x.active).sort((a,b)=>b.tot-a.tot);
  const topRep=repRows[0];
  // weekly bar chart (total payroll)
  const R='text-align:right', C='text-align:center';
  const bw=Math.max(360, weeks.length*84), bh=210, pad=34, mx=Math.max(...weeks.map(w=>wTot[w]),1), gapw=(bw-pad)/weeks.length;
  let bars='';
  weeks.forEach((w,i)=>{ const x=pad+i*gapw+gapw*0.18, bwid=gapw*0.64; const sh=(wStaff[w]/mx)*(bh-40), mh=(wMgr[w]/mx)*(bh-40); const y0=bh-20;
    bars+=`<rect x="${x.toFixed(1)}" y="${(y0-sh).toFixed(1)}" width="${bwid.toFixed(1)}" height="${sh.toFixed(1)}" rx="3" fill="#1c3350"/>`;
    if(mh>0.5) bars+=`<rect x="${x.toFixed(1)}" y="${(y0-sh-mh).toFixed(1)}" width="${bwid.toFixed(1)}" height="${mh.toFixed(1)}" rx="3" fill="#a9812a"/>`;
    bars+=`<text x="${(x+bwid/2).toFixed(1)}" y="${(y0-sh-mh-6).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink2)">${Math.round(wTot[w]/1000)}k</text>`;
    bars+=`<text x="${(x+bwid/2).toFixed(1)}" y="${(bh-6).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="var(--ink3)">W${w}</text>`; });
  const chart=`<div class="card pad" style="margin-bottom:16px"><h2 style="margin:0 0 4px;font-size:18px">ค่าจ้างรวมรายสัปดาห์</h2>
    <p class="mini" style="margin:0 0 10px"><span style="color:#1c3350">■</span> พนักงานสุทธิ &nbsp; <span style="color:#a9812a">■</span> Manager override</p>
    <div style="overflow-x:auto"><svg width="${bw}" height="${bh}" viewBox="0 0 ${bw} ${bh}" style="max-width:100%">${bars}</svg></div></div>`;
  // KPIs
  const kpis=`<div class="kpis" style="margin-bottom:16px">
    <div class="kpi"><div class="v">${fmt(grand)}</div><div class="l">จ่ายรวมทั้งหมด (${weeks.length} สัปดาห์)</div></div>
    <div class="kpi"><div class="v">${fmt(Math.round(grand/weeks.length))}</div><div class="l">เฉลี่ยต่อสัปดาห์</div></div>
    <div class="kpi"><div class="v">${topRep?esc(topRep.rp.name):'—'}</div><div class="l">จ่ายสูงสุด · ${topRep?fmt(topRep.tot):''}</div></div>
    <div class="kpi"><div class="v">${repRows.length}</div><div class="l">พนักงานที่มีค่าจ้าง</div></div></div>`;
  // table
  const th=(t,s)=>`<th style="${s||''};font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap">${t}</th>`;
  let trs='';
  repRows.forEach(x=>{ const cells=weeks.map(w=>{ const v=x.vals[weeks.indexOf(w)]; return `<td style="${R}">${v?fmt(v):'<span style="color:var(--ink3)">—</span>'}</td>`; }).join('');
    trs+=`<tr><td style="white-space:nowrap"><b>${esc(x.rp.code)}</b> ${esc(x.rp.name)}${x.rp.role==='manager'?' <span class="pill fc">Mgr</span>':''}</td><td style="${C}">${mktSpark(x.vals,84,26)}</td>${cells}<td style="${R}"><b>${fmt(x.tot)}</b></td></tr>`; });
  const totCells=weeks.map(w=>`<td style="${R}">${fmt(wStaff[w]||0)}</td>`).join('');
  const totRow=`<tr style="border-top:2px solid var(--line);font-weight:700"><td>รวมพนักงานสุทธิ</td><td></td>${totCells}<td style="${R}">${fmt(weeks.reduce((s,w)=>s+(wStaff[w]||0),0))}</td></tr>`;
  const head=`<tr>${th('พนักงาน')}${th('แนวโน้ม',C)}${weeks.map(w=>th('W'+w,R)).join('')}${th('รวม',R)}</tr>`;
  const table=`<div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead>${head}</thead><tbody>${trs}${totRow}</tbody></table></div>`;
  body.innerHTML=kpis+chart+table; }

async function guestSync(){ const gs=DB.guests||[]; if(!gs.length){ toast('ไม่มีแขกให้สรุป'); return; }
  const dt=new Date(S.guestDate+'T00:00:00'); const dayIdx=dt.getDay();
  const thu=new Date(dt); thu.setDate(dt.getDate()+(4-dayIdx)); const iw=isoWeek(thu);
  const sun=new Date(dt); sun.setDate(dt.getDate()-dayIdx); const pe=new Date(sun); pe.setDate(sun.getDate()+6);
  const byRep={}; gs.forEach(x=>{ if(!x.source) return; const ql=(x.qual||'').toUpperCase(); const r=(byRep[x.source]=byRep[x.source]||{q:0,qp:0,ct:0,pack:0,full:0}); if(ql==='Q')r.q++; else if(ql==='Q+')r.qp++; else if(ql==='CT')r.ct++; if(x.deal){ if(x.deal_term==='5')r.pack++; else if(x.deal_term==='10'||x.deal_term==='20')r.full++; } });
  try{
    let rows=await api('mkt_dgr?select=*&year=eq.'+iw.year+'&week=eq.'+iw.week)||[]; const byCode={}; rows.forEach(r=>byCode[r.rep_code]=r);
    const ups=[]; Object.keys(byRep).forEach(code=>{ const rp=(DB.mktReps||[]).find(z=>z.code===code)||{}; const ex=byCode[code]||{}; const days=Object.assign({},ex.days||{});
      days[String(dayIdx)]={q:byRep[code].q,qp:byRep[code].qp,ct:byRep[code].ct,pack:byRep[code].pack,full:byRep[code].full};
      ups.push({ id:iw.year+'_'+iw.week+'_'+code, year:iw.year, week:iw.week, period_start:iso(sun), period_end:iso(pe), rep_code:code, rep_name:rp.name||code, team:rp.team||null, role:rp.role||'staff', days, deal:ex.deal||{}, extra:ex.extra||{}, ded:ex.ded||{}, updated_by:'guest-sync', updated_at:new Date().toISOString() }); });
    if(ups.length) await upsert('mkt_dgr',ups);
    const tx=gs.filter(x=>Number(x.taxi||0)>0).map(x=>({ id:'gtx_'+x.id, tour_date:x.tour_date, guest_name:x.guest_name, opc_code:x.source, amount:Number(x.taxi||0), note:'จากทะเบียนแขก', status:'approved', deal:!!x.deal, contract:(x.deal&&x.contract_no)?x.contract_no:null, doc_path:x.taxi_doc_path||null, doc_name:x.taxi_doc_name||null, recorded_by:(USER&&USER.email)||null, updated_at:new Date().toISOString() }));
    if(tx.length){ await upsert('mkt_taxi',tx); for(const t of tx){ await taxiPost(t); } }
    const vc=gs.filter(x=>Number(x.voucher_amt||0)>0).map(x=>({ id:x.id, tour_date:x.tour_date, guest_name:x.guest_name, amount:Number(x.voucher_amt||0), note:x.voucher_note||'', deal:!!x.deal, contract:(x.deal&&x.contract_no)?x.contract_no:null, doc_path:x.voucher_doc_path||null, doc_name:x.voucher_doc_name||null }));
    for(const v of vc){ await voucherPost(v); }
    if(tx.length||vc.length) await reloadEL();
    toast('สรุปเข้า OPC Wages ('+ups.length+' คน) · Taxi ('+tx.length+') · เวาเชอร์ ('+vc.length+') → ค้างจ่ายที่ Contracts & Payments');
  }catch(e){ toast('สรุปไม่สำเร็จ: '+e.message); } }

/* ============ matrix engine ============ */
function periods(kind, start, n){
  const arr=[];
  if(kind==='week'){
    let d=start; // start is a monday iso
    for(let i=0;i<n;i++){ const s=d, e=addDaysISO(d,6); arr.push({key:s,label:fmtShort(s),s,e}); d=addDaysISO(d,7); }
  } else {
    for(let i=0;i<n;i++){ const iso2=addMonthsISO(start+'-01',i), key=iso2.slice(0,7); const [y,m]=key.split('-').map(Number); arr.push({key,label:MON[m-1]+' '+y,s:key+'-01',e:lastDayOfMonth(key)}); }
  }
  return arr;
}
function fmtShort(s){ const [y,m,d]=s.split('-').map(Number); return MON[m-1]+' '+d; }
function mondayOf(s){ const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); const wd=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-wd); return iso(dt); }
function bucketKey(kind, date, ps){
  if(kind==='week'){ for(const p of ps){ if(date>=p.s&&date<=p.e) return p.key; } return null; }
  return date.slice(0,7);
}
/* build matrix over given periods; includeForecast for pulse line */
function buildMatrix(ps, opts){
  opts=opts||{};
  const winS=ps[0].s, winE=ps[ps.length-1].e;
  const openBal=DB.accounts.reduce((s,a)=>s+(Number(a.opening_balance)||0),0);
  const lines=allLines().filter(x=>x.e.active!==false);
  // beginning before window
  let begin=openBal, beginF=openBal;
  lines.forEach(({l,e})=>{ const sign=e.kind==='expense'?-1:1; occ(l,'0000-01-01',addDaysISO(winS,-1)).forEach(o=>{ begin+=sign*o.amount; beginF+=sign*o.famount; }); });
  const inc={}, exp={}, incTot={}, expTot={}, incF={}, expF={};
  lines.forEach(({l,e})=>{
    const g0=e.category||(e.kind==='expense'?'Uncategorized expense':'Uncategorized income');
    occ(l,winS,winE).forEach(o=>{
      const pk=bucketKey(S.view,o.date,ps); if(!pk) return;
      const tot=e.kind==='expense'?expTot:incTot, totF=e.kind==='expense'?expF:incF, tgt=e.kind==='expense'?exp:inc;
      tot[pk]=(tot[pk]||0)+o.amount; totF[pk]=(totF[pk]||0)+o.famount;
      const grp=(tgt[g0]=tgt[g0]||{entries:{},tot:{}});
      const em=(grp.entries[e.id]=grp.entries[e.id]||{title:e.title||'(untitled)',kind:e.kind,m:{}});
      em.m[pk]=(em.m[pk]||0)+o.amount;
      grp.tot[pk]=(grp.tot[pk]||0)+o.amount;
    });
  });
  const beginByP={}, endByP={}, pulseByP={};
  let run=begin, runF=beginF;
  ps.forEach(p=>{ beginByP[p.key]=run; run=run+(incTot[p.key]||0)-(expTot[p.key]||0); endByP[p.key]=run;
    runF=runF+(incF[p.key]||0)-(expF[p.key]||0); pulseByP[p.key]=runF; });
  const hasFc=DB.lines.some(l=>l.forecast_amount!=null&&l.forecast_amount!==''&&Number(l.forecast_amount)!==Number(l.amount));
  return {ps,inc,exp,incTot,expTot,beginByP,endByP,pulseByP,begin,hasFc};
}

    const rows=dd.items.length? dd.items.map((it,ri)=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:9px 14px;${ri%2?'background:var(--surface2);':''}${it.active?'':'opacity:.5;'}">

function listRows(){
  const q=(S.q||'').trim().toLowerCase();
  let rows=allLines().map(({l,e})=>({l,e}));
  if(S.repType!=='all') rows=rows.filter(x=>x.e.kind===S.repType);
  if(S.fRep!=='all') rows=rows.filter(x=>em(x.e).rep===S.fRep);
  if(S.fChan!=='all') rows=rows.filter(x=>em(x.e).channel===S.fChan);
  if(S.fNat!=='all') rows=rows.filter(x=>em(x.e).nationality===S.fNat);
  if(q) rows=rows.filter(x=>((x.e.title||'')+' '+(x.e.category||'')+' '+(x.e.company||'')+' '+(x.e.description||'')+' '+metaText(x.e)).toLowerCase().includes(q));
  rows.sort((a,b)=>a.l.txn_date<b.l.txn_date?1:(a.l.txn_date>b.l.txn_date?-1:0));
  if(!rows.length) return '<tr><td colspan="9" style="opacity:.5;padding:20px">No entries match.</td></tr>';
  return rows.map(({l,e})=>{ const ml=metaLine(e); return `<tr class="click" onclick="openEntry('${e.kind}','${esc(e.id)}')">
    <td>${fmtDate(l.txn_date)}</td>

    <td><b>${esc(e.title||'(untitled)')}</b>${e.description?'<br><span class="mini">'+esc(e.description)+'</span>':''}${ml?'<br><span class="mini" style="opacity:.85">'+esc(ml)+'</span>':''}</td>
    <td>${esc(e.category||'—')}</td><td>${esc(e.company||'—')}</td><td>${esc(accName(e.account))}</td>
    <td class="n">${e.kind==='expense'?'-':''}${fmt(l.amount)}</td>
    <td class="mini">${REPLBL[l.repeat||'never']}${(l.forecast_amount!=null&&l.forecast_amount!==''&&Number(l.forecast_amount)!==Number(l.amount))?' · <span class="pill fc">fc '+fmt(l.forecast_amount)+'</span>':''}${e.active===false?' · <span class="pill off">inactive</span>':''}</td>
    <td><button class="btn link" onclick="event.stopPropagation();openEntry('${e.kind}','${esc(e.id)}')">Edit</button></td></tr>`; }).join('');

function accName(idOrName){ const a=DB.accounts.find(a=>a.id===idOrName||a.name===idOrName); return a?a.name:(idOrName||(primaryAccount()&&primaryAccount().name)||'—'); }
/* ---- sales-report metadata (structured, jsonb meta on the entry) ---- */
function em(e){ return (e&&e.meta&&typeof e.meta==='object')?e.meta:{}; }
function metaLine(e){ const m=em(e); const p=[];
  if(m.nationality||m.city) p.push('🌏 '+[m.nationality,m.city].filter(Boolean).join(' · '));
  if(m.unit) p.push('🏠 '+m.unit+(m.contract_type?(' · '+m.contract_type):'')+(m.season?(' '+m.season):''));
  if(m.channel) p.push('📣 '+m.channel);
  const s=m.sales||{}; const team=[];
  if(s.consultant||m.rep) team.push('Rep '+(s.consultant||m.rep));
  if(s.to && s.to!==(s.consultant||m.rep)) team.push('Closer '+s.to);
  if(s.man) team.push('Mgr '+s.man);
  if(!s.man && m.fu) team.push('FU '+m.fu);
  if(team.length) p.push(team.join(' · '));
  return p.join(' · '); }
function metaText(e){ const m=em(e); return [m.nationality,m.unit,m.contract_type,m.season,m.channel,m.generator,m.rep,m.manager,m.fu].filter(Boolean).join(' '); }
function metaOpts(field){ return [...new Set(DB.entries.map(e=>em(e)[field]).filter(Boolean))].sort(); }

function _dmy(s){ const p=(s||TODAY).split('-').map(Number); return {y:p[0],m:p[1],d:p[2]}; }
function setLDate(i){ const y=g('ld_y'+i).value,m=g('ld_m'+i).value,d=g('ld_d'+i).value; window._elines[i].txn_date=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }

function openEntry(kind, id){

    <div style="grid-row:span 3"><label>Description</label><textarea id="e_desc" rows="4" style="width:100%;font:inherit;padding:8px 11px;border:1px solid var(--line);border-radius:8px;resize:vertical" placeholder="Customer name / notes">${esc(e?e.description:'')}</textarea>
      <label style="margin-top:12px"><input type="checkbox" id="e_active" ${!e||e.active!==false?'checked':''} style="width:auto;margin-right:6px">Active entry</label>
      <div class="mini">Inactive entries do not figure into your cash flow</div></div>
    <div><label>Category</label><input id="e_cat" list="catlist" value="${esc(e?e.category:'')}" placeholder="Contract no. / type"><datalist id="catlist">${catOpts}</datalist></div>
    <div><label>Account</label><select id="e_acc">${accSel}</select></div>
    <div><label>Company</label><input id="e_co" list="colist" value="${esc(e?e.company:'')}" placeholder="Company"><datalist id="colist">${coOpts}</datalist></div>
  </div>
  <details style="margin-top:12px" ${em(e).rep||em(e).nationality?'open':''}><summary style="cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2)">Sales report details (optional)</summary>

    <div><label>Nationality</label><input id="m_nat" list="natlist" value="${esc(em(e).nationality||'')}"><datalist id="natlist">${metaOpts('nationality').map(v=>`<option value="${esc(v)}">`).join('')}</datalist></div>
    <div><label>Unit / room</label><input id="m_unit" value="${esc(em(e).unit||'')}" placeholder="e.g. T1 Standard"></div>
    <div><label>Contract type</label><input id="m_ctype" value="${esc(em(e).contract_type||'')}" placeholder="Annual / UDP"></div>
    <div><label>Season</label><input id="m_season" value="${esc(em(e).season||'')}" placeholder="High / Low"></div>
    <div><label>Sales channel</label><input id="m_chan" list="chanlist" value="${esc(em(e).channel||'')}" placeholder="OPC / …"><datalist id="chanlist">${metaOpts('channel').map(v=>`<option value="${esc(v)}">`).join('')}</datalist></div>

    <div><label>Sales rep</label><input id="m_rep" list="replist" value="${esc(em(e).rep||'')}"><datalist id="replist">${metaOpts('rep').map(v=>`<option value="${esc(v)}">`).join('')}</datalist></div>

      <td><input type="number" step="any" value="${l.forecast_amount!=null?l.forecast_amount:''}" oninput="window._elines[${i}].forecast_amount=this.value" placeholder="—" style="width:100px" title="Projected amount (Pulse line)"></td>

function addLine(){ window._elines.push({id:uid('ln'),amount:'',txn_date:TODAY,repeat:'never'}); renderLines(); }
async function saveEntry(){
  const title=g('e_title').value.trim(); if(!title){ toast('Project / title is required'); return; }
  const kind=g('e_kind').value, id=g('e_id').value||uid('en');
  const lines=window._elines.map(l=>({id:l.id||uid('ln'),entry_id:id,amount:parseFloat(l.amount)||0,txn_date:l.txn_date||TODAY,repeat:l.repeat||'never',repeat_until:((l.repeat&&l.repeat!=='never')&&l.repeat_until)||null,forecast_amount:(l.forecast_amount!=null&&l.forecast_amount!=='')?(parseFloat(l.forecast_amount)||null):null,memo:(l.memo||'').trim()||null,line_type:l.line_type||null})).filter(l=>l.amount>0);
  if(!lines.length){ toast('Add at least one amount'); return; }
  const cat=g('e_cat').value.trim()||null, co=g('e_co').value.trim()||null;
  const meta={}; const mv=(k,id2)=>{ const el=g(id2); if(el&&el.value.trim()) meta[k]=el.value.trim(); };
  mv('nationality','m_nat'); mv('unit','m_unit'); mv('contract_type','m_ctype'); mv('season','m_season'); mv('channel','m_chan'); mv('generator','m_gen'); mv('rep','m_rep'); mv('manager','m_man'); mv('fu','m_fu');
  const entry={id,kind,title,category:cat,account:g('e_acc').value,company:co,description:g('e_desc').value.trim()||null,active:g('e_active').checked,meta:Object.keys(meta).length?meta:null};
  try{
    await ensureCategory(cat); await ensureCompany(co);
    await upsert('cf_entries',[entry]);
    const keep=lines.map(l=>l.id);
    await api('cf_lines?entry_id=eq.'+id+(keep.length?('&id=not.in.('+keep.join(',')+')'):''),{method:'DELETE',prefer:'return=minimal'});
    await upsert('cf_lines',lines);
    closeModal(); toast('Saved'); await loadAll();
  }catch(e){ toast('Save failed: '+e.message); }
}
async function deleteEntry(id){ if(!confirm('Delete this entry and its schedule?')) return;
  try{ await api('cf_lines?entry_id=eq.'+id,{method:'DELETE',prefer:'return=minimal'}); await del('cf_entries',id); closeModal(); toast('Deleted'); await loadAll(); }
  catch(e){ toast('Delete failed: '+e.message); } }
async function ensureCategory(name){ if(!name) return; if(DB.categories.some(c=>c.name===name)) return; const c={id:uid('ct'),name}; await upsert('cf_categories',[c]); DB.categories.push(c); }
async function ensureCompany(name){ if(!name) return; if(DB.companies.some(c=>c.name===name)) return; const c={id:uid('co'),name}; await upsert('cf_companies',[c]); DB.companies.push(c); }

function rReports(){
  const ps=periods('month', S.rStart, S.rSpan);
  const M=buildMatrix(ps);
  const head=`<div class="head"><div><h1>Reports</h1><p class="mini">Income &amp; Expenses over time · the blue Pulse line looks down the road so you avoid running out of cash</p></div></div>`;
  const sel=`<div class="toolbar">
    <div class="seg">${[['ie','Income & Expenses'],['cat','By Category'],['co','By Company'],['rep','By Sales Rep'],['chan','By Channel'],['nat','By Nationality']].map(r=>`<button class="${S.report===r[0]?'on':''}" onclick="S.report='${r[0]}';render()">${r[1]}</button>`).join('')}</div>
    <div class="sp" style="flex:1"></div>
    <button class="btn sm ghost" onclick="S.rStart='${addMonthsISO(S.rStart+'-01',-12).slice(0,7)}';render()">‹ 12 mo</button>
    <b style="align-self:center">${ps[0].label} – ${ps[ps.length-1].label}</b>
    <button class="btn sm ghost" onclick="S.rStart='${addMonthsISO(S.rStart+'-01',12).slice(0,7)}';render()">12 mo ›</button>
  </div>`;
  let body;
  if(S.report==='cat') body=reportBy(e=>e.category||'(uncategorized)','Category',ps);
  else if(S.report==='co') body=reportBy(e=>e.company||'(no company)','Company',ps);
  else if(S.report==='rep') body=reportBy(e=>em(e).rep||'(no rep)','Sales Rep',ps);
  else if(S.report==='chan') body=reportBy(e=>em(e).channel||'(no channel)','Channel',ps);
  else if(S.report==='nat') body=reportBy(e=>em(e).nationality||'(no nationality)','Nationality',ps);
  else body=reportIE(M,ps);
  g('main').innerHTML=head+sel+body;
}
function reportIE(M,ps){
  const th=`<th class="lab">Month</th><th class="n">Beginning Cash</th><th class="n">Income</th><th class="n">Expenses</th><th class="n">Ending Cash</th>${M.hasFc?'<th class="n">Pulse (fc)</th>':''}`;
  let sumI=0,sumE=0;
  const rows=ps.map(p=>{ const i=M.incTot[p.key]||0,e=M.expTot[p.key]||0; sumI+=i;sumE+=e;
    return `<tr><td class="lab">${p.label}</td><td class="n">${fmt(M.beginByP[p.key])}</td><td class="n" style="color:var(--income)">${i?fmt(i):'–'}</td><td class="n" style="color:var(--expense)">${e?fmt(e):'–'}</td><td class="n"><b>${fmt(M.endByP[p.key])}</b></td>${M.hasFc?`<td class="n pulse" style="color:var(--pulse)">${fmt(M.pulseByP[p.key])}</td>`:''}</tr>`;
  }).join('');
  const n=ps.length;
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="v">${fmt(M.beginByP[ps[0].key])}</div><div class="l">Beginning Cash on Hand</div></div>
    <div class="kpi"><div class="v" style="color:var(--income)">${fmt(sumI)}</div><div class="l">Total Income · ${n} mo</div></div>
    <div class="kpi"><div class="v" style="color:var(--expense)">${fmt(sumE)}</div><div class="l">Total Expenses · ${n} mo</div></div>
    <div class="kpi"><div class="v">${fmt(M.endByP[ps[ps.length-1].key])}</div><div class="l">Ending Cash on Hand</div></div>
    <div class="kpi"><div class="v">${fmt(sumI/n)} / ${fmt(sumE/n)}</div><div class="l">Monthly avg in / out</div></div>
  </div>`;
  return kpis+`<div class="scroll"><table class="mx"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function reportBy(keyFn,label,ps){
  const winS=ps[0].s, winE=ps[ps.length-1].e;
  const map={}; // key -> {inc:{},exp:{}}
  allLines().filter(x=>x.e.active!==false).forEach(({l,e})=>{
    const k=keyFn(e);
    occ(l,winS,winE).forEach(o=>{ const pk=o.date.slice(0,7); const m=(map[k]=map[k]||{inc:{},exp:{},ti:0,te:0});
      if(e.kind==='expense'){ m.exp[pk]=(m.exp[pk]||0)+o.amount; m.te+=o.amount; } else { m.inc[pk]=(m.inc[pk]||0)+o.amount; m.ti+=o.amount; } });
  });
  const keys=Object.keys(map).sort((a,b)=>(map[b].ti+map[b].te)-(map[a].ti+map[a].te));
  const th=`<th class="lab">${esc(label)}</th><th class="n">Income</th><th class="n">Expenses</th><th class="n">Net</th>${ps.map(p=>`<th class="n">${p.label}</th>`).join('')}`;
  if(!keys.length) return '<div class="card"><div class="emptyc">No data in this range.</div></div>';
  const rows=keys.map(k=>{ const m=map[k]; const net=m.ti-m.te;
    return `<tr><td class="lab"><b>${esc(k)}</b></td><td class="n" style="color:var(--income)">${m.ti?fmt(m.ti):'–'}</td><td class="n" style="color:var(--expense)">${m.te?fmt(m.te):'–'}</td><td class="n"><b>${fmtSigned(net)}</b></td>${ps.map(p=>{ const v=(m.inc[p.key]||0)-(m.exp[p.key]||0); return `<td class="n">${v?fmtSigned(v):'<span style=\"opacity:.28\">–</span>'}</td>`; }).join('')}</tr>`;
  }).join('');
  return `<div class="scroll"><table class="mx"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

const RC_SECTIONS=[['Sale payments',['deposit','admin','installment']],['Management Fee (MFEE)',['mfee']],['Interval — we pay',['ii_fee','ii_renewal','ii_exchange']],['Other',null]];
const RC_KNOWN=['deposit','admin','installment','mfee','ii_fee','ii_renewal','ii_exchange'];
/* ============ Income Slips — reception records money-in slips → cf_lines (paid) → auto-cut AR ============
   Mirrors the physical "BBL EDC Credit Card Payment Request Form": one attached slip/form + N rows
   (contract / type / USD × rate / THB / card). Each row is matched to an outstanding income line
   (reducing AR) or, if none matches, recorded as a new paid income line. Everything lands in Receipts (locked+audit). */
const SLIP_TYPES={Deposit:'deposit',Balance:'installment',MFEE:'mfee','Admin fee':'admin','Booking fee':'booking'};
const SLIP_CC=['Visa','Mastercard','Amex','JCB','UnionPay','Bank transfer','Cash','Other'];
const SLIP_BANKS=['BBL — ธ.กรุงเทพ','SCB — ธ.ไทยพาณิชย์','Cash — เงินสด','Other'];
function normCno(s){ return String(s||'').trim().toUpperCase().replace(/\s+/g,'').split('/').slice(0,2).join('/'); }
function findIncomeEntryByCno(cno){ const n=normCno(cno); if(!n) return null;
  return (DB.entries||[]).find(e=>e.kind==='income'&&e.category&&normCno(e.category)===n)||null; }
function ccToMethod(t){ t=(t||'').toLowerCase();
  if(['visa','master','mc','amex','jcb','union'].some(x=>t.includes(x))) return 'card';
  if(t.includes('transfer')||t.includes('โอน')) return 'transfer';
  if(t.includes('cash')||t.includes('สด')) return 'cash'; return 'other'; }
function incomeCanEdit(){ return !!(USER&&USER.is_admin) || hasCat('finance') || hasCat('sales'); }
async function loadIncomeSlips(){ let rows=[]; try{ rows=await api('cf_income_slips?select=*&order=slip_date.desc&limit=300')||[]; }catch(e){} DB.incomeSlips=rows; }

      <td style="${C}">${m.matched?'<span class="pill inc">ตัด AR '+m.matched+'</span> ':''}${m.created?'<span class="pill off">ใหม่ '+m.created+'</span>':''}</td>

function slipAuto(i){ const r=window._slip.rows[i]; if(!r) return; const usd=parseFloat(r.usd)||0, rate=parseFloat(r.rate)||0;

async function saveSlip(){
  const btn=g('slip_save'); const rows=(window._slip.rows||[]).filter(r=>(r.cno||'').trim() && (parseFloat(r.usd)||parseFloat(r.thb)));
  if(!rows.length){ toast('กรอกสัญญา + จำนวนเงินอย่างน้อย 1 บรรทัด'); return; }
  if(btn){ btn.disabled=true; btn.textContent='กำลังบันทึก…'; }
  try{
    const slipId=uid('sl'); const bank=g('slip_bank').value, fu=g('slip_fu').value.trim()||null, sdate=g('slip_date').value||TODAY, note=g('slip_note').value.trim()||null;
    const file=g('slip_file').files[0]; let doc_path=null,doc_name=null;
    if(file){ const ext=(file.name.split('.').pop()||'bin').toLowerCase(); doc_path='income/'+slipId+'.'+ext; await uploadTo('cf-receipts',doc_path,file); doc_name=file.name; }
    let matched=0, created=0, totThb=0, totUsd=0; const lineIds=[]; const unresolved=[];
    for(const r of rows){
      const usd=parseFloat(r.usd)||0, thb=parseFloat(r.thb)||0, rate=parseFloat(r.rate)||null;
      const amt = usd>0?usd:thb; totThb+=thb; totUsd+=usd;
      const lt=SLIP_TYPES[r.type]||'deposit'; const method=ccToMethod(r.cctype);
      const pm={slip_id:slipId}; if(method==='card'){ pm.card_brand=r.cctype; if(r.last4)pm.card_last4=String(r.last4); if(thb)pm.card_thb=thb; }
      if(rate)pm.rate=rate; if(usd)pm.usd=usd;
      const memo='สลิปรับเงิน · '+(r.type||'')+(r.cctype?(' · '+r.cctype):'')+(fu?(' · '+fu):'');
      const ent=findIncomeEntryByCno(r.cno); let target=null;
      if(ent){ const cand=DB.lines.filter(l=>l.entry_id===ent.id && !l.paid && (l.line_type||'')===lt);
        target = cand.find(l=>Math.abs(Number(l.amount)-amt)<0.5) || cand.slice().sort((a,b)=>a.txn_date<b.txn_date?-1:1)[0] || null; }
      if(target){
        await patchRow('cf_lines',target.id,{paid:true,paid_date:sdate,paid_amount:amt,method,paid_note:note,paid_by:USER&&USER.email,proof_path:doc_path,proof_name:doc_name,pay_meta:pm});
        await logPayAudit(target,'record',null,{slip:slipId,via:'income-slip'}); lineIds.push(target.id); matched++;
      } else {
        let entId=ent?ent.id:null;
        if(!entId){ entId=uid('en'); await upsert('cf_entries',[{id:entId,kind:'income',title:normCno(r.cno),category:normCno(r.cno),active:true,meta:{source:'income-slip'}}]); unresolved.push(r.cno); }
        const lid=uid('ln');
        await upsert('cf_lines',[{id:lid,entry_id:entId,amount:amt,txn_date:sdate,repeat:'never',line_type:lt,memo,paid:true,paid_date:sdate,paid_amount:amt,method,paid_note:note,paid_by:USER&&USER.email,proof_path:doc_path,proof_name:doc_name,pay_meta:pm}]);
        lineIds.push(lid); created++;
      }
    }
    await upsert('cf_income_slips',[{id:slipId,slip_date:sdate,bank,method:null,fu,doc_path,doc_name,total_thb:Math.round(totThb),total_usd:Math.round(totUsd),line_count:rows.length,note,meta:{matched,created,line_ids:lineIds,new_contracts:unresolved},created_by:USER&&USER.email}]);
    await reloadEL(); await loadIncomeSlips();
    closeModal(); toast('บันทึกแล้ว · ตัด AR '+matched+' บิล · บันทึกใหม่ '+created+' บิล');
    incomePaint();
  }catch(e){ toast('บันทึกไม่สำเร็จ: '+e.message); if(btn){ btn.disabled=false; btn.textContent='บันทึก + ตัด AR'; } }
}

     <div class="kpi"><div class="v">${(r.meta&&r.meta.matched)||0}/${(r.meta&&r.meta.created)||0}</div><div class="l">ตัด AR / ใหม่</div></div></div>

   <div class="right" style="margin-top:14px"><button class="btn ghost" onclick="closeModal()">ปิด</button><button class="btn" onclick="closeModal();goto('receipts')">ไปที่ Receipts</button></div>`);
}

/* ============ Contract payment history — one contract, all its slips/instalments on a timeline ============ */
const CH_TYPE={deposit:'มัดจำ',installment:'งวดผ่อน',admin:'ค่าธรรมเนียม',mfee:'ค่าบริหารรายปี',booking:'ค่าจอง',
  ii_fee:'Interval',ii_renewal:'Interval ต่ออายุ',ii_exchange:'Interval แลกสัปดาห์'};
function chTypeLabel(t){ return CH_TYPE[t]||t||'อื่นๆ'; }
function chData(){
  const g={};
  allLines().forEach(({l,e})=>{ if(e.kind!=='income') return;
    const cat=e.category||('entry:'+e.id);
    const o=(g[cat]=g[cat]||{cat,cno:e.category||null,name:'',ptype:'',lines:[],tot:0,paid:0,out:0,n:0,paidN:0,ents:{}});
    o.ents[e.id]=e;
    if(e.description&&!o.name) o.name=(e.description||'').replace(/\n/g,' & ');
    if(e.meta&&e.meta.product_type&&!o.ptype) o.ptype=e.meta.product_type;
    const a=Number(l.amount||0); o.lines.push({l,e}); o.n++; o.tot+=a;
    if(l.paid){ o.paid+=Number(l.paid_amount!=null?l.paid_amount:a); o.paidN++; } else o.out+=a;
  });
  return Object.values(g).sort((a,b)=>(a.cat<b.cat?-1:1));
}
function chSelect(cat){ S.chSel=cat; render(); setTimeout(()=>{ const d=g('ch_detail'); if(d) d.scrollIntoView({behavior:'smooth',block:'start'}); },60); }
function chSearch(v){ S.chQ=v; const list=g('ch_list'); if(list) list.innerHTML=chListHtml(); }
function chListHtml(){
  const q=(S.chQ||'').trim().toLowerCase();
  let data=chData();
  if(q) data=data.filter(o=>(o.cat+' '+o.name).toLowerCase().indexOf(q)>=0);
  if(!data.length) return '<div class="emptyc" style="padding:20px">ไม่พบสัญญา</div>';
  return data.map(o=>{ const pct=o.tot>0?Math.min(100,o.paid/o.tot*100):0; const done=o.out<=0&&o.paidN>0; const on=S.chSel===o.cat;
    return `<button class="chrow${on?' on':''}" onclick="chSelect('${esc(o.cat)}')">
      <div class="chrow-top"><b>${esc(o.cat)}</b>${done?'<span class="pill inc" style="font-size:9.5px">ครบ</span>':(o.out>0?'<span class="mini" style="color:var(--ink3)">'+o.paidN+'/'+o.n+'</span>':'')}</div>
      <div class="mini chrow-name">${esc(o.name||'—')}</div>
      <div class="chbar"><div class="chbar-fill" style="width:${pct.toFixed(0)}%"></div></div>
    </button>`; }).join('');
}
function rContractHistory(){
  const data=chData();
  if(S.chSel && !data.some(o=>o.cat===S.chSel)) S.chSel=null;
  const head=`<div class="head"><div><h1>ประวัติจ่ายรายสัญญา</h1><p class="mini">เลือกสัญญา แล้วดูทุกงวด/ทุกสลิปที่จ่ายเข้ามา รวมไว้ในไทม์ไลน์เดียว · ยอดจ่ายแล้ว / คงเหลือ</p></div></div>`;
  const panel=`<div class="chgrid">
    <div class="card pad chside">
      <input id="ch_search" placeholder="ค้นหาสัญญา / ชื่อลูกค้า…" value="${esc(S.chQ||'')}" oninput="chSearch(this.value)" style="width:100%;margin-bottom:10px">
      <div id="ch_list" class="chlist">${chListHtml()}</div>
    </div>
    <div id="ch_detail" class="chdetail">${chDetailHtml(S.chSel)}</div>
  </div>`;
  g('main').innerHTML=head+panel;

function chDetailHtml(cat){
  if(!cat) return `<div class="card"><div class="emptyc" style="padding:40px"><div class="big">👈</div>เลือกสัญญาทางซ้ายเพื่อดูประวัติการจ่าย</div></div>`;
  const o=chData().find(x=>x.cat===cat); if(!o) return '';
  const rows=o.lines.slice().sort((a,b)=>{ const da=a.l.paid?(a.l.paid_date||a.l.txn_date):a.l.txn_date, db=b.l.paid?(b.l.paid_date||b.l.txn_date):b.l.txn_date; return da<db?-1:(da>db?1:0); });
  const mainE=Object.values(o.ents)[0]||{};
  const cp=o.cno?contractPathFor(o.cno):{path:null};
  const scan=cp.path?` · 📄 <a href="#" onclick="openFile('cf-contracts','${esc(cp.path)}');return false">สัญญา PDF</a>`:'';
  const pct=o.tot>0?Math.min(100,o.paid/o.tot*100):0;
  const kpis=`<div class="kpis" style="margin-bottom:14px">
    <div class="kpi"><div class="v" style="color:var(--income)">${fmt(o.paid)}</div><div class="l">จ่ายแล้ว (${o.paidN}/${o.n} งวด)</div></div>
    <div class="kpi"><div class="v" style="color:${o.out>0?'var(--expense)':'var(--ink)'}">${fmt(o.out)}</div><div class="l">คงเหลือ</div></div>
    <div class="kpi"><div class="v">${fmt(o.tot)}</div><div class="l">มูลค่ารวมตามสัญญา</div></div></div>`;
  const bar=`<div class="chbar" style="height:8px;margin:0 0 16px"><div class="chbar-fill" style="width:${pct.toFixed(0)}%"></div></div>`;
  const tl=rows.map(({l,e})=>{
    const paid=!!l.paid; const dt=paid?(l.paid_date||l.txn_date):l.txn_date;
    const overdue=!paid && l.txn_date<TODAY;
    const dot=paid?'var(--income)':(overdue?'var(--expense)':'var(--ink3)');
    const proof=l.proof_path?` · <a href="#" onclick="openFile('cf-receipts','${esc(l.proof_path)}');return false" title="${esc(l.proof_name||'')}">📎 สลิป</a>`:'';
    const method=paid?(esc(methodLabel(l.method))+cardTag(l)):'';
    const stpill=paid?'<span class="pill inc">✓ จ่ายแล้ว</span>':(overdue?'<span class="pill exp">เกินกำหนด</span>':'<span class="pill off">รอจ่าย</span>');
    const note=l.paid_note?`<div class="mini" style="color:var(--ink3);margin-top:2px">${esc(l.paid_note)}</div>`:'';
    return `<div class="chtl-item">
      <div class="chtl-dot" style="background:${dot}"></div>
      <div class="chtl-body">
        <div class="chtl-row"><div><b>${chTypeLabel(l.line_type)}</b> <span class="mini" style="color:var(--ink3)">${esc(l.memo||'')}</span></div><div class="chtl-amt">${fmt(l.paid_amount!=null&&paid?l.paid_amount:l.amount)}</div></div>
        <div class="mini" style="color:var(--ink2)">${fmtDate(dt)} ${stpill} ${method?'· '+method:''}${proof}</div>
        ${note}
      </div></div>`;
  }).join('');
  return `<div class="card">
    <div class="pad" style="border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline">
        <div><h2 style="margin:0;font-size:22px">${esc(o.cat)}</h2><div class="mini" style="color:var(--ink2);margin-top:2px">${esc(o.name||'—')}${o.ptype?' · '+esc(o.ptype):''}${scan}</div></div>
        ${o.out<=0&&o.paidN>0?'<span class="pill inc">ชำระครบ</span>':''}
      </div>
    </div>
    <div class="pad">${kpis}${bar}<div class="chtl">${tl}</div></div>
  </div>`;
}

function rReceipts(){
  // group by CONTRACT (category); entries with no category fall back to their own id
  const groups={}; const kindOf={};
  allLines().forEach(({l,e})=>{ const k=rcKey(e); const g=(groups[k]=groups[k]||{key:k,cno:e.category||null,entries:{},items:[]}); g.items.push({l,e}); g.entries[e.id]=e; kindOf[l.id]=e.kind; });
  // KPIs cover INCOME only (money in). Expenses (we pay) are shown per contract but not counted as receipts.
  const soon=addDaysISO(TODAY,30); let recv=0,out=0,odue=0,odueN=0,dueSoon=0, payOut=0;
  allLines().forEach(({l,e})=>{ const a=Number(l.amount)||0;
    if(e.kind==='expense'){ if(!l.paid) payOut+=a; return; }
    if(l.paid) recv+=Number(l.paid_amount!=null?l.paid_amount:a); else { out+=a; if(l.txn_date<TODAY){odue+=a;odueN++;} else if(l.txn_date<=soon) dueSoon+=a; } });
  const head=`<div class="head"><div><h1>Contracts &amp; Payments</h1><p class="mini">One card per contract · money in (mark received) and Interval fees we pay (mark paid), each with its slip / credit advice · store the signed contract scan</p></div></div>`;
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="v" style="color:var(--income)">${fmt(recv)}</div><div class="l">Received to date</div></div>
    <div class="kpi"><div class="v">${fmt(out)}</div><div class="l">Outstanding (to receive)</div></div>
    <div class="kpi"><div class="v" style="color:var(--expense)">${fmt(odue)}</div><div class="l">${odueN} instalment(s) overdue</div></div>
    <div class="kpi"><div class="v" style="color:var(--expense)">${fmt(payOut)}</div><div class="l">Interval fees to pay</div></div></div>`;
  const list=Object.values(groups).sort((a,b)=>(a.cno||'')<(b.cno||'')?-1:1);
  const bar=`<div class="toolbar" style="margin-bottom:10px"><button class="btn sm ghost" onclick="rcAll(true)">Expand all</button><button class="btn sm ghost" onclick="rcAll(false)">Collapse all</button></div>`;
  const rowFor=(l)=>{ const st=lineStatus(l); const exp=kindOf[l.id]==='expense';
      const pill= st==='paid'?`<span class="pill inc">✓ ${exp?'Paid':'Received'}</span>`:(st==='overdue'?'<span class="pill exp">● Overdue</span>':`<span class="pill off">${exp?'To pay':'Due'}</span>`);
      const proof= l.proof_path?`<a href="#" onclick="openFile('cf-receipts','${esc(l.proof_path)}');return false" title="${esc(l.proof_name||'')}">📎 evidence</a>`:'<span class="mini" style="opacity:.4">no file</span>';
      const act= l.paid?`<button class="btn link" onclick="markReceived('${esc(l.id)}')">${lineLocked(l)?'🔒 view':'edit'}</button>`:`<button class="btn sm ${exp?'ghost':'pri'}" onclick="markReceived('${esc(l.id)}')">${exp?'Mark paid':'Mark received'}</button>`;
      return `<tr><td>${fmtDate(l.txn_date)}</td><td>${esc(l.memo||l.line_type||'')}</td><td class="n"${exp?' style="color:var(--expense)"':''}>${exp?'−':''}${fmt(l.amount)}</td><td>${pill}</td><td>${l.paid?fmtDate(l.paid_date):'<span class="mini" style="opacity:.4">—</span>'}</td><td class="mini">${l.paid?esc(methodLabel(l.method))+cardTag(l):''}</td><td>${l.paid?proof:''}</td><td>${act}</td></tr>`; };
  const blocks=list.map(gp=>{
    const open=!!S.rcOpen[gp.key];
    const allL=gp.items.map(x=>x.l);
    const incL=gp.items.filter(x=>x.e.kind!=='expense').map(x=>x.l); const expL=gp.items.filter(x=>x.e.kind==='expense').map(x=>x.l);
    const paidN=incL.filter(l=>l.paid).length; const paidSum=incL.filter(l=>l.paid).reduce((s,l)=>s+Number(l.paid_amount!=null?l.paid_amount:l.amount),0);
    const totSum=incL.reduce((s,l)=>s+Number(l.amount||0),0);
    const expTot=expL.reduce((s,l)=>s+Number(l.amount||0),0);
    const odN=incL.filter(l=>!l.paid && l.txn_date<TODAY).length;
    const ents=Object.values(gp.entries);
    const mainE = ents.find(e=>gp.items.some(x=>x.e.id===e.id && ['deposit','admin','installment'].includes(x.l.line_type))) || ents.find(e=>/sales/i.test(e.title||'')) || ents[0];
    // build sectioned rows
    let rows='';
    RC_SECTIONS.forEach(([label,types])=>{
      let sl=allL.filter(l=> types? types.includes(l.line_type) : !RC_KNOWN.includes(l.line_type));
      if(!sl.length) return; sl.sort((a,b)=>a.txn_date<b.txn_date?-1:1);
      const isExp=sl.every(l=>kindOf[l.id]==='expense');
      const sp=sl.filter(l=>l.paid).length; const stot=sl.reduce((s,l)=>s+Number(l.amount||0),0);
      rows+=`<tr><td colspan="8" style="background:var(--line2);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:${isExp?'var(--expense)':'var(--ink2)'}">${label} · ${sp}/${sl.length} ${isExp?'paid':'received'} · ${fmt(stot)}</td></tr>`+sl.map(rowFor).join('');
    });
    const cp = gp.cno? contractPathFor(gp.cno) : {path:null};
    const scan= !gp.cno ? '' : (cp.path
      ? `📄 <a href="#" onclick="openFile('cf-contracts','${esc(cp.path)}');return false">${esc(cp.name||'Signed contract')}</a> · <button class="btn link" onclick="uploadContract('${esc(mainE.id)}')">replace</button>`
      : `<button class="btn sm ghost" onclick="uploadContract('${esc(mainE.id)}')">📄 Upload signed contract</button>`);
    const badge= odN?` <span class="pill exp">${odN} overdue</span>`:(paidN===incL.length&&incL.length?' <span class="pill inc">complete</span>':'');
    return `<div class="card" id="rc_${cssId(gp.key)}" style="margin-bottom:10px;transition:box-shadow .3s"><div class="pad rc-head" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;cursor:pointer" onclick="toggleRc('${esc(gp.key)}')">
      <div><b>${open?'▾':'▸'} ${esc(gp.cno||mainE.title)}</b> <span class="mini">· ${esc((mainE.description||'').replace(/\n/g,' / '))}</span>${badge}${metaLine(mainE)?'<br><span class="mini" style="opacity:.85">'+esc(metaLine(mainE))+'</span>':''}<br><span class="mini">Received ${fmt(paidSum)} / ${fmt(totSum)} · ${paidN}/${incL.length} instalments${expTot?' · <span style="color:var(--expense)">Interval we pay '+fmt(expTot)+'</span>':''}</span></div>
      <div class="mini" onclick="event.stopPropagation()">${scan}</div></div>
      ${open?`<div style="overflow:auto;border-top:1px solid var(--line)"><table><thead><tr><th>Date</th><th>Item</th><th class="n">Amount</th><th>Status</th><th>Recorded</th><th>Method</th><th>Evidence</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:''}</div>`;
  }).join('');
  g('main').innerHTML=head+kpis+bar+(blocks||'<div class="card"><div class="emptyc">No contracts yet.</div></div>');
}
/* ===== Payment record locking + audit trail =====
   A payment that is paid AND has evidence attached is LOCKED (read-only). Unlocking to edit needs a reason and is logged.
   Every change (record/edit/unlock/undo/replaced evidence) is written to cf_pay_audit for review. Old evidence files are kept, never overwritten. */
function lineLocked(l){ return !!(l && l.paid && l.proof_path); }
function catOf(l){ return (DB.entries.find(e=>e.id===l.entry_id)||{}).category||null; }
async function logPayAudit(l, action, reason, detail){
  try{ await api('cf_pay_audit',{method:'POST',prefer:'return=minimal',body:JSON.stringify([{
    line_id:l.id, entry_id:l.entry_id, contract:catOf(l), action:action, actor:(USER&&USER.email)||null, reason:reason||null, detail:detail||null}])}); }catch(e){}
}
async function unlockPay(id){
  const l=DB.lines.find(x=>x.id===id); if(!l) return;
  const reason=prompt('This payment is LOCKED (paid + evidence attached).\nEnter a reason to unlock it for editing — this is logged:');
  if(reason===null) return; if(!reason.trim()){ toast('A reason is required to unlock'); return; }
  await logPayAudit(l,'unlock',reason.trim());
  S.payUnlocked=S.payUnlocked||{}; S.payUnlocked[id]=true;
  toast('Unlocked for editing'); markReceived(id);
}
async function loadPayAudit(id){ const box=g('r_audit'); if(!box) return;
  try{ const rows=await api('cf_pay_audit?select=*&line_id=eq.'+encodeURIComponent(id)+'&order=ts.desc&limit=30');
    if(!rows||!rows.length){ box.innerHTML='<span class="mini" style="opacity:.5">No changes recorded yet.</span>'; return; }
    box.innerHTML=rows.map(r=>{ const d=r.detail||{}; let ch='';
      if(d.changes) ch=Object.entries(d.changes).map(([k,v])=>`<div class="mini" style="opacity:.8">${esc(k)}: ${esc(String(v.from))} → ${esc(String(v.to))}</div>`).join('');
      const oldf=d.old_proof_path?` · <a href="#" onclick="openFile('cf-receipts','${esc(d.old_proof_path)}');return false">ไฟล์เดิม</a>`:'';
      const A={record:'บันทึกจ่าย',edit:'แก้ไข',unlock:'ปลดล็อก',undo:'ยกเลิกจ่าย','replace-evidence':'เปลี่ยนหลักฐาน'};
      return `<div style="padding:6px 0;border-top:1px solid var(--line2)"><b>${esc(A[r.action]||r.action)}</b> · ${fmtDate(String(r.ts).slice(0,10))} · ${esc(r.actor||'')}${r.reason?'<br><span class="mini">เหตุผล: “'+esc(r.reason)+'”</span>':''}${ch}${oldf}</div>`;
    }).join('');
  }catch(e){ box.innerHTML='<span class="mini">ประวัติโหลดไม่ได้</span>'; }
}

     <div><label>Date</label><div>${l.paid_date?fmtDate(l.paid_date):'—'}</div></div>

     <div><label>Reference / note</label><div>${esc(l.paid_note||'—')}</div></div>
   </div>
   ${(pm.card_last4||pm.card_brand)?`<div class="full" style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px"><div style="font-weight:700;font-size:13px;margin-bottom:6px">💳 Card slip</div><div class="mini">${[pm.card_brand,pm.card_last4?'••'+esc(pm.card_last4):'',pm.card_thb?'THB '+Number(pm.card_thb).toLocaleString():'',pm.card_ref?'ref '+esc(pm.card_ref):'',pm.card_auth?'auth '+esc(pm.card_auth):'',pm.card_term?esc(pm.card_term):''].filter(Boolean).join(' · ')}</div></div>`:''}

   <div id="lv_preview" class="proofview">กำลังโหลดสลิป…</div>`:'<div class="mini" style="margin-top:10px;opacity:.5">ไม่มีหลักฐานแนบ</div>'}
   <div style="margin-top:14px"><label>ประวัติการเปลี่ยนแปลง (audit)</label><div id="r_audit" style="margin-top:4px">กำลังโหลด…</div></div>

}

      ${l.proof_path?`<div class="mini" style="margin-top:4px">Current: ${esc(l.proof_name||'file')} · <a href="#" onclick="openFile('cf-receipts','${esc(l.proof_path)}');return false">view</a></div>`:''}</div>
   </div>
   ${l.paid?`<div style="margin-top:12px"><label>ประวัติการเปลี่ยนแปลง (audit)</label><div id="r_audit" style="margin-top:4px">กำลังโหลด…</div></div>`:''}
   <div class="right">${l.paid?`<button class="btn danger" onclick="undoReceipt('${esc(l.id)}')">Undo ${exp?'payment':'received'}</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn pri" id="r_save" onclick="saveReceipt('${esc(l.id)}')">Save</button></div>`);
  if(l.paid) loadPayAudit(l.id);

async function saveReceipt(id){
  const btn=g('r_save'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  try{
    const l=DB.lines.find(x=>x.id===id); const wasPaid=!!l.paid; const file=g('r_file').files[0]; let path=l.proof_path||null, name=l.proof_name||null; let oldProof=null;
    if(file){ if(l.proof_path){ oldProof=l.proof_path; } const ext=(file.name.split('.').pop()||'bin').toLowerCase(); path='receipts/'+id+'-'+Date.now()+'.'+ext; await uploadTo('cf-receipts',path,file); name=file.name; }
    const method=g('r_method').value;
    let pay_meta=null;
    if(method==='card'){
      const pm={};
      const gv=id2=>{const el=g(id2);return el?String(el.value).trim():'';};
      const brand=gv('r_card_brand'); if(brand&&brand!=='—') pm.card_brand=brand;
      const last4=gv('r_card_last4'); if(last4) pm.card_last4=last4;
      const thb=gv('r_card_thb'); if(thb) pm.card_thb=parseFloat(thb);
      const ref=gv('r_card_ref'); if(ref) pm.card_ref=ref;
      const auth=gv('r_card_auth'); if(auth) pm.card_auth=auth;
      const term=gv('r_card_term'); if(term) pm.card_term=term;
      if(Object.keys(pm).length) pay_meta=pm;
    }
    const patch={paid:true,paid_date:g('r_date').value||TODAY,paid_amount:parseFloat(g('r_amt').value)||Number(l.amount),method:method,paid_note:g('r_note').value.trim()||null,paid_by:USER&&USER.email,proof_path:path,proof_name:name,pay_meta:pay_meta};
    await patchRow('cf_lines',id,patch);
    // audit: what changed
    const F=(a,b)=>String(a==null?'':a)!==String(b==null?'':b);
    const changes={};
    if(F(l.paid_date,patch.paid_date)) changes['date']={from:l.paid_date||'—',to:patch.paid_date};
    if(F(l.paid_amount,patch.paid_amount)) changes['amount']={from:l.paid_amount!=null?fmt(l.paid_amount):'—',to:fmt(patch.paid_amount)};
    if(F(l.method,patch.method)) changes['method']={from:methodLabel(l.method)||'—',to:methodLabel(patch.method)};
    if(F(l.paid_note,patch.paid_note)) changes['note']={from:l.paid_note||'—',to:patch.paid_note||'—'};
    const detail={}; if(Object.keys(changes).length) detail.changes=changes;
    if(file) detail.new_proof=name; if(oldProof) detail.old_proof_path=oldProof;
    await logPayAudit(l, wasPaid?'edit':'record', null, Object.keys(detail).length?detail:null);
    if(oldProof) await logPayAudit(l,'replace-evidence',null,{old_proof_path:oldProof,new_proof:name});
    if(S.payUnlocked) delete S.payUnlocked[id];
    closeModal(); toast(wasPaid?'Payment updated':'Payment recorded'); await loadAll(); S.tab='receipts'; render();
